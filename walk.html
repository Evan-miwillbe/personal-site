<html lang="zh-CN">

<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
:root{
  --paper:#f8f4ed;
  --paper-soft:#efe8d8;
  --ink:#2a2520;
  --ink-soft:#8a877e;
  --vermilion:#7F2020;
  --vermilion-soft:#a84747;
  --gold:#c8a050;
  --gold-soft:#b89968;
  --tile:#2a2a2a;
  --moss:#6b8e5a;
  --water:#4d6873;
  --hud-bg:rgba(248,244,237,0.62);
  --hud-border:rgba(127,32,32,0.4);
  --hud-blur:blur(14px) saturate(1.1);
  --cinnabar-line:1px solid rgba(127,32,32,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#d4cdc0;color:#2a2520;font-family:'Inter','Noto Serif SC',-apple-system,BlinkMacSystemFont,sans-serif;cursor:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ============ Cursor Ring ============ */
.cursor-ring{position:fixed;top:0;left:0;width:42px;height:42px;margin:-21px 0 0 -21px;pointer-events:none;z-index:10000;will-change:transform;display:flex;align-items:center;justify-content:center;background:transparent;border:0;transform:translate3d(-100px,-100px,0)}
.cursor-ring .circle{width:100%;height:100%;border-radius:50%;background:rgba(127,32,32,0.14);border:1.5px solid rgba(127,32,32,0.5);backdrop-filter:blur(4px) saturate(1.1);-webkit-backdrop-filter:blur(4px);transform:scale(.38);transition:transform .35s cubic-bezier(.55,.085,0,.99),background-color .25s,border-color .25s,box-shadow .25s,backdrop-filter .25s}
.cursor-ring.far .circle{transform:scale(.43);background:rgba(184,153,104,0.12);border-color:rgba(184,153,104,0.4);box-shadow:0 0 12px rgba(184,153,104,0.16)}
.cursor-ring.near .circle{transform:scale(.52);background:rgba(200,160,80,0.16);border-color:rgba(200,160,80,0.7);box-shadow:0 0 18px rgba(200,160,80,0.25)}
.cursor-ring.trigger .circle{transform:scale(.67);background:rgba(255,212,128,0.22);border-color:rgba(255,212,128,1);box-shadow:0 0 24px rgba(255,212,128,0.42)}
.cursor-ring.hover .circle{transform:scale(.95);background:rgba(127,32,32,0.22);border-color:rgba(127,32,32,0.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cursor-ring.text .circle{transform:scale(1.2);background:rgba(127,32,32,0.32);border-color:rgba(127,32,32,0);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cursor-ring .cr-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.3);font-family:'Noto Serif SC',serif;font-size:11px;font-weight:500;color:#f8f4ed;letter-spacing:.04em;white-space:nowrap;opacity:0;transition:opacity .22s .12s,transform .35s cubic-bezier(.55,.085,0,.99) .06s;pointer-events:none}
.cursor-ring.text .cr-label{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cursor-ring.click .circle{transform:scale(.6)}
/* Locked state: centered crosshair with inner dot + outer ring */
.cursor-ring.locked{top:50%;left:50%;transform:none!important;margin:-21px 0 0 -21px}
.cursor-ring.locked .circle{transform:scale(.55);background:rgba(248,244,237,0.08);border:1.5px solid rgba(248,244,237,0.55);box-shadow:0 0 0 1px rgba(0,0,0,0.15),0 0 16px rgba(248,244,237,0.12)}
.cursor-ring.locked .circle::after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(248,244,237,0.85)}
.cursor-ring.locked.click .circle{transform:scale(.42);border-color:rgba(200,160,80,0.9);box-shadow:0 0 18px rgba(200,160,80,0.3)}
@media (hover:none),(pointer:coarse){.cursor-ring{display:none}}

/* ============ HUD frames ============ */
/* 黑悟空式 HUD 隐而不显: idle 0.18, active 1, 3s 后 fade 回 */
.hud{position:fixed;background:var(--hud-bg);backdrop-filter:var(--hud-blur);-webkit-backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#2a2520;z-index:50;letter-spacing:0.04em;line-height:1.5;opacity:0.18;transition:opacity 0.7s ease}
.hud.active{opacity:1}
.helper{opacity:0.22;transition:opacity 0.7s ease}
.helper.active{opacity:1}

/* ============ Brand ============ */
.brand{position:fixed;top:18px;left:24px;z-index:100;font-family:'Noto Serif SC',serif;font-size:14px;color:#2a2520;letter-spacing:0.08em;text-decoration:none;background:transparent;text-shadow:0 1px 12px rgba(248,244,237,0.85)}
.brand .sep{color:var(--vermilion);margin:0 0.5em}
.brand:hover{color:var(--vermilion)}

/* ============ Top-right nav ============ */
.toplinks{position:fixed;top:22px;right:24px;z-index:100;display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:lowercase;letter-spacing:0.06em;text-shadow:0 1px 12px rgba(248,244,237,0.85)}
.toplinks a{color:#4a4540;text-decoration:none;padding:2px 0;border-bottom:1px solid transparent;transition:color 0.2s,border-color 0.2s}
.toplinks a:hover{color:var(--vermilion);border-bottom-color:var(--vermilion)}
.toplinks a.active{color:var(--vermilion);border-bottom:1px solid var(--vermilion)}
.toplinks .dot{color:var(--ink-soft);opacity:0.5;user-select:none}
@media (max-width:640px){
  .brand{top:14px;left:18px;font-size:13px}
  .toplinks{top:44px;left:18px;right:auto;gap:12px;font-size:10px}
}

/* ============ Status / helper ============ */
.status{bottom:22px;left:24px;display:flex;flex-direction:column;gap:3px}
.status .row{display:flex;justify-content:space-between;gap:18px;min-width:180px}
.status .label{color:var(--ink-soft);opacity:0.72}
.status .val{color:#2a2520;font-weight:500}
.helper{bottom:22px;right:24px;display:flex;gap:10px;align-items:center;position:fixed;z-index:50}
.helper .ic{width:28px;height:28px;border:var(--cinnabar-line);background:rgba(248,244,237,0.62);backdrop-filter:var(--hud-blur);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--vermilion);cursor:none;border-radius:50%;font-family:'JetBrains Mono',monospace}
.helper .ic.breath{animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:0.7}50%{opacity:1}}

/* ============ Scroll Hint ============ */
.scrollHint{position:fixed;bottom:90px;right:24px;z-index:60;background:rgba(248,244,237,0.78);backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:12px 16px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:0.08em;min-width:170px;max-width:240px;line-height:1.7;opacity:0;transform:translateX(80px) scaleX(0.2);transform-origin:right center;transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1),transform 0.6s cubic-bezier(0.16,1,0.3,1)}
.scrollHint.show{opacity:1;transform:translateX(0) scaleX(1)}
.scrollHint .label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--vermilion);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px}
.scrollHint .title{font-size:15px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.scrollHint .sub{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace}

/* ============ Vignette (沉浸感: 黑悟空式压暗四角) ============ */
.vignette{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(ellipse at center, transparent 38%, rgba(20,14,8,0.18) 70%, rgba(8,4,2,0.55) 100%);mix-blend-mode:multiply}

/* ============ Flytext ============ 黑悟空式弱化: 64px + 不爆出 */
.flytext{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);font-family:'Noto Serif SC',serif;font-weight:500;font-size:64px;color:#7F2020;letter-spacing:0.24em;pointer-events:none;z-index:200;opacity:0;text-shadow:0 0 18px rgba(127,32,32,0.25)}
.flytext.show{animation:flytext 1.4s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes flytext{0%{opacity:0;transform:translate(-50%,-50%) scale(0.94)}30%{opacity:0.85;transform:translate(-50%,-50%) scale(1.0)}75%{opacity:0.85;transform:translate(-50%,-50%) scale(1.0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.02)}}

/* ============ Prompt ============ */
.prompt{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);background:rgba(248,244,237,0.78);backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:8px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:0.1em;z-index:80;opacity:0;transition:opacity 0.35s;pointer-events:none}
.prompt.show{opacity:1}
.prompt .k{font-family:'JetBrains Mono',monospace;color:var(--vermilion);padding:1px 6px;border:1px solid rgba(127,32,32,0.3);margin-right:6px;font-size:11px}

/* ============ Dialog Card ============ */
.dialogCard{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120%);width:min(860px,92vw);height:clamp(220px,28vh,360px);background:rgba(248,244,237,0.94);backdrop-filter:blur(20px) saturate(1.1);-webkit-backdrop-filter:blur(20px);border-left:4px solid var(--vermilion);box-shadow:0 14px 44px rgba(0,0,0,0.20);display:flex;gap:24px;padding:20px 28px 20px 20px;z-index:500;opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .35s ease}
.dialogCard.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.dialogPortrait{width:180px;flex-shrink:0;height:100%;background:rgba(244,234,208,0.4);border:1px solid rgba(127,32,32,0.18);position:relative;overflow:hidden}
.dialogPortrait img{width:100%;height:100%;display:block;object-fit:cover}
.dialogBody{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.dialogName{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--vermilion);font-weight:500;margin-bottom:2px;line-height:1.3}
.dialogMeta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:12px;letter-spacing:0.06em}
.dialogText{font-family:'Noto Serif SC',serif;font-size:15px;line-height:1.85;color:var(--ink);flex:1;overflow-y:auto;padding-right:8px;white-space:pre-wrap;word-wrap:break-word;min-height:0;cursor:none}
.dialogText::-webkit-scrollbar{width:6px}
.dialogText::-webkit-scrollbar-thumb{background:rgba(127,32,32,0.25);border-radius:3px}
.dialogTags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.dialogTag{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 8px;border:1px solid rgba(127,32,32,0.32);color:var(--vermilion);letter-spacing:0.06em}
.dialogHub{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.dialogHub button{font-family:'Noto Serif SC',serif;font-size:13px;padding:6px 16px;background:transparent;border:1px solid rgba(127,32,32,0.35);color:var(--vermilion);cursor:none;letter-spacing:0.08em;transition:background .2s}
.dialogHub button:hover{background:rgba(127,32,32,0.08)}

/* ============ Intro Overlay ============ */
.intro{position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Noto Serif SC',serif;color:#f8f4ed;transition:opacity 1.2s ease,background 1.2s ease}
.intro .raindrops{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to bottom, transparent 0%, rgba(184,200,212,0.12) 20%, transparent 30%);background-size:2px 80px;animation:rainfall 0.8s linear infinite;opacity:0.7}
.intro.fade .raindrops{opacity:0.3}
.intro.gone{opacity:0;pointer-events:none}
@keyframes rainfall{from{background-position:0 0}to{background-position:0 80px}}
.intro .typography{text-align:center;z-index:2;transform:translateY(20px);opacity:0;transition:transform 1s ease,opacity 1s ease}
.intro.show-type .typography{transform:translateY(0);opacity:1}
.intro h1{font-size:34px;font-weight:500;margin:0 0 8px;color:#f8f4ed;letter-spacing:0.32em}
.intro .sub{font-family:'JetBrains Mono',monospace;font-size:12px;color:#a8a098;letter-spacing:0.32em;margin-bottom:28px}
.intro .start{font-family:'Noto Serif SC',serif;font-size:14px;color:#f8f4ed;padding:10px 28px;border:1px solid rgba(248,244,237,0.4);background:transparent;cursor:none;letter-spacing:0.18em;transition:background 0.2s,border-color 0.2s}
.intro .start:hover{background:rgba(248,244,237,0.08);border-color:#f8f4ed}
.intro .controls{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#a8a098;letter-spacing:0.08em;line-height:1.9;text-align:center}
.intro .controls .k{color:#f8f4ed;font-weight:500}
.intro .gate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;background:radial-gradient(ellipse at center, rgba(248,244,237,0.95) 0%, rgba(248,244,237,0.3) 60%, transparent 100%);transition:width 0.6s ease,height 0.6s ease,opacity 0.8s ease;opacity:0;pointer-events:none}
.intro.gate-open .gate{width:80vw;height:80vh;opacity:1}
.intro.gate-open .typography{opacity:0;transform:translateY(-30px)}
</style>
</head>

window.addEventListener('error', e => {

  console.error('CAPTURED:', e.message, '@', e.filename, ':', e.lineno);
});
window.addEventListener('unhandledrejection', e => {

  console.error('REJECTION:', e.reason);
});
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ===================== DATA =====================
const D = window.SITE_DATA || { projects: [], contacts: [], awards: [], experiences: [], meta: {} };

const P_NAMES = {
  'p-multi-agent-research': '听雨阁',
  'p-knowledge-healer':     '鉴心亭',
  'p-lark-survey-scoreboard':'应实榭',
  'p-obsidian-lifeos':      '墨守轩',
  'p-bitable-orchestrator': '格物台',
  'a-feishu-top10':         '云阙碑',
  'a-shanghai-campus-news': '海鸥碑',
  'a-pap-merit':            '戎籍碑',
  'c-github':               '源石门',
  'c-email':                '鸿雁门',
  'c-phone':                '传讯门',
  'c-location':             '上海·中',
};

// ===================== PALETTE (v4 竹林海·晨雾) =====================
const C = {
  // 天空·晨雾 (cool mist with hint of warm gold)
  sky:0xd8e0d2, skyMid:0xcdd6c5, skyLow:0xb8c4b0, fogColor:0xd8e0d2,
  // 建筑 (kept for pavilion architecture compatibility)
  wallWhite:0xf2ede0, wallShadow:0xe0dccc, tileBlack:0x2a2e2a, tileRidge:0x1a1e1a,
  wood:0x6b4f38, woodLight:0x9c7a56,
  // 水 (more jade-tinted)
  water:0x5a7878, waterShallow:0x7a9a96, waterRipple:0x9ab0a6,
  // 绿 (brighter竹海)
  moss:0x6b8e5a, pine:0x4a6a48, willow:0x7a9a6a, bamboo:0x6a8c5e,
  // 地面
  groundStone:0xa8a098, groundEarth:0x7a8068, groundPath:0xc8c8b0, stoneCarved:0x5a5048,
  // chibi 旅人 (升级到鲜亮配色)
  inkRobe:0x5c6b8a, inkRobeLight:0xf4dcc2, inkOutline:0x1a1a1a, inkHat:0xc9525f,
  // 朱红 / 金 (鸟居 + 匾额)
  vermilion:0xc9525f, vermilionSoft:0xa84747, gold:0xc8a050, goldSoft:0xb89968,
  // 大气
  rainStreak:0xb8c8d4, mistGlow:0xf2ead4,
  // v4 新增 - 鸟居 / 灯笼 / 竹林
  toriiRed:0xc9525f, toriiDark:0x8b3640, toriiTop:0x2a2520,
  lanternPaper:0xf4e4a8, lanternEmissive:0xffd680, lanternTassel:0x8b1818,
  bambooBright:0x9bc4a0, bambooLeaf:0x7daa78, bambooShadow:0x4a6450,
  bridgeRed:0xc9525f, bridgeDark:0x6b2828,
  sunBeam:0xfff4d8, mistDawn:0xe4ddc8,
};
function hexColor(value) { return '#' + value.toString(16).padStart(6, '0'); }

// ===================== RENDERER / SCENE / CAMERA =====================
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('scene'),
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
// 竹林晨雾 · FogExp2 指数衰减,density 0.0042 让远景巨佛/古塔半隐于雾
scene.fog = new THREE.FogExp2(0xc8cfd2, 0.0042);
scene.background = new THREE.Color(0xc8cfd2);

const camera = new THREE.PerspectiveCamera(67, window.innerWidth / window.innerHeight, 0.1, 1400);
camera.position.set(0, 6, +75);
camera.lookAt(0, 4, +52);

// 沉浸感升级: 提高主光能量 + 暖色 sun + 冷 fill 增加明暗对比, 让画面有"明媚晨光感"
const hemi = new THREE.HemisphereLight(0xf2ead4, 0x6a6258, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0c8, 1.45);
sun.position.set(-30, 60, 24);

(function buildSky() {
  const geo = new THREE.SphereGeometry(280, 32, 24);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    fog: false,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(C.sky) },
      midColor: { value: new THREE.Color(C.skyMid) },
      lowColor: { value: new THREE.Color(C.skyLow) },
    },
    vertexShader: `varying vec3 vWorld; void main(){ vWorld = (modelMatrix*vec4(position,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `varying vec3 vWorld; uniform vec3 topColor, midColor, lowColor; void main(){ float h = normalize(vWorld).y; vec3 c; if(h>0.0) c = mix(midColor, topColor, smoothstep(0.0,0.6,h)); else c = mix(midColor, lowColor, smoothstep(0.0,-0.4,h)); gl_FragColor = vec4(c,1.0);}`,
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.renderOrder = -1;
  scene.add(sky);
})();

// 5 层指数间距 + 暖 rim light 对抗冷雾，黑悟空式柔过渡
(function buildDistantMountains() {
  const base = new THREE.Color(0x6b7a82);
  const tint = new THREE.Color(0xc8cfd2);
  const zArr = [-120, -200, -320, -500, -800];
  const opArr = [0.95, 0.85, 0.70, 0.55, 0.40];
  const rimArr = [0.35, 0.30, 0.22, 0.15, 0.08];
  const heightScale = [1.0, 1.4, 2.2, 3.6, 6.0];

  for (let layer = 0; layer < 5; layer++) {
    const z = zArr[layer];
    const verts = [];
    const segs = 96;
    const span = Math.abs(z) * 4.2;
    const hScale = heightScale[layer];
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const x = -span/2 + t * span;
      const h = (12 + Math.sin(t * 6 + layer) * 7 + Math.sin(t * 17 + layer * 1.7) * 4 + Math.sin(t * 43) * 1.6) * hScale;
      verts.push(x, h, 0);
    }
    verts.push(span/2, -20, 0); verts.push(-span/2, -20, 0);
    const geo = new THREE.BufferGeometry();
    const idxArr = [];
    for (let i = 0; i < segs; i++) {
      idxArr.push(i, i+1, segs+1);
      idxArr.push(i, segs+1, segs+2);
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setIndex(idxArr);
    geo.computeVertexNormals();
    const col = base.clone().lerp(tint, layer / 4);
    const mat = new THREE.MeshLambertMaterial({
      color: col, side: THREE.DoubleSide, fog: true,
      transparent: true, opacity: opArr[layer],
    });
    const rim = rimArr[layer];
    mat.onBeforeCompile = (s) => {
      s.fragmentShader = s.fragmentShader.replace(
        '#include <fog_fragment>',
        `float rim = pow(1.0 - abs(dot(normalize(vNormal), vec3(0.0,0.0,1.0))), 2.5);
         gl_FragColor.rgb += vec3(1.0,0.92,0.82) * rim * ${rim.toFixed(3)};
         #include <fog_fragment>`
      );
    };
    const m = new THREE.Mesh(geo, mat);
    m.position.set(0, 0, z);
    scene.add(m);
  }
})();

      const geo = new THREE.BufferGeometry();
      const idxArr = [];
      for (let i = 0; i < segs; i++) {
        idxArr.push(i, i+1, segs+1);
        idxArr.push(i, segs+1, segs+2);
      }
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setIndex(idxArr);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(p.x, 0, p.z);
      scene.add(mesh);
    });
  })();
})();

function addStaticBox(x, y, z, hx, hy, hz, yaw = 0) {
  const body = new CANNON.Body({
    mass: 0, material: groundCM,
    collisionFilterGroup: GROUP_OBSTACLE,
    collisionFilterMask: GROUP_CHARACTER | GROUP_BOAT,
  });
  body.addShape(new CANNON.Box(new CANNON.Vec3(hx, hy, hz)));
  body.position.set(x, y, z);
  if (yaw) body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), yaw);
  world.addBody(body);
  return body;
}

function addWallSegment(cx, cz, w, d, h) {
  const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  wallMesh.position.set(cx, h/2, cz);
  scene.add(wallMesh);

  ridgeMesh.position.set(cx, h + 0.46, cz);
  if (d > w) ridgeMesh.rotation.y = Math.PI / 2;
  scene.add(ridgeMesh);
  addStaticBox(cx, h/2, cz, w/2, h/2, d/2);
}

(function buildOuterWalls() {
  const segs = [
    { cx: 0, cz: +60, w: 240, d: 1, gateW: 8, isVertical: false },

        const halfD = (s.d - s.gateW) / 2;
        addWallSegment(s.cx, s.cz - (s.gateW/2 + halfD/2), s.w, halfD, 4);
        addWallSegment(s.cx, s.cz + (s.gateW/2 + halfD/2), s.w, halfD, 4);
      }
    } else {
      addWallSegment(s.cx, s.cz, s.w, s.d, 4);
    }
  }
})();

const waterMeshes = [];
const waterZones = [
  { type: 'circle', cx: 0, cz: 0, rIn: 7, rOut: 16 },
  { type: 'box', minX: -2, maxX: 2, minZ: -58, maxZ: -14 },
  { type: 'box', minX: 14, maxX: 28, minZ: -9.5, maxZ: -6.5 },
  { type: 'box', minX: -1.5, maxX: 1.5, minZ: 11, maxZ: 25 },
  { type: 'box', minX: -22, maxX: -8, minZ: -11.5, maxZ: -8.5 },
];

function isInWater(x, z) {
  for (const zone of waterZones) {
    if (zone.type === 'circle') {
      const d = Math.hypot(x - zone.cx, z - zone.cz);
      if (d >= zone.rIn && d <= zone.rOut) return true;
    } else {
      if (x >= zone.minX && x <= zone.maxX && z >= zone.minZ && z <= zone.maxZ) return true;
    }
  }
  return false;
}

// ---------- 鸟居 (Torii) corridor along z-axis ----------
const TORII_RED = hexColor(C.toriiRed);
const TORII_TOP = hexColor(C.toriiTop);
function buildTorii(x, z, scale = 1, yaw = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  const redMat = new THREE.MeshStandardMaterial({ color: TORII_RED, roughness: 0.55 });
  const darkMat = new THREE.MeshStandardMaterial({ color: TORII_TOP, roughness: 0.6 });
  const W = 5.6 * scale;
  const H = 5.4 * scale;
  const pillarR = 0.28 * scale;
  // 两根立柱
  for (const xOff of [-W/2, W/2]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(pillarR, pillarR * 1.15, H, 12), redMat);
    pillar.position.set(xOff, H/2, 0);
    g.add(pillar);
    addStaticBox(x + xOff * Math.cos(yaw), H/2, z + xOff * Math.sin(yaw), pillarR * 1.2, H/2, pillarR * 1.2);
  }
  // 上横木 (笠木) 微弧线
  const topBeam = new THREE.Mesh(new THREE.BoxGeometry(W + 1.4 * scale, 0.36 * scale, 0.5 * scale), darkMat);
  topBeam.position.set(0, H + 0.18 * scale, 0);
  g.add(topBeam);
  // 屋脊 (笠木顶帽)
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(W + 1.7 * scale, 0.18 * scale, 0.4 * scale), darkMat);
  ridge.position.set(0, H + 0.45 * scale, 0);
  g.add(ridge);
  // 飞檐 (两侧上翘)
  for (const xOff of [-(W + 1.7 * scale)/2, (W + 1.7 * scale)/2]) {
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.18 * scale, 0.6 * scale, 4), darkMat);
    tip.position.set(xOff, H + 0.45 * scale, 0);
    tip.rotation.z = xOff > 0 ? -0.4 : 0.4;
    g.add(tip);
  }
  // 下横木 (贯木)
  const lowBeam = new THREE.Mesh(new THREE.BoxGeometry(W + 0.8 * scale, 0.28 * scale, 0.36 * scale), redMat);
  lowBeam.position.set(0, H * 0.78, 0);
  g.add(lowBeam);
  // 中央悬匾
  const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.9 * scale, 0.6 * scale, 0.1 * scale),
    new THREE.MeshStandardMaterial({ color: TORII_TOP, roughness: 0.4 }));
  plaque.position.set(0, H * 0.78 + 0.34 * scale, 0.05 * scale);
  g.add(plaque);
  scene.add(g);
  return g;
}

(function buildToriiCorridor() {
  // 沿 z 轴主道, 避开 pavilions (0,-30 / 0,+25) 与 island (0,0)
  // 由南往北: 入园→中心→深处
  const positions = [
    { z: +52, scale: 1.20 },   // 入园主鸟居 (大)
    { z: +38, scale: 0.92 },

})();

// ---------- 灯笼 (Red Lantern) row ----------
function buildLantern(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  // 顶帽 (黑色木顶)
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.14, 8),
    new THREE.MeshStandardMaterial({ color: hexColor(C.toriiTop), roughness: 0.6 }));
  cap.position.y = 0.78;
  g.add(cap);
  // 灯笼 (橘红色发光)
  const lanternMat = new THREE.MeshStandardMaterial({
    color: hexColor(C.lanternPaper),
    emissive: hexColor(C.lanternEmissive),
    emissiveIntensity: 0.85,
    roughness: 0.6,
  });
  const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), lanternMat);
  lantern.scale.y = 1.1;
  lantern.position.y = 0.32;
  g.add(lantern);
  // 红圈 (上中下三圈装饰)
  const ringMat = new THREE.MeshStandardMaterial({ color: hexColor(C.bridgeDark), roughness: 0.5 });
  for (const yOff of [0.62, 0.32, 0.02]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.025, 6, 16), ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = yOff;
    g.add(ring);
  }
  // 流苏
  const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 4),
    new THREE.MeshStandardMaterial({ color: hexColor(C.lanternTassel), roughness: 0.7 }));
  tassel.position.y = -0.22;
  g.add(tassel);
  // 点光源 (灯笼真的发光)
  const pt = new THREE.PointLight(0xffd680, 0.4, 5, 2);
  pt.position.y = 0.32;
  g.add(pt);
  scene.add(g);
  return g;
}

// ---------- 红桥 (Red Bridges) ----------
function buildRedBridge(cx, cz, length, width, axis = 'z') {
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  const redMat = new THREE.MeshStandardMaterial({ color: hexColor(C.bridgeRed), roughness: 0.6 });
  const darkMat = new THREE.MeshStandardMaterial({ color: hexColor(C.bridgeDark), roughness: 0.65 });
  // 桥面 (拱起的弧形)
  const segCount = 8;
  for (let i = 0; i < segCount; i++) {
    const t = i / (segCount - 1);
    const arcY = Math.sin(t * Math.PI) * 0.4 + 0.32;
    const seg = new THREE.Mesh(
      new THREE.BoxGeometry(axis === 'z' ? width : length / segCount,
                            0.16,
                            axis === 'z' ? length / segCount : width),
      redMat);
    const offset = (t - 0.5) * length;
    if (axis === 'z') seg.position.set(0, arcY, offset);
    else seg.position.set(offset, arcY, 0);
    g.add(seg);
  }
  // 栏杆 (两侧)
  for (const side of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const arcY = Math.sin(t * Math.PI) * 0.4 + 0.32 + 0.42;
      const offset = (t - 0.5) * length * 0.85;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.85, 6), darkMat);
      if (axis === 'z') pole.position.set(side * width/2, arcY - 0.42, offset);
      else pole.position.set(offset, arcY - 0.42, side * width/2);
      g.add(pole);
    }
    // 顶横木
    const rail = new THREE.Mesh(
      new THREE.BoxGeometry(axis === 'z' ? 0.08 : length * 0.85,
                            0.08,
                            axis === 'z' ? length * 0.85 : 0.08),
      redMat);
    if (axis === 'z') rail.position.set(side * width/2, 0.92, 0);
    else rail.position.set(0, 0.92, side * width/2);
    g.add(rail);
  }
  scene.add(g);
}

  // 跨越水路 (基于 waterZones 的 box paths)

// ---------- 竹海 (Bamboo Forest) ----------
(function buildBambooForest() {
  const COUNT = 380;
  const bambooMat = new THREE.MeshStandardMaterial({
    color: hexColor(C.bambooBright),
    roughness: 0.72,
  });
  const stalkGeo = new THREE.CylinderGeometry(0.05, 0.07, 7, 5);
  const instMesh = new THREE.InstancedMesh(stalkGeo, bambooMat, COUNT);
  instMesh.castShadow = false;
  instMesh.receiveShadow = false;
  const dummy = new THREE.Object3D();
  let placed = 0;
  let tries = 0;
  while (placed < COUNT && tries < COUNT * 4) {
    tries++;
    // 优先在墙外 (|x|>62 or |z|>62) + 部分在角落里
    const inner = Math.random() < 0.18;
    let x, z;
    if (inner) {
      x = -55 + Math.random() * 110;
      z = -55 + Math.random() * 110;
      // 避开主道 & 围墙内部 pavilion 区
      if (Math.abs(x) < 6 && Math.abs(z) < 30) continue;
      if (Math.hypot(x - 0, z + 30) < 7) continue;
      if (Math.hypot(x - 30, z + 8) < 6) continue;
      if (Math.hypot(x + 30, z + 15) < 6) continue;
      if (Math.hypot(x, z - 25) < 6) continue;
      if (Math.hypot(x - 28, z - 25) < 6) continue;
      if (Math.hypot(x, z) < 18) continue; // 中央池水
      if (isInWater(x, z)) continue;
    } else {
      // 围墙外圈 (60~110)
      const side = Math.floor(Math.random() * 4);
      const dist = 62 + Math.random() * 48;
      const along = -100 + Math.random() * 200;
      if (side === 0) { x = along; z = -dist; }
      else if (side === 1) { x = along; z = +dist; }
      else if (side === 2) { x = -dist; z = along; }
      else { x = +dist; z = along; }
    }
    dummy.position.set(x, 3.5 + Math.random() * 1.2, z);
    const sc = 0.85 + Math.random() * 0.45;
    dummy.scale.set(sc, sc, sc);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.rotation.z = (Math.random() - 0.5) * 0.08;
    dummy.updateMatrix();
    instMesh.setMatrixAt(placed, dummy.matrix);
    placed++;
  }
  instMesh.count = placed;
  instMesh.instanceMatrix.needsUpdate = true;
  scene.add(instMesh);

  // 竹叶团 (顶部丛绿)
  const leafMat = new THREE.MeshStandardMaterial({
    color: hexColor(C.bambooLeaf),
    roughness: 0.85,
    transparent: true,
    opacity: 0.88,
  });
  const leafGeo = new THREE.IcosahedronGeometry(1.2, 0);
  const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, Math.floor(placed * 0.4));
  let li = 0;
  for (let i = 0; i < placed && li < leafMesh.count; i += 3) {
    instMesh.getMatrixAt(i, dummy.matrix);
    dummy.matrix.decompose(dummy.position, dummy.quaternion, dummy.scale);
    dummy.position.y = 6.5 + Math.random() * 1.5;
    const ls = 1.0 + Math.random() * 0.5;
    dummy.scale.set(ls, ls * 0.7, ls);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.updateMatrix();
    leafMesh.setMatrixAt(li, dummy.matrix);
    li++;
  }
  leafMesh.count = li;
  leafMesh.instanceMatrix.needsUpdate = true;
  scene.add(leafMesh);
})();

})();

// 角度 lerp (处理 2π wrap)
function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  return a + diff * Math.min(1, t);
}

// 落地扬尘粒子池: 24 个 sphere instance
const dustPool = (() => {
  const pool = [];
  const dustMat = new THREE.MeshBasicMaterial({ color: 0xcab896, transparent: true, opacity: 0, fog: true });
  const dustGeo = new THREE.SphereGeometry(0.14, 6, 5);
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(dustGeo, dustMat.clone());
    m.visible = false;
    scene.add(m);
    pool.push({ mesh: m, life: 0, maxLife: 1, vx: 0, vy: 0, vz: 0 });
  }
  return pool;
})();
function spawnDust(x, y, z, intensity) {
  const count = Math.min(24, Math.floor(8 + intensity * 16));
  let used = 0;
  for (const p of dustPool) {
    if (p.life > 0 || used >= count) continue;
    used++;
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.15 + Math.random() * 0.35;
    p.mesh.position.set(x + Math.cos(angle) * radius, y + 0.05, z + Math.sin(angle) * radius);
    p.mesh.scale.setScalar(0.4 + Math.random() * 0.7);
    p.mesh.material.opacity = 0.5 + intensity * 0.3;
    p.mesh.visible = true;
    p.vx = Math.cos(angle) * (0.4 + Math.random() * 0.6);
    p.vy = 0.3 + Math.random() * 0.4;
    p.vz = Math.sin(angle) * (0.4 + Math.random() * 0.6);
    p.life = 0.6 + Math.random() * 0.4;
    p.maxLife = p.life;
  }
}
function updateDust(dt) {
  for (const p of dustPool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; continue; }
    const lifeRatio = p.life / p.maxLife;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 1.6 * dt; // 轻微重力
    p.vx *= 0.94; p.vz *= 0.94;
    p.mesh.material.opacity = lifeRatio * 0.55;
    p.mesh.scale.setScalar(p.mesh.scale.x + dt * 0.3);
  }
}

// ===================== POI / PROXIMITY =====================
const POI_STATE = { FAR: 12, MID: 6, NEAR: 2, HIDE_FAR: 16, HIDE_MID: 8, HIDE_NEAR: 3 };
const promptEl = document.getElementById('prompt');
const promptTextEl = document.getElementById('promptText');
let nearestPOI = null;

function updateProximity(dt, charPos) {
  let bestPOI = null;
  let bestDist = Infinity;
  for (const poi of pois) {
    const d = poi.userData.poiPos.distanceTo(charPos);
    poi.userData.dist = d;
    const prev = poi.userData.proxState || 'none';
    let next = prev;
    if (prev === 'none' && d < POI_STATE.FAR) next = 'far';
    else if (prev === 'far' && d > POI_STATE.HIDE_FAR) next = 'none';
    else if (prev === 'far' && d < POI_STATE.MID) next = 'mid';
    else if (prev === 'mid' && d > POI_STATE.HIDE_MID) next = 'far';
    else if (prev === 'mid' && d < POI_STATE.NEAR) next = 'near';
    else if (prev === 'near' && d > POI_STATE.HIDE_NEAR) next = 'mid';
    poi.userData.proxState = next;
    if (poi.userData.plaqueMat && poi.userData.plaqueMat.emissive) {
      let emissiveTgt = 0;
      if (next === 'mid') emissiveTgt = 0.18;
      else if (next === 'near') emissiveTgt = 0.32;
      poi.userData.plaqueMat.emissiveIntensity = THREE.MathUtils.damp(poi.userData.plaqueMat.emissiveIntensity || 0, emissiveTgt, 4, dt);
    }
    if (next === 'mid' && !poi.userData.midChimed) {
      poi.userData.midChimed = true;
      playChime();
    } else if (next === 'far' || next === 'none') {
      poi.userData.midChimed = false;
    }
    if (next === 'near' && d < bestDist) { bestPOI = poi; bestDist = d; }
  }
  nearestPOI = bestPOI;
  if (bestPOI) {
    promptTextEl.textContent = bestPOI.userData.label || '阅卷';
    promptEl.classList.add('show');
  } else {
    promptEl.classList.remove('show');
  }
}

const cursorEl = document.getElementById('cursor');
const cursorLabelEl = document.getElementById('cursorLabel');
const canvas = document.getElementById('scene');
let mouseX = window.innerWidth/2, mouseY = window.innerHeight/2;
let isLocked = false;

// --- Pointer Lock API (with vendor prefixes) ---
function requestLock() {
  const fn = canvas.requestPointerLock || canvas.mozRequestPointerLock || canvas.webkitRequestPointerLock;
  if (fn) fn.call(canvas);
}
function exitLock() {
  const fn = document.exitPointerLock || document.mozExitPointerLock || document.webkitExitPointerLock;
  if (fn) fn.call(document);
}
function getLockElement() {
  return document.pointerLockElement || document.mozPointerLockElement || document.webkitPointerLockElement;
}

// Lock state change handler
function onLockChange() {
  isLocked = getLockElement() === canvas;
  if (isLocked) {
    cursorEl.classList.add('locked');
    // Center crosshair when locked
    cursorEl.style.transform = `translate3d(${window.innerWidth/2}px, ${window.innerHeight/2}px, 0)`;
  } else {
    cursorEl.classList.remove('locked');
  }
}
document.addEventListener('pointerlockchange', onLockChange);
document.addEventListener('mozpointerlockchange', onLockChange);
document.addEventListener('webkitpointerlockchange', onLockChange);

// Click canvas to enter lock (skip UI overlays)
canvas.addEventListener('mousedown', e => {
  if (!isLocked) {
    requestLock();
  } else {
    cursorEl.classList.add('click');
  }
});
window.addEventListener('mouseup', () => { cursorEl.classList.remove('click'); });

// Mouse movement: locked = camera, unlocked = custom cursor
window.addEventListener('mousemove', e => {
  if (isLocked) {
    // 坦克控制: 鼠标只调俯仰角, 横向方向由角色 A/D 转向决定
    const dy = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
    camFollow.userPitch = Math.max(-0.6, Math.min(0.4, camFollow.userPitch + dy * 0.002));
    camFollow.yawIdleTimer = 0;
  } else {
    // Unlocked: move custom cursor ring, check hover targets
    mouseX = e.clientX; mouseY = e.clientY;
    cursorEl.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.dataset && el.dataset.cursor) {
      cursorLabelEl.textContent = el.dataset.cursor;
      cursorEl.classList.add('text');
    } else {
      cursorEl.classList.remove('text');
    }
  }
});

let audioCtx = null;
let audioMuted = true;
const muteIc = document.getElementById('muteIc');
muteIc.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioMuted = !audioMuted;
  muteIc.textContent = audioMuted ? '🔇' : '🔊';
  if (!audioMuted) playRain();
});
function playTone(freq, dur, gainVal = 0.1, type = 'sine') {
  if (audioMuted || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.value = gainVal;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
let rainNode = null;
function playRain() {
  if (audioMuted || !audioCtx) return;
  if (rainNode) return;
  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random()*2-1) * 0.5;
  rainNode = audioCtx.createBufferSource();
  rainNode.buffer = buffer; rainNode.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 800;
  const gain = audioCtx.createGain(); gain.gain.value = 0.08;
  rainNode.connect(filter).connect(gain).connect(audioCtx.destination);
  rainNode.start();
}

    name: '行游指引',
    meta: '滕园 · 竹林晨雾',
    text: '↑↓ / W S = 前进后退 (沿角色面朝方向)\n←→ / A D = 持续左右转 (按多久转多少, 松开停)\nSHIFT 疾驰 · SPACE 跃\nF 切换走 / 船 (需在停泊点附近)\nE 阅卷 · ESC 关闭对话 · R 回山门\n鼠标拖拽 = 仅调俯仰角',
    tags: [],
    hub: [{ label: '知道了', action: closeDialog }],
  });
});

// ===================== ANIMATION LOOP =====================
const clock = new THREE.Clock();
const speedEl = document.getElementById('speedVal');
const posEl = document.getElementById('posVal');
let lastStepTime = 0;

function approach(cur, tgt, maxDelta) {
  const d = tgt - cur;
  return Math.abs(d) <= maxDelta ? tgt : cur + Math.sign(d) * maxDelta;
}

function updateCameraLerp(dt) {
  if (camTransition.active) {
    camTransition.t += dt;
    const u = Math.min(1, camTransition.t / camTransition.dur);
    const e = u * u * (3 - 2*u);
    const f = camTransition.from, t = camTransition.to;
    camFollow.current.distance = f.distance + (t.distance - f.distance) * e;
    camFollow.current.height = f.height + (t.height - f.height) * e;
    camFollow.current.pitch = f.pitch + (t.pitch - f.pitch) * e;
    camFollow.current.fov = f.fov + (t.fov - f.fov) * e;
    camFollow.current.damping = f.damping + (t.damping - f.damping) * e;
    camFollow.current.lookAhead = f.lookAhead + (t.lookAhead - f.lookAhead) * e;
    camFollow.current.lookHeight = f.lookHeight + (t.lookHeight - f.lookHeight) * e;
    if (u >= 1) { camTransition.active = false; Object.assign(camFollow.current, t); }
  }
  // 动态 FOV：land 模式下据速度推 67 / 73 / 80
  let fovTgt = camFollow.current.fov;
  if (mode === 'land' && !camTransition.active && characterState.body) {
    const v = Math.hypot(characterState.body.velocity.x, characterState.body.velocity.z);
    if (v > CHARACTER.RUN_SPEED * 0.9) fovTgt = 80;
    else if (v > CHARACTER.WALK_SPEED * 1.05) fovTgt = 73;
    else fovTgt = 67;
  }
  camera.fov = THREE.MathUtils.lerp(camera.fov, fovTgt, dt * 3);
  camera.updateProjectionMatrix();
}

function updateCharacterMode(dt, time) {
  const body = characterState.body;
  // 古墓丽影现代版坦克控制: A/D 持续转向 (按多久转多少, 松开停)
  const inputForward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  const inputTurn = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
  const hasMove = inputForward !== 0;
  const hasInput = hasMove || inputTurn !== 0;
  characterState.timeSinceDrain = keys.shift ? 0 : characterState.timeSinceDrain + dt;
  if (characterState.timeSinceDrain > CHARACTER.STAMINA_REGEN_DELAY)
    characterState.stamina = Math.min(CHARACTER.STAMINA_MAX, characterState.stamina + CHARACTER.STAMINA_REGEN * dt);
  const canSprint = (keys.shift || sprintDoubleTapped) && characterState.stamina > 0;
  if (canSprint && hasMove)
    characterState.stamina = Math.max(0, characterState.stamina - CHARACTER.SPRINT_COST * dt);
  const targetSpeed = canSprint ? CHARACTER.SPRINT_SPEED
                   : keys.shift ? CHARACTER.RUN_SPEED
                   : CHARACTER.WALK_SPEED;
  // 持续转向: 约 110°/s, 倒车时反向更直觉
  const TURN_RATE = 1.9;
  if (inputTurn !== 0) {
    const turnSign = inputForward < 0 ? -1 : 1;
    characterState.yaw += inputTurn * turnSign * TURN_RATE * dt;
  }
  let dirX = 0, dirZ = 0;
  if (hasMove) {
    // mesh.rotation.y = yaw 时角色默认朝 -Z, 故 forward = -(sin yaw, cos yaw)
    dirX = -Math.sin(characterState.yaw) * inputForward;
    dirZ = -Math.cos(characterState.yaw) * inputForward;
  }
  const desiredX = dirX * targetSpeed;
  const desiredZ = dirZ * targetSpeed;
  body.velocity.x = approach(body.velocity.x, desiredX, CHARACTER.ACCEL_GROUND * dt);
  body.velocity.z = approach(body.velocity.z, desiredZ, CHARACTER.ACCEL_GROUND * dt);
  if (keys.space && Math.abs(body.velocity.y) < 0.5) body.velocity.y = CHARACTER.JUMP_VEL;
  body.position.x = Math.max(-58, Math.min(+58, body.position.x));
  body.position.z = Math.max(-58, Math.min(+58, body.position.z));
  if (isInWater(body.position.x, body.position.z) && body.position.y < 0.7) {
    body.position.y = 0.7;
    body.velocity.y = Math.max(0, body.velocity.y);
  }
  characterState.meshGroup.position.set(body.position.x, body.position.y - 0.72, body.position.z);
  // mesh 朝向用 lerpAngle (处理 2π wrap), 比 yaw 略快 (~0.1s)
  characterState.meshGroup.rotation.y = lerpAngle(characterState.meshGroup.rotation.y, characterState.yaw, dt * 10);
  const speed = Math.hypot(body.velocity.x, body.velocity.z);
  if (speed > 0.5) {
    const stepInterval = 0.45 / Math.max(0.5, speed / CHARACTER.WALK_SPEED);
    if (time - lastStepTime > stepInterval) { playStep(); lastStepTime = time; }
    // 脚下踩痕: 移动距离累计 0.85m 触发一个 ring
    const dx = body.position.x - lastCharX, dz = body.position.z - lastCharZ;
    lastStepRingDist += Math.hypot(dx, dz);
    if (lastStepRingDist > 0.85) {
      const inWater = isInWater(body.position.x, body.position.z);
      emitStepRing(body.position.x, inWater ? 0.05 : 0, body.position.z, inWater);
      lastStepRingDist = 0;
    }
  }
  lastCharX = body.position.x;
  lastCharZ = body.position.z;
  speedEl.textContent = `${speed.toFixed(1)} m/s`;
  posEl.textContent = `x ${body.position.x.toFixed(0)} z ${body.position.z.toFixed(0)}`;
}

function updateBoatMode(dt, time) {
  const inputForward = (keys.w ? 1 : 0) - (keys.s ? 1 : 0);
  const inputTurn = (keys.a ? 1 : 0) - (keys.d ? 1 : 0);
  const tgtSpeed = keys.shift ? BOAT.RUN_SPEED : BOAT.WALK_SPEED;
  boatState.yaw += inputTurn * BOAT.TURN_RATE * dt * (Math.abs(boatState.speed) > 0.05 ? 1 : 0.4);
  const desired = inputForward * tgtSpeed;
  boatState.speed = approach(boatState.speed, desired, BOAT.ACCEL * dt);
  if (Math.abs(inputForward) < 0.01) boatState.speed *= BOAT.INERTIA;
  const dx = -Math.sin(boatState.yaw) * boatState.speed * dt;
  const dz = -Math.cos(boatState.yaw) * boatState.speed * dt;
  const nextX = boatState.pos.x + dx;
  const nextZ = boatState.pos.z + dz;
  if (isInWater(nextX, nextZ)) {
    boatState.pos.x = nextX; boatState.pos.z = nextZ;
  } else if (isInWater(nextX, boatState.pos.z)) {
    boatState.pos.x = nextX; boatState.speed *= 0.5;
  } else if (isInWater(boatState.pos.x, nextZ)) {
    boatState.pos.z = nextZ; boatState.speed *= 0.5;
  } else {
    boatState.speed *= 0.3;
  }
  boatState.mesh.position.copy(boatState.pos);
  boatState.mesh.rotation.y = boatState.yaw;
  if (Math.abs(boatState.speed) > 0.5 && time - lastStepTime > 0.6) {
    playPaddle(); lastStepTime = time;
  }
  speedEl.textContent = `${Math.abs(boatState.speed).toFixed(1)} m/s`;
  posEl.textContent = `x ${boatState.pos.x.toFixed(0)} z ${boatState.pos.z.toFixed(0)}`;
}

function updateCamera(dt) {
  const charPos = (mode === 'land')
    ? new THREE.Vector3(characterState.body.position.x, characterState.body.position.y, characterState.body.position.z)
    : new THREE.Vector3(boatState.pos.x, boatState.pos.y, boatState.pos.z);
  const charYaw = (mode === 'land') ? characterState.yaw : boatState.yaw;
  if (Math.abs(camFollow.userYaw) > 0.01 || Math.abs(camFollow.userPitch) > 0.01) {
    camFollow.yawIdleTimer += dt;
    if (camFollow.yawIdleTimer > camFollow.current.yawAutoReset && !isLocked) {
      camFollow.userYaw = THREE.MathUtils.lerp(camFollow.userYaw, 0, dt * 1.5);
      camFollow.userPitch = THREE.MathUtils.lerp(camFollow.userPitch, 0, dt * 1.5);
    }
  } else {
    camFollow.yawIdleTimer = 0;
  }
  const totalYaw = charYaw + camFollow.userYaw;
  const dx = -Math.sin(totalYaw) * camFollow.current.distance;
  const dz = -Math.cos(totalYaw) * camFollow.current.distance;
  // OTS 右肩偏移：相机相对角色朝向的正侧(右)
  const shoulder = camFollow.current.shoulder || 0;
  const sx = Math.cos(totalYaw) * shoulder;
  const sz = -Math.sin(totalYaw) * shoulder;
  const targetPos = new THREE.Vector3(
    charPos.x - dx + sx,
    charPos.y + camFollow.current.height + camFollow.userPitch * 2,
    charPos.z - dz + sz
  );
  camFollow.pos.lerp(targetPos, Math.min(1, dt * camFollow.current.damping));
  camera.position.copy(camFollow.pos);
  // 落地震检测: y 速度从负到 ~0 = 触地
  if (mode === 'land' && characterState.body) {
    const vy = characterState.body.velocity.y;
    const grounded = Math.abs(vy) < 0.5 && characterState.body.position.y < 1.6;
    if (!camShake.wasGrounded && grounded) {
      const fallDist = camShake.lastGroundedY - characterState.body.position.y;
      if (fallDist > 0.4) {
        const intensity = Math.min(0.8, fallDist * 0.4);
        camShake.trauma = Math.min(1.0, camShake.trauma + intensity);
        spawnDust(
          characterState.body.position.x,
          characterState.body.position.y - 0.78,
          characterState.body.position.z,
          intensity
        );
      }
    }
    if (grounded) camShake.lastGroundedY = characterState.body.position.y;
    camShake.wasGrounded = grounded;
  }
  // trauma² 噪声衰减
  if (camShake.trauma > 0) {
    const t2 = camShake.trauma * camShake.trauma;
    const t = clock.elapsedTime;
    camera.position.x += (Math.sin(t * 47.3) * 0.5) * t2 * 0.4;
    camera.position.y += (Math.sin(t * 53.7) * 0.5) * t2 * 0.4;
    camera.position.z += (Math.sin(t * 61.1) * 0.5) * t2 * 0.2;
    camShake.trauma = Math.max(0, camShake.trauma - dt * 3.5);
  }
  // 跑动 head-bob (land + speed > walk)
  if (mode === 'land' && characterState.body) {
    const v = Math.hypot(characterState.body.velocity.x, characterState.body.velocity.z);
    if (v > CHARACTER.WALK_SPEED * 1.05) {
      const cadence = 2.35 + (v / CHARACTER.RUN_SPEED) * 2.5;
      const bobAmp = Math.min(0.025, (v / CHARACTER.SPRINT_SPEED) * 0.025);
      camera.position.y += Math.sin(clock.elapsedTime * cadence * 2) * bobAmp;
      camera.position.x += Math.sin(clock.elapsedTime * cadence) * bobAmp * 0.5;
    }
  }
  const lookTarget = new THREE.Vector3(
    charPos.x + sx * 0.35,
    charPos.y + camFollow.current.lookHeight,
    charPos.z + sz * 0.35
  );
  camFollow.lookAt.lerp(lookTarget, Math.min(1, dt * camFollow.current.damping));
  camera.lookAt(camFollow.lookAt);
}

function animate() {
  const dt = Math.min(0.05, clock.getDelta());
  const time = clock.elapsedTime;
  world.step(1/60, dt, 3);
  if (mode === 'land') updateCharacterMode(dt, time);
  else updateBoatMode(dt, time);
  updateCameraLerp(dt);
  updateCamera(dt);
  updateDust(dt);
  updateStepRings(dt);
  const charPos = (mode === 'land')
    ? new THREE.Vector3(characterState.body.position.x, characterState.body.position.y, characterState.body.position.z)
    : new THREE.Vector3(boatState.pos.x, boatState.pos.y, boatState.pos.z);
  updateProximity(dt, charPos);
  if (dialogOpen && dialogCurrentPOI) {
    const d = dialogCurrentPOI.userData.poiPos.distanceTo(charPos);
    if (d > 5) {
      if (!dialogCurrentPOI.userData.farTimer) dialogCurrentPOI.userData.farTimer = time;
      else if (time - dialogCurrentPOI.userData.farTimer > 3) closeDialog();
    } else {
      dialogCurrentPOI.userData.farTimer = 0;
    }
  }
  for (const w of waterMeshes) {
    if (w.material.map) {
      w.material.map.offset.x = time * 0.012;
      w.material.map.offset.y = time * 0.008;
    }
  }
  if (characterState.meshGroup && characterState.meshGroup.userData.robe) {
    const ud = characterState.meshGroup.userData;
    const v = characterState.body ? Math.hypot(characterState.body.velocity.x, characterState.body.velocity.z) : 0;
    const cadence = 2.35 + (v / CHARACTER.RUN_SPEED) * 2.5; // 步频随速度
    ud.robe.scale.x = 1 + Math.sin(time * cadence) * 0.03;
    ud.robe.scale.z = 1 + Math.cos(time * cadence) * 0.03;
    ud.hat.rotation.z = Math.sin(time * cadence * 0.7) * 0.018;
    // 披风 Verlet 简化: 4x6 顶点按距背后远近+速度+sin做飘动
    if (ud.cape && ud.capeGeo) {
      const pos = ud.capeGeo.attributes.position;
      const moveScale = Math.min(1.0, v / CHARACTER.WALK_SPEED);
      for (let i = 0; i < pos.count; i++) {
        const py = pos.getY(i);     // -0.425..0.425 顶到底
        const px = pos.getX(i);
        const tWeight = (0.425 - py) / 0.85; // 底部权重大, 顶固定
        const wind = Math.sin(time * 1.6 + py * 4) * 0.04;
        const speedKick = -moveScale * 0.18 * tWeight;
        pos.setZ(i, speedKick + wind * tWeight - tWeight * 0.05);
        pos.setX(i, px + Math.sin(time * 2.2 + py * 6 + px * 3) * 0.03 * tWeight);
      }
      pos.needsUpdate = true;
    }
    // 杖小幅摆动
    if (ud.staff) ud.staff.rotation.z = -0.32 + Math.sin(time * cadence) * 0.04;
  }
  if (mode === 'boat' && boatState.mesh.userData.paddle) {
    boatState.mesh.userData.paddle.rotation.x = Math.sin(time * 3) * 0.35;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// ===================== RESIZE =====================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================== BOOTSTRAP =====================
startCeremony();
animate();

window.__driveV4 = {
  scene, camera, world,
  characterState, boatState, camFollow,
  pois, DOCKS, mode: () => mode,
  openDialog, closeDialog, triggerPOI,
  switchMode: tryModeSwitch,
};

console.log('drive-v4 (江南园林) loaded · pois:', pois.length);
</script>
</body>
