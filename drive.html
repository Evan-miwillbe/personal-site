<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>滕美名 · 边塞观星 · drive</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;700&family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="data.js"></script>
<style>
:root{
  --bg:#0a0a14;
  --ink:#2a2520;
  --ink-soft:#8a877e;
  --accent:#7F2020;
  --sage:#869B7E;
  --sage-deep:#5D7B5D;
  --tile:#524940;
  --slate:#4A6B7C;
  --cinnabar:#C0392B;
  --hud-bg:rgba(246,243,235,0.32);
  --hud-border:rgba(127,32,32,0.4);
  --hud-blur:blur(14px) saturate(1.1);
  --cinnabar-line:1px solid rgba(127,32,32,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#F6F3EB;font-family:'Inter','Noto Serif SC',-apple-system,BlinkMacSystemFont,sans-serif;cursor:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

/* === cursor-ring (sourced from hello.html, scaled for drive scene) === */
.cursor-ring{position:fixed;top:0;left:0;width:42px;height:42px;margin:-21px 0 0 -21px;pointer-events:none;z-index:10000;will-change:transform;display:flex;align-items:center;justify-content:center;background:transparent;border:0;transform:translate3d(-100px,-100px,0);--ring-progress:0deg}
.cursor-ring .circle{width:100%;height:100%;border-radius:50%;background:rgba(127,32,32,0.16);border:1.5px solid rgba(127,32,32,0.5);backdrop-filter:blur(4px) saturate(1.1);-webkit-backdrop-filter:blur(4px);transform:scale(.38);transition:transform .35s cubic-bezier(.55,.085,0,.99),background-color .25s,border-color .25s,box-shadow .25s,backdrop-filter .25s}
.cursor-ring.far .circle{transform:scale(.43);background:rgba(212,160,80,0.12);border-color:rgba(212,160,80,0.4);box-shadow:0 0 12px rgba(212,160,80,0.16)}
.cursor-ring.near .circle{transform:scale(.52);background:conic-gradient(from -90deg, rgba(200,160,80,0.7) var(--ring-progress), rgba(200,160,80,0.08) 0),rgba(200,160,80,0.16);border-color:rgba(200,160,80,0.7);box-shadow:0 0 18px rgba(200,160,80,0.25)}
.cursor-ring.trigger .circle{transform:scale(.67);background:rgba(255,212,128,0.22);border-color:rgba(255,212,128,1);box-shadow:0 0 24px rgba(255,212,128,0.42)}
.cursor-ring.hover .circle{transform:scale(.95);background:rgba(127,32,32,0.22);border-color:rgba(127,32,32,0.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cursor-ring.text .circle{transform:scale(1.2);background:rgba(127,32,32,0.32);border-color:rgba(127,32,32,0);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cursor-ring .cr-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.3);font-family:'Noto Serif SC',serif;font-size:11px;font-weight:500;color:#F6F3EB;letter-spacing:.04em;white-space:nowrap;opacity:0;transition:opacity .22s .12s,transform .35s cubic-bezier(.55,.085,0,.99) .06s;pointer-events:none}
.cursor-ring.text .cr-label{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cursor-ring.text .cr-label.en{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.28em;font-weight:600}
.cursor-ring.click .circle{transform:scale(.6)}
@media (hover:none),(pointer:coarse){.cursor-ring{display:none}}

/* === HUD frames === */
.hud{position:fixed;background:var(--hud-bg);backdrop-filter:var(--hud-blur);-webkit-backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#F6F3EB;z-index:50;letter-spacing:0.04em;line-height:1.5}

/* === top-left brand === */
.brand{position:fixed;top:18px;left:24px;z-index:100;font-family:'Noto Serif SC',serif;font-size:14px;color:#F6F3EB;letter-spacing:0.08em;text-decoration:none;background:transparent}
.brand .sep{color:var(--accent);margin:0 0.5em}
.brand:hover{color:var(--accent)}

/* === top-right links === */
.toplinks{position:fixed;top:22px;right:24px;z-index:100;display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:lowercase;letter-spacing:0.06em}
.toplinks a{color:#c8c4b8;text-decoration:none;padding:2px 0;border-bottom:1px solid transparent;transition:color 0.2s,border-color 0.2s}
.toplinks a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.toplinks a.active{color:var(--accent);border-bottom:1px solid var(--accent)}
.toplinks .dot{color:var(--ink-soft);opacity:0.4;user-select:none}
@media (max-width:640px){
  .brand{top:14px;left:18px;font-size:13px}
  .toplinks{top:44px;left:18px;right:auto;gap:12px;font-size:10px}
}

/* === bottom-left status === */
.status{bottom:22px;left:24px;display:flex;flex-direction:column;gap:3px}
.status .row{display:flex;justify-content:space-between;gap:18px;min-width:170px}
.status .label{color:var(--ink-soft);opacity:0.72}
.status .val{color:#F6F3EB;font-weight:500}

/* === bottom-right helper === */
.helper{bottom:22px;right:24px;display:flex;gap:10px;align-items:center}
.helper .ic{width:28px;height:28px;border:var(--cinnabar-line);background:rgba(246,243,235,0.4);backdrop-filter:var(--hud-blur);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);cursor:none;border-radius:50%;font-family:'JetBrains Mono',monospace}
.helper .ic.breath{animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:0.7}50%{opacity:1}}

/* === 卷轴提示 (scroll hint) === */
.scrollHint{position:fixed;bottom:90px;right:24px;z-index:60;background:rgba(246,243,235,0.62);backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:12px 16px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:0.08em;min-width:160px;max-width:220px;line-height:1.7;opacity:0;transform:translateX(80px) scaleX(0.2);transform-origin:right center;transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1),transform 0.6s cubic-bezier(0.16,1,0.3,1)}
.scrollHint.show{opacity:1;transform:translateX(0) scaleX(1)}
.scrollHint.shake{animation:shake 0.45s ease}
.scrollHint .label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px}
.scrollHint .title{font-size:15px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.scrollHint .sub{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* === 中央"疾驰"二字飞字 === */
.flytext{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);font-family:'Noto Serif SC',serif;font-weight:700;font-size:96px;color:#c8a050;letter-spacing:0.2em;pointer-events:none;z-index:200;opacity:0;text-shadow:0 0 24px rgba(200,160,80,0.35)}
.flytext.show{animation:flytext 0.9s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes flytext{0%{opacity:0;transform:translate(-50%,-50%) scale(0.7)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}}

/* === Dialog 抽屉 === */
.drawer{position:fixed;top:0;right:0;width:420px;max-width:90vw;height:100vh;background:rgba(246,243,235,0.94);backdrop-filter:blur(20px) saturate(1.15);border-left:2px solid var(--accent);padding:64px 36px 36px;font-family:'Noto Serif SC',serif;color:var(--ink);z-index:500;transform:translateX(110%);transition:transform 0.55s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(42,37,32,0.18)}
.drawer.show{transform:translateX(0)}
.drawer .close{position:absolute;top:20px;right:20px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--accent);cursor:none;border:var(--cinnabar-line);background:transparent;border-radius:50%}
.drawer .close:hover{background:rgba(127,32,32,0.12)}
.drawer .label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:8px}
.drawer h1{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:500;margin-bottom:6px;color:var(--ink);line-height:1.3}
.drawer h2{font-size:15px;color:var(--ink-soft);font-weight:400;margin-bottom:22px;font-family:'Inter',sans-serif;letter-spacing:0.02em}
.drawer .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:18px;letter-spacing:0.04em}
.drawer .divider{width:48px;height:2px;background:var(--accent);margin-bottom:22px}
.drawer .desc{font-size:14px;color:var(--ink);line-height:1.8;margin-bottom:26px}
.drawer .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.drawer .tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 10px;border:1px solid rgba(127,32,32,0.32);color:var(--accent);letter-spacing:0.06em}
.drawer .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.drawer .actions a{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(127,32,32,0.06);border-left:2px solid var(--accent);color:var(--ink);text-decoration:none;font-family:'Noto Serif SC',serif;font-size:13px;transition:background 0.2s}
.drawer .actions a:hover{background:rgba(127,32,32,0.14)}
.drawer .actions a .arrow{font-family:'JetBrains Mono',monospace;color:var(--accent)}
.drawer.contact{padding-top:80px}
.drawer.contact .big{font-size:22px;font-family:'JetBrains Mono',monospace;color:var(--accent);margin-bottom:18px;word-break:break-all}
.drawer.award h1{font-size:24px}

/* === intro overlay === */
.intro{position:fixed;inset:0;background:#0a0a14;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Noto Serif SC',serif;transition:opacity 0.8s ease;color:#F6F3EB}
.intro.hide{opacity:0;pointer-events:none}
.intro .seal{width:84px;height:84px;background:#7F2020;color:#F6F3EB;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:600;letter-spacing:.12em;animation:sealAppear .6s ease-out}
.intro .seal-char{font-size:20px;line-height:1.12;text-align:center}
.intro .seal-en{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.18em;margin-top:5px;opacity:.72}
.intro h1{font-size:24px;font-weight:500;margin:22px 0 10px;color:#F6F3EB;letter-spacing:0.18em}
.intro .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a877e;letter-spacing:0.14em;margin-bottom:34px}
.intro .start{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--accent);padding:10px 28px;border:1px solid var(--accent);background:transparent;cursor:none;letter-spacing:0.12em;transition:background 0.2s}
.intro .start:hover{background:rgba(127,32,32,0.08)}
.intro .controls{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a877e;letter-spacing:0.08em;line-height:1.9;text-align:center}
.intro .controls .k{color:var(--accent);font-weight:500}
.intro.started .start{opacity:0;pointer-events:none}
.intro.started .seal{animation:sealPulse .45s ease-out}
@keyframes sealAppear{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sealPulse{0%{transform:scale(1)}45%{transform:scale(.88)}100%{transform:scale(1)}}

/* === proximity prompt (in-scene small toast) === */
.prompt{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:rgba(246,243,235,0.55);backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:8px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:0.1em;z-index:80;opacity:0;transition:opacity 0.35s}
.prompt.show{opacity:1}
.prompt .k{font-family:'JetBrains Mono',monospace;color:var(--accent);padding:1px 6px;border:1px solid rgba(127,32,32,0.3);margin-right:6px;font-size:11px}

/* === flip notice (翻车自动复位提示) === */
.flipNotice{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:rgba(246,243,235,0.75);backdrop-filter:var(--hud-blur);border:1px solid rgba(127,32,32,0.5);border-left:3px solid var(--accent);padding:10px 18px;font-family:'Noto Serif SC',serif;font-size:14px;color:var(--accent);letter-spacing:0.12em;z-index:90;opacity:0;transition:opacity 0.3s}
.flipNotice.show{opacity:1}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<a class="brand" href="index.html" data-cursor="返回">滕美名<span class="sep">·</span>边塞观星</a>

<nav class="toplinks">
  <a href="index.html" data-cursor="切换">home</a><span class="dot">·</span>
  <a href="editorial.html" data-cursor="切换">editorial</a><span class="dot">·</span>
  <a href="walk.html" data-cursor="切换">walk</a><span class="dot">·</span>
  <a href="drive.html" class="active" data-cursor="当前">drive</a>
</nav>

<div class="hud status">
  <div class="row"><span class="label">速度</span><span class="val" id="speedVal">0 km/h</span></div>
  <div class="row"><span class="label">位置</span><span class="val" id="posVal">x 0  z 0</span></div>
  <div class="row"><span class="label">模式</span><span class="val">第三人称</span></div>
</div>

<div class="helper">
  <div class="ic breath" id="muteIc" title="解锁声音" data-cursor="声音">🔇</div>
  <div class="ic" id="helpIc" title="帮助" data-cursor="帮助">?</div>
</div>

<div class="scrollHint" id="hint">
  <div class="label">驾乘指引</div>
  <div class="title">W A S D 朝北开</div>
  <div class="sub">FIND ASTROLABE</div>
</div>

<div class="flytext" id="flyText">疾&nbsp;驰</div>

<div class="prompt" id="prompt"><span class="k">E</span><span id="promptText">阅卷</span></div>

<div class="flipNotice" id="flipNotice">翻车 · 即将自动复位</div>

<div class="drawer" id="drawer">
  <button class="close" id="closeDrawer">×</button>
  <div id="drawerBody"></div>
</div>

<div class="intro" id="intro">
  <div class="seal">
    <div class="seal-char">星<br/>槎</div>
    <div class="seal-en">ASTROLABE</div>
  </div>
  <h1>边 · 塞 · 观 · 星</h1>
  <div class="sub">FRONTIER STARGAZING FIELD</div>
  <button class="start" id="startBtn" data-cursor="入场">入&nbsp;场</button>
  <div class="controls">
    <span class="k">W A S D</span> 行车 &nbsp;·&nbsp; <span class="k">SHIFT</span> 疾驰 &nbsp;·&nbsp; <span class="k">SPACE</span> 跃 &nbsp;·&nbsp; <span class="k">R</span> 复位<br/>
    <span class="k">鼠标拖拽</span> 观四方 &nbsp;·&nbsp; <span class="k">E</span> 阅卷 &nbsp;·&nbsp; <span class="k">ESC</span> 关闭
  </div>
</div>

<div class="cursor-ring" id="cursor">
  <div class="circle"></div>
  <span class="cr-label" id="cursorLabel">阅卷</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ============ DATA ============
const D = window.SITE_DATA || { projects: [], contacts: [], awards: [], meta: {} };

// ============ CONST / palette ============
const C = {
  paper: 0xF6F3EB,
  ink: 0x2a2520,
  accent: 0x7F2020,
  sky: 0x0d0e1f,
  skyMid: 0x1d2238,
  skyLow: 0x3d3530,
  fogColor: 0x3d3530,
  moonBody: 0xe8e4d0,
  moonGlow: 0xfff5d8,
  starWhite: 0xd4d9e8,
  starWarm: 0xe8d4a0,
  mountainBack: 0x2c2e38,
  mountainMid: 0x3c3e48,
  mountainFront: 0x4c4e58,
  snowCap: 0xc8c4b8,
  ground: 0x2a2620,
  groundPath: 0x7a6e58,
  stone: 0x6a6660,
  stoneDark: 0x3a3630,
  woodLight: 0x8b6f47,
  woodDark: 0x4a3a28,
  goldRoof: 0x9a7a3a,
  goldStrong: 0xc8a050,
  pine: 0x3a4a3a,
  prayerFlag1: 0xa83838,
  prayerFlag2: 0x386aa8,
  prayerFlag3: 0xd8a838,
  prayerFlag4: 0x3a8a4a,
  prayerFlag5: 0xe8e2d0,
  grassDry: 0x7a7048,
  moss: 0x4a583a,
  silver: 0xc0c0c0,
  windowWarm: 0xf0b070,
  sandPath: 0x7a6e58,
  grassNear: 0x2a2620,
  grassFar: 0x2a2620,
  hallFar: 0x6a6660,
  fog: 0x3d3530,
  bridge: 0x6a6660,
  bamboo: 0x3a4a3a,
  plum: 0x3a4a3a,
  peach: 0x3a4a3a,
  wallStone: 0x6a6660,
  lantern: 0xd8a838,
  lanternEmissive: 0.12,
  accentSoft: 0xA84747,
  cinnabar: 0x7F2020,
  sage: 0x869B7E,
  sageDeep: 0x5D7B5D,
  tile: 0x524940,
  peachPink: 0xEFB8C2,
  peachBranch: 0x6B4F38,
  copperBrown: 0xA88B5E,
  earthBrown: 0x4A3525,
  chairCushionRed: 0x4A6B7C,
  slate: 0x4A6B7C,
  gold: 0xc8a050,
  ivory: 0xF6F3EB,
  cream: 0xF6F3EB,
  bg: 0x0a0a14
};

function hexColor(value) {
  return '#' + value.toString(16).padStart(6, '0');
}

// ============ RENDERER ============
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('scene'),
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ============ SCENE / CAMERA ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
scene.fog = new THREE.Fog(C.fogColor, 60, 220);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 8, 66);
camera.lookAt(0, 6, -55);

// ============ LIGHTING ============
const hemi = new THREE.HemisphereLight(0xd8ddff, 0x2a2620, 0.46);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff5d8, 0.72);
sun.position.set(-30, 50, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 160;
sun.shadow.bias = -0.0008;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x8da0c8, 0.22);
fillLight.position.set(20, 18, -35);
scene.add(fillLight);

// ============ PHYSICS (cannon-es) ============
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -13, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = false;
world.defaultContactMaterial.friction = 0.4;

// ground material
const groundMat = new CANNON.Material('ground');
const wheelMat = new CANNON.Material('wheel');
const wheelGround = new CANNON.ContactMaterial(wheelMat, groundMat, {
  friction: 0.7,
  restitution: 0.05,
  contactEquationStiffness: 1e8
});
world.addContactMaterial(wheelGround);

// ============ TEXTURE HELPERS ============
function wrapText(ctx, text, maxW) {
  const words = String(text || '').split(/\s+/);
  const lines = [];
  let cur = '';
  for (const word of words) {
    if (ctx.measureText(word).width > maxW) {
      if (cur) { lines.push(cur); cur = ''; }
      for (const ch of word) {
        const test = cur + ch;
        if (ctx.measureText(test).width > maxW && cur.length > 0) {
          lines.push(cur);
          cur = ch;
        } else {
          cur = test;
        }
      }
      continue;
    }
    const test = cur ? cur + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && cur.length > 0) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function makeGroundTex() {
  const s = 4096;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const toPxX = x => ((x + 120) / 240) * s;
  const toPxZ = z => ((120 - z) / 240) * s;
  const worldW = meters => (meters / 240) * s;

  const grad = ctx.createLinearGradient(0, 0, 0, s);
  grad.addColorStop(0, hexColor(C.ground));
  grad.addColorStop(0.55, '#29241e');
  grad.addColorStop(1, '#211f1c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, s, s);

  for (let i = 0; i < 12000; i++) {
    const alpha = 0.03 + Math.random() * 0.09;
    const light = Math.random() < 0.55 ? 255 : 60;
    ctx.fillStyle = `rgba(${light},${light},${light},${alpha})`;
    ctx.fillRect(Math.random() * s, Math.random() * s, Math.random() * 5 + 1, Math.random() * 5 + 1);
  }

  const path = new Path2D();
  path.moveTo(toPxX(0), toPxZ(58));
  path.bezierCurveTo(toPxX(-7), toPxZ(42), toPxX(6), toPxZ(28), toPxX(-3), toPxZ(15));
  path.bezierCurveTo(toPxX(-13), toPxZ(2), toPxX(15), toPxZ(-10), toPxX(0), toPxZ(-25));
  path.bezierCurveTo(toPxX(-6), toPxZ(-34), toPxX(5), toPxZ(-39), toPxX(0), toPxZ(-45));

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(18,16,14,0.36)';
  ctx.lineWidth = worldW(6.2);
  ctx.stroke(path);
  ctx.strokeStyle = hexColor(C.groundPath);
  ctx.lineWidth = worldW(3.4);
  ctx.stroke(path);
  ctx.strokeStyle = 'rgba(246,243,235,0.10)';
  ctx.lineWidth = worldW(0.12);
  for (let i = -2; i <= 2; i++) {
    ctx.setLineDash([worldW(0.8), worldW(1.8)]);
    ctx.lineDashOffset = i * 9;
    ctx.stroke(path);
  }
  ctx.restore();

  for (let i = 0; i < 2600; i++) {
    const x = toPxX((Math.random() - 0.5) * 160);
    const z = toPxZ((Math.random() - 0.5) * 160);
    ctx.fillStyle = `rgba(122,112,72,${Math.random() * 0.14})`;
    ctx.beginPath();
    ctx.ellipse(x, z, Math.random() * 6 + 1, Math.random() * 2 + 0.5, Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1, 1);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeWallTex() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#efe6d2';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 2000; i++) {
    ctx.fillStyle = `rgba(${110+Math.random()*30},${100+Math.random()*30},${80+Math.random()*30},${Math.random()*0.12})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
  for (let i = 0; i < 4; i++) {
    const g = ctx.createRadialGradient(Math.random()*s, Math.random()*s, 5, Math.random()*s, Math.random()*s, 40);
    g.addColorStop(0, 'rgba(120,100,80,0.15)');
    g.addColorStop(1, 'rgba(120,100,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function makeBigChar(char, mirror = false) {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  // 木质底
  ctx.fillStyle = '#3a2a20';
  ctx.fillRect(0, 0, s, s);
  // 木纹
  for (let i = 0; i < 30; i++) {
    ctx.fillStyle = `rgba(${60+Math.random()*30},${40+Math.random()*20},${25+Math.random()*15},${0.3+Math.random()*0.3})`;
    ctx.fillRect(0, Math.random()*s, s, 1);
  }
  // 朱砂边
  ctx.strokeStyle = '#7F2020';
  ctx.lineWidth = 6;
  ctx.strokeRect(8, 8, s-16, s-16);
  // 镜像处理：让此 canvas 用于 -z / -x 等 BoxGeometry 反面时也能正向显示
  if (mirror) {
    ctx.translate(s, 0);
    ctx.scale(-1, 1);
  }
  // 大字
  ctx.fillStyle = '#f4ead0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let fontSize = 180;
  do {
    ctx.font = `bold ${fontSize}px "Noto Serif SC","Songti SC",serif`;
    if (ctx.measureText(char).width <= s - 28) break;
    fontSize -= 6;
  } while (fontSize > 38);
  ctx.fillText(char, s/2, s/2 + 4);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function addWallSegment(cx, cz, w, d, h, gateW = 0) {
  // h = wall height; gateW > 0 means leave a gate in the center
  const wallParts = [];
  if (gateW > 0) {
    const sideW = (w - gateW) / 2;
    if (sideW > 0.1) {
      wallParts.push([cx - (gateW/2 + sideW/2), cz, sideW, d, h]);
      wallParts.push([cx + (gateW/2 + sideW/2), cz, sideW, d, h]);
    }
    // 月洞门顶部横梁
    const lintelH = 1.2;
    wallParts.push([cx, cz, gateW, d, lintelH, h - lintelH]); // raised lintel
  } else {
    wallParts.push([cx, cz, w, d, h]);
  }
  for (const part of wallParts) {
    const [x, z, pw, pd, ph, py] = part;
    const yOff = py !== undefined ? py : 0;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, pd), wallMat);
    mesh.position.set(x, ph/2 + yOff, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    // 屋顶（黛瓦）
    const tileTop = new THREE.Mesh(new THREE.BoxGeometry(pw + 0.2, 0.15, pd + 0.2), tileMat);
    tileTop.position.set(x, ph + yOff + 0.075, z);
    tileTop.castShadow = true;
    scene.add(tileTop);
    // 物理刚体
    const body = new CANNON.Body({ mass: 0, material: groundMat });
    body.addShape(new CANNON.Box(new CANNON.Vec3(pw/2, ph/2, pd/2)));
    body.position.set(x, ph/2 + yOff, z);
    world.addBody(body);
  }
}

function makePlum(x, z) {
  const g = new THREE.Group();
  // 弯干 (4 节)
  let prev = new THREE.Vector3(0, 0, 0);
  const trunkMat = new THREE.MeshStandardMaterial({ color: C.woodDark, roughness: 0.85 });
  for (let i = 0; i < 4; i++) {
    const next = new THREE.Vector3(prev.x + (Math.random()-0.5)*0.3, prev.y + 0.5, prev.z + (Math.random()-0.5)*0.3);
    const mid = new THREE.Vector3().addVectors(prev, next).multiplyScalar(0.5);
    const len = prev.distanceTo(next);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, len, 8), trunkMat);
    cyl.position.copy(mid);
    const dir = next.clone().sub(prev).normalize();
    cyl.lookAt(next);
    cyl.rotateX(Math.PI / 2);
    g.add(cyl);
    prev = next;
  }
  // 花簇 (红)
  const flowerMat = new THREE.MeshStandardMaterial({ color: C.plum, emissive: C.plum, emissiveIntensity: 0.04, roughness: 0.6 });
  for (let i = 0; i < 12; i++) {
    const flower = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), flowerMat);
    flower.position.set((Math.random()-0.5)*1.2, 1.4 + Math.random()*0.8, (Math.random()-0.5)*1.2);
    g.add(flower);
  }
  g.position.set(x, 0, z); scene.add(g);
}

function buildPond() {
  const g = new THREE.Group();
  const w = 30, d = 12;
  const alphaCanvas = document.createElement('canvas');
  alphaCanvas.width = 1024; alphaCanvas.height = 512;
  const actx = alphaCanvas.getContext('2d');
  actx.fillStyle = '#000000';
  actx.fillRect(0, 0, 1024, 512);
  actx.fillStyle = '#ffffff';
  actx.beginPath();
  actx.ellipse(512, 256, 480, 230, 0, 0, Math.PI * 2);
  actx.fill();
  const alphaTex = new THREE.CanvasTexture(alphaCanvas);

  const colorCanvas = document.createElement('canvas');
  colorCanvas.width = 1024; colorCanvas.height = 512;
  const cctx = colorCanvas.getContext('2d');
  const grad = cctx.createRadialGradient(512, 256, 0, 512, 256, 480);
  grad.addColorStop(0, hexColor(C.pondDeep));
  grad.addColorStop(0.7, hexColor(C.pondShallow));
  grad.addColorStop(1, '#C8D2C5');
  cctx.fillStyle = grad;
  cctx.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 200; i++) {
    cctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`;
    cctx.beginPath();
    cctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 8, 0, Math.PI * 2);
    cctx.fill();
  }
  const colorTex = new THREE.CanvasTexture(colorCanvas);
  colorTex.colorSpace = THREE.SRGBColorSpace;

  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({
      map: colorTex,
      alphaMap: alphaTex,
      transparent: true,
      roughness: 0.4,
      metalness: 0.2,
      side: THREE.DoubleSide
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -0.05, 0);
  g.add(water);

  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(
      new THREE.CircleGeometry(0.45 + Math.random() * 0.15, 16),
      new THREE.MeshStandardMaterial({ color: C.bamboo, side: THREE.DoubleSide, roughness: 0.8 })
    );
    leaf.rotation.x = -Math.PI / 2;
    leaf.position.set((Math.random() - 0.5) * 20, 0.02, (Math.random() - 0.5) * 7);
    g.add(leaf);
  }

  const koi = [];
  for (let i = 0; i < 3; i++) {
    const fish = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 6),
      new THREE.MeshStandardMaterial({ color: C.accent, emissive: C.accent, emissiveIntensity: 0.18, roughness: 0.45 })
    );
    fish.scale.set(1, 0.4, 0.6);
    fish.position.set((i - 1) * 6, 0.04, i % 2 === 0 ? -2 : 2);
    fish.userData = { baseX: fish.position.x, baseZ: fish.position.z, phase: i * 1.2 };
    g.add(fish);
    koi.push(fish);
  }
  g.userData.koi = koi;
  scene.add(g);
  pondGroup = g;
}

function buildArchBridge() {
  const g = new THREE.Group();
  const deckMat = new THREE.MeshStandardMaterial({ color: C.bridge, roughness: 0.88, flatShading: true });
  const visualSteps = 9;
  for (let i = 0; i < visualSteps; i++) {
    const t = (i / (visualSteps - 1)) * 2 - 1;
    const yArch = 1.25 * Math.cos(t * Math.PI / 2);
    const z = t * 7;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.28, 1.55), deckMat);
    slab.position.set(0, 0.5 + yArch, z);
    slab.castShadow = true;
    slab.receiveShadow = true;
    g.add(slab);
  }

  const railMat = new THREE.MeshStandardMaterial({ color: C.wallStone, roughness: 0.9 });
  for (const side of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 14.2), railMat);
    rail.position.set(side * 2.25, 2.0, 0);
    g.add(rail);
  }

  for (const side of [-1, 1]) {
    for (let i = 0; i < 6; i++) {
      const pillar = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 0.6, 0.25),
        new THREE.MeshStandardMaterial({ color: C.bridge, roughness: 0.88 })
      );
      pillar.position.set(side * 2, 1.8, -5 + i * 2);
      g.add(pillar);
    }
  }

  scene.add(g);

  const halfWidth = 2;
  const stepCount = 9;
  for (let i = 0; i < stepCount; i++) {
    const t = (i / (stepCount - 1)) * 2 - 1;
    const yArch = 1.25 * Math.cos(t * Math.PI / 2);
    const z = t * 7;
    const stepBody = new CANNON.Body({
      mass: 0,
      material: groundMat,
      shape: new CANNON.Box(new CANNON.Vec3(halfWidth, 0.24, 0.9))
    });
    stepBody.position.set(0, 0.55 + yArch, z);
    world.addBody(stepBody);
  }
}

// ============ (13) "格物致知" 立体字 (核心 wow point) ============
const wordChars = ['格', '物', '致', '知'];
const stereoChars = [];
function buildStereoWord() {
  const wordX = [-4.5, -1.5, 1.5, 4.5];
  for (let i = 0; i < 4; i++) {
    const tex     = makeBigChar(wordChars[i]);
    const texMirr = makeBigChar(wordChars[i], true);  // 预镜像版本，用于 -z 面
    // 用 6 个独立材质（BoxGeometry 6 面），正反面分别贴正/镜像贴图以保证从两侧都正向可读
    const matFront = new THREE.MeshStandardMaterial({ map: tex,     roughness: 0.5, metalness: 0.05 });
    const matBack  = new THREE.MeshStandardMaterial({ map: texMirr, roughness: 0.5, metalness: 0.05 });
    const matSide  = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.8 });
    // BoxGeometry 材质 index 顺序: [+x, -x, +y, -y, +z, -z]
    // +z 是默认贴图正向面，-z 默认是镜像。我们给前后两面都指定 map，
    // 然后通过 mesh.rotation.y = Math.PI 让 -z 面朝向玩家（玩家从 +z 接近）。
    // 但因为正反面都有贴图，无论哪面朝向玩家文字都不镜像。
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.6, 0.6, 0.2),
      [matSide, matSide, matSide, matSide, matFront, matBack]
    );
    mesh.position.set(wordX[i], 0.3, -12);
    mesh.castShadow = true;
    scene.add(mesh);
    // 物理
    const body = new CANNON.Body({ mass: 1.5, material: groundMat });
    body.addShape(new CANNON.Box(new CANNON.Vec3(0.3, 0.3, 0.1)));
    body.position.set(wordX[i], 0.3, -12);
    body.linearDamping = 0.35;
    body.angularDamping = 0.45;
    world.addBody(body);
    stereoChars.push({ mesh, body });
  }
}

function makeWoodSignTex(text, sub, mirror = false) {
  const w = 512, h = 256;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor(C.woodDark);
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 36; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
    ctx.fillRect(0, Math.random() * h, w, 1);
  }
  if (mirror) {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.strokeStyle = hexColor(C.accent);
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, w - 36, h - 36);
  ctx.fillStyle = hexColor(C.cream);
  ctx.font = 'bold 64px "Noto Serif SC","Songti SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 - 18);
  ctx.font = '28px "JetBrains Mono",monospace';
  ctx.fillText(sub, w / 2, h / 2 + 58);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function stdMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.86,
    metalness: opts.metalness ?? 0,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1,
    side: opts.side ?? THREE.FrontSide,
    flatShading: opts.flatShading ?? false
  });
}

function meshBox(w, h, d, color, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stdMat(color, opts));
  mesh.castShadow = opts.castShadow ?? true;
  mesh.receiveShadow = opts.receiveShadow ?? true;
  return mesh;

function addStaticBox(x, y, z, hx, hy, hz, yaw = 0, pitch = 0) {
  const body = new CANNON.Body({ mass: 0, material: groundMat });
  body.addShape(new CANNON.Box(new CANNON.Vec3(hx, hy, hz)));
  body.position.set(x, y, z);
  if (yaw || pitch) {
    const qx = new CANNON.Quaternion();
    const qy = new CANNON.Quaternion();
    qx.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), pitch);
    qy.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
    qy.mult(qx, body.quaternion);
  }
  world.addBody(body);
  return body;
}

function makeLabelTexture(title, sub = '', mirror = false, opts = {}) {
  const w = opts.w || 512;
  const h = opts.h || 256;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor(opts.bg ?? C.woodDark);
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 42; i++) {
    ctx.fillStyle = `rgba(246,243,235,${Math.random() * 0.06})`;
    ctx.fillRect(0, Math.random() * h, w, 1);
  }
  ctx.strokeStyle = hexColor(opts.line ?? C.goldStrong);
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, w - 36, h - 36);
  ctx.lineWidth = 1;
  ctx.strokeRect(30, 30, w - 60, h - 60);
  if (mirror) {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.fillStyle = hexColor(opts.fg ?? C.paper);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const main = String(title || '').trim();
  let fontSize = opts.mainSize || 46;
  do {
    ctx.font = `600 ${fontSize}px "Noto Serif SC","Songti SC",serif`;
    if (ctx.measureText(main).width < w - 88) break;
    fontSize -= 3;
  } while (fontSize > 18);
  ctx.fillText(main, w / 2, sub ? h / 2 - 22 : h / 2);
  if (sub) {
    ctx.fillStyle = hexColor(opts.subFg ?? C.starWarm);
    ctx.font = `${opts.subSize || 22}px "JetBrains Mono",monospace`;
    const subLines = wrapText(ctx, sub, w - 90).slice(0, 2);
    let y = h / 2 + 34;
    subLines.forEach(line => {
      ctx.fillText(line, w / 2, y);
      y += 26;
    });
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

    const x = -170 + i * (340 / 36);
    const t = i / 36;
    const ridge = h * (0.34 + 0.18 * Math.sin(t * 17 + offset) + 0.12 * Math.sin(t * 31 + offset * 0.7));
    shape.lineTo(x, ridge + h * 0.18);
  }
  shape.lineTo(170, -h * 0.32);
  shape.lineTo(-170, -h * 0.32);
  shape.lineTo(-170, 0);
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: alpha < 1, opacity: alpha, fog: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, h * 0.18, z);
  scene.add(mesh);
  return mesh;
}

function buildAwardCauldron(awardData, position, scaleFactor) {
  const group = new THREE.Group();

  const mainColor = isGold ? C.goldStrong : (isSilver ? C.silver : C.stoneDark);
  const mat = stdMat(mainColor, { metalness: isGold || isSilver ? 0.32 : 0.06, roughness: 0.48, emissive: isGold ? 0x3a2810 : 0x000000, emissiveIntensity: isGold ? 0.18 : 0 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.72 * scaleFactor, 0.52 * scaleFactor, 1.0 * scaleFactor, 18), mat);
  body.position.y = 0.6 * scaleFactor;
  group.add(body);
  for (let i = 0; i < 3; i++) {
    const angle = i * (Math.PI * 2 / 3);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07 * scaleFactor, 0.05 * scaleFactor, 0.45 * scaleFactor, 6), mat);
    leg.position.set(Math.sin(angle) * 0.52 * scaleFactor, 0.22 * scaleFactor, Math.cos(angle) * 0.52 * scaleFactor);

  for (const side of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.TorusGeometry(0.18 * scaleFactor, 0.04 * scaleFactor, 6, 14), mat);
    ear.position.set(side * 0.72 * scaleFactor, 1.08 * scaleFactor, 0);
    ear.rotation.x = Math.PI / 2;
    group.add(ear);
  }
  const front = makeAwardPlaque(awardData.name, awardData.issuer, false);
  front.position.set(0, 0.68 * scaleFactor, 0.73 * scaleFactor);
  const back = makeAwardPlaque(awardData.name, awardData.issuer, true);
  back.position.set(0, 0.68 * scaleFactor, -0.73 * scaleFactor);
  back.rotation.y = Math.PI;
  group.add(front, back);

  if (awardData.id === 'a-feishu-top10') {
    for (let i = 0; i < 4; i++) {
      const flag = makePrayerFlag(0.77 + i * 0.12);
      flag.position.set(-1.4 + i * 0.95, 1.95, -1.2);
      group.add(flag);
    }
  }

  group.position.set(position.x, position.y, position.z);
  group.userData.awardId = awardData.id;
  group.userData.proximityRadius = 5;
  scene.add(group);
  trophies.push({ group, award: awardData, x: position.x, z: position.z });

  addStaticBox(position.x, position.y + 0.75 * scaleFactor, position.z, 0.8 * scaleFactor, 0.75 * scaleFactor, 0.8 * scaleFactor);
  return group;
}

function buildPrayerFlagArray() {
  const positions = [
    { x: -40, z: 10 }, { x: 40, z: 10 }, { x: -30, z: -10 }, { x: 30, z: -10 },
    { x: -45, z: -35 }, { x: 45, z: -35 }, { x: 0, z: 35 }, { x: 0, z: -65 }
  ];
  const poleMesh = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.08, 0.08, 4, 6),
    stdMat(C.woodDark),
    positions.length * 2
  );
  const flagMesh = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.78, 0.48, 4, 1),
    new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, side: THREE.DoubleSide, roughness: 0.86 }),
    positions.length * 5
  );
  const dummy = new THREE.Object3D();
  const flagColors = [C.prayerFlag1, C.prayerFlag2, C.prayerFlag3, C.prayerFlag4, C.prayerFlag5].map(c => new THREE.Color(c));
  let poleIndex = 0;
  let flagIndex = 0;
  positions.forEach((p, groupIndex) => {
    for (const s of [-1, 1]) {
      dummy.position.set(p.x + s * 2.5, 2, p.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      poleMesh.setMatrixAt(poleIndex++, dummy.matrix);
    }
    for (let i = 0; i < 5; i++) {
      dummy.position.set(p.x - 1.55 + i * 0.78, 3.48 - i * 0.2, p.z);
      dummy.rotation.set(0, (groupIndex % 2) * 0.12, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      flagMesh.setMatrixAt(flagIndex, dummy.matrix);
      flagMesh.setColorAt(flagIndex, flagColors[i]);
      flagIndex++;
    }
  });
  flagMesh.instanceMatrix.needsUpdate = true;
  if (flagMesh.instanceColor) flagMesh.instanceColor.needsUpdate = true;
  flagMesh.userData.baseRotZ = 0;
  flagMesh.userData.windPhase = Math.random() * Math.PI * 2;
  flagMesh.userData.uWindDirection = uWindDirection;
  scene.add(poleMesh, flagMesh);
  animatables.push({ mesh: flagMesh, type: 'flagField', uWind });
}

function buildPineForest() {
  const positions = [
    [-48, 46], [-38, 34], [-53, 18], [-42, -4], [-52, -24],
    [46, 48], [36, 31], [54, 10], [43, -13], [52, -33],
    [-27, 42], [28, 42], [-38, -47], [38, -48], [-58, -60],
    [58, -62], [-66, 5], [66, 5], [-24, -58], [24, -58]
  ];
  const forest = new THREE.Group();
  const dummy = new THREE.Object3D();
  const trunkMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.13, 0.22, 2.4, 8), stdMat(C.woodDark), positions.length);
  const coneMeshes = [0, 1, 2].map(i => new THREE.InstancedMesh(
    new THREE.ConeGeometry(1.05 - i * 0.22, 0.85, 8),
    stdMat(C.pine),
    positions.length
  ));
  positions.forEach(([x, z], i) => {
    const s = 0.85 + (i % 5) * 0.08;
    const yaw = (i * 0.71) % (Math.PI * 2);
    dummy.position.set(x, 1.2 * s, z);
    dummy.scale.set(s, s, s);
    dummy.rotation.set(0, yaw, 0);
    dummy.updateMatrix();
    trunkMesh.setMatrixAt(i, dummy.matrix);
    coneMeshes.forEach((mesh, layer) => {
      dummy.position.set(x, (1.72 + layer * 0.62) * s, z);
      dummy.scale.set(s, s, s);
      dummy.rotation.set(0, yaw, 0);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
    });
  });
  forest.add(trunkMesh, ...coneMeshes);
  scene.add(forest);
  animatables.push({ mesh: forest, type: 'pine', uWind });
}

function updateWindAnimation(time) {
  uWind.direction.x = Math.cos(time * 0.0003) * 0.7 + 0.3;
  uWind.direction.y = Math.sin(time * 0.0004) * 0.5 + 0.3;
  uWind.direction.normalize();
  uWindDirection.copy(uWind.direction);
  uWind.strength = 0.8 + Math.sin(time * 0.0008) * 0.3;

  animatables.forEach(a => {
    if (a.type === 'prayer') {
      const phase = a.mesh.userData.windPhase || 0;
      const t = time * 0.001 + phase;
      a.mesh.rotation.z = Math.sin(t * 2) * 0.25 * uWind.strength;
      a.mesh.position.y = a.mesh.userData.basePos.y + Math.sin(t * 3) * 0.08 * uWind.strength;
    } else if (a.type === 'pine') {
      a.mesh.rotation.x = Math.sin(time * 0.0008 + a.mesh.position.x) * 0.035 * uWind.strength;
      a.mesh.rotation.z = Math.sin(time * 0.0007 + a.mesh.position.z) * 0.025 * uWind.strength;
    } else if (a.type === 'grass') {
      a.mesh.rotation.x = Math.sin(time * 0.0012 + a.mesh.position.x) * 0.12 * uWind.strength;
    } else if (a.type === 'flagField') {
      a.mesh.rotation.z = Math.sin(time * 0.0018 + (a.mesh.userData.windPhase || 0)) * 0.035 * uWind.strength;
    } else if (a.type === 'armillar') {
      a.mesh.rotation.y = time * 0.00022;
      a.mesh.rotation.x = Math.sin(time * 0.00017) * 0.28;
    } else if (a.type === 'window') {
      a.mesh.material.opacity = 0.62 + Math.sin(time * 0.001 + a.mesh.position.x) * 0.14;
    }
  });
}

// 撞前方挡墙时自动腾起 (用户冲坡 = 自动起飞, 不用按 Space)
let lastBoostTime = 0;
chassisBody.addEventListener('collide', (e) => {
  if (performance.now() - lastBoostTime < 600) return;  // 600ms 防抖
  const speed = Math.hypot(chassisBody.velocity.x, chassisBody.velocity.z);
  if (speed < 6) return;  // 高速撞才触发
  if (chassisBody.position.y > 1.5) return;  // 在空中不再连发
  // 检测撞击是否来自车前方 (normal 与车头方向有较大对齐)
  const fwd = new CANNON.Vec3(0, 0, -1);
  chassisBody.quaternion.vmult(fwd, fwd);
  const n = e.contact.ni;
  const dot = n.x * fwd.x + n.z * fwd.z;
  if (Math.abs(dot) > 0.5) {
    chassisBody.velocity.y = 9;  // 起飞
    lastBoostTime = performance.now();
  }
});

  cursor.classList.remove('far', 'near', 'trigger');

}

function playBellTone() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(196, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(98, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.05);
    setTimeout(() => ctx.close(), 1300);
  } catch (err) {
    // Audio is optional; browser gesture policies vary.
  }
}

  drawerEl.classList.add('award');
  drawerEl.classList.remove('contact');
  drawerBody.innerHTML = `
    <div class="label">AWARD · 荣誉</div>
    <h1>${a.name || ''}</h1>
    <h2>${a.issuer || ''}${a.issuer_track ? ' · ' + a.issuer_track : ''}</h2>
    <div class="meta">${a.date || ''}${a.ratio_display ? '  ·  ' + a.ratio_display : ''}</div>
    <div class="divider"></div>
    <div class="desc">${a.description || ''}</div>
    <div class="actions">
      ${a.url ? `<a href="${a.url}" target="_blank">${a.url_label || '查看'} <span class="arrow">↗</span></a>` : ''}
    </div>
  `;
  drawerEl.classList.add('show');
  drawerOpen = true;
}
function closeDrawer() {
  drawerEl.classList.remove('show');
  drawerOpen = false;
  cursor.classList.remove('hover');
}

// ============ INTERACTION (E) ============
let nearestScroll = null;
let nearestContact = null;
let nearestTrophy = null;
function tryInteract() {
  if (drawerOpen) { closeDrawer(); return; }
  if (nearestScroll) { openProject(nearestScroll.project); return; }
  if (nearestContact) { openContact(nearestContact.contact); return; }
  if (nearestTrophy) { openAward(nearestTrophy.award); return; }
}

// ============ RESET CAR ============
function resetCar() {
  chassisBody.position.set(0, 1.5, 55);
  chassisBody.velocity.set(0, 0, 0);
  chassisBody.angularVelocity.set(0, 0, 0);
  chassisBody.quaternion.set(0, 0, 0, 1);
  // 清掉所有按键 + 引擎/转向/刹车残留, 避免"重置后车自动开走再翻"循环
  for (const k in keys) keys[k] = false;
  if (vehicle) {
    for (let i = 0; i < 4; i++) {
      vehicle.applyEngineForce(0, i);
      vehicle.setBrake(2, i);
      vehicle.setSteeringValue(0, i);
    }
  }
}

// ============ HELP ============
document.getElementById('helpIc').addEventListener('click', () => {
  drawerEl.classList.remove('contact', 'award');
  drawerBody.innerHTML = `
    <div class="label">HELP · 操控</div>
    <h1>边塞观星指引</h1>
    <div class="divider"></div>
    <div class="desc" style="line-height:2;">
      <strong>W A S D / ↑↓←→</strong> 驾车<br/>
      <strong>SHIFT</strong> 疾驰<br/>
      <strong>SPACE</strong> 跃起<br/>
      <strong>R</strong> 复位至山门<br/>
      <strong>鼠标拖拽</strong> 观四方<br/>
      <strong>E</strong> 阅卷 / 联系 / 荣誉<br/>
      <strong>ESC</strong> 关闭<br/>
      <br/>
      <em>沿沙路北行可见 5 个项目站，山门前有 4 根联系石碑。</em><br/>
      <em>主塔后方山顶平台陈列 3 座奖鼎。</em>
    </div>
  `;
  drawerEl.classList.add('show');
  drawerOpen = true;
});

// ============ ANIMATION LOOP ============
const clock = new THREE.Clock();
const tempVec = new THREE.Vector3();
const tempQuat = new THREE.Quaternion();
const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();

const MAX_FORCE = 240;
const MAX_BRAKE = 18;
const STEER_MAX = 0.6;
const BOOST_MULT = 1.8;
// 飞跃 vy 上限放宽: 让坡顶能腾空 ~1.5 秒, 飞跃感明显但仍受重力收回
const RAMP_LAUNCH_VY_CAP = 12;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 1/30);

  if (!gameStarted) {
    renderer.render(scene, camera);
    updateCursor(dt);
    return;
  }

  // === input → vehicle ===
  if (vehicle && !inputLocked) {
    const boost = keys.shift ? BOOST_MULT : 1;
    // 上坡推力强补偿 (车头朝上 -> 推力放大 1x ~ 2.2x), 前驱不会翻车故可大力
    const fwdW = new CANNON.Vec3(0, 0, -1);
    chassisBody.quaternion.vmult(fwdW, fwdW);
    const climbBoost = 1 + Math.max(0, fwdW.y) * 1.2;
    let force = 0;
    if (keys.w) force = MAX_FORCE * boost * climbBoost;
    else if (keys.s) force = -MAX_FORCE * 0.5 * boost;
    // 前驱: 引擎力只给前轮 (index 2/3, z=-0.7 车头侧)
    // 加速时前轮拖车头走 -> 车头被压低反而稳 (后驱翘头容易翻)
    vehicle.applyEngineForce(force, 2);
    vehicle.applyEngineForce(force, 3);
    // 飞跃: vy 超阈值则削顶, 防止跳台/坡顶飞太远
    if (chassisBody.velocity.y > RAMP_LAUNCH_VY_CAP) {
      chassisBody.velocity.y = RAMP_LAUNCH_VY_CAP;
    }

    // 前轮转向: 车头朝 -Z, 故前轮是 z=-0.7 那对 (index 2/3)
    let steer = 0;
    if (keys.a) steer = STEER_MAX;
    if (keys.d) steer = -STEER_MAX;
    vehicle.setSteeringValue(steer, 2);
    vehicle.setSteeringValue(steer, 3);

    const brake = (!keys.w && !keys.s) ? 0.6 : 0;
    for (let i = 0; i < 4; i++) vehicle.setBrake(brake, i);

    // jump: Space 主动起跳力加大, 可跳过 ~2m 高度
    if (keys.space && Math.abs(chassisBody.velocity.y) < 0.5 && chassisBody.position.y < 1.5) {
      chassisBody.velocity.y = 11;
    }

    // brake light
    const braking = !keys.w && !keys.s && chassisBody.velocity.length() > 0.5;
    brakeLightMeshes.forEach(b => {
      b.material.emissiveIntensity = braking ? 1.2 : 0.2;
      b.material.opacity = braking ? 1.0 : 0.4;
    });
  }

  // === physics step ===
  world.step(1/60, dt, 3);
  updateWindAnimation(performance.now());

  // === sync car visuals ===
  if (carGroup && chassisBody) {
    carGroup.position.copy(chassisBody.position);
    carGroup.quaternion.copy(chassisBody.quaternion);
  }

  // === wheels ===
  if (vehicle) {
    for (let i = 0; i < vehicle.wheelInfos.length; i++) {
      vehicle.updateWheelTransform(i);
      const t = vehicle.wheelInfos[i].worldTransform;
      const m = wheelMeshes[i];
      if (m) {
        m.position.copy(t.position);
        m.quaternion.copy(t.quaternion);
      }
    }
  }

  // === proximity ===
  nearestScroll = null;
  nearestContact = null;
  nearestTrophy = null;
  let promptShown = false;
  let cursorText = null;
  const cp = chassisBody.position;
  let closestInteractiveDistance = Infinity;
  const markDistance = (x, z) => {
    const dx = cp.x - x, dz = cp.z - z;
    const d = Math.sqrt(dx * dx + dz * dz);
    if (d < closestInteractiveDistance) closestInteractiveDistance = d;
    return d;
  };
  for (const s of scrolls) {
    const dist = markDistance(s.x, s.z);
    if (dist < 6.0) {
      nearestScroll = s;
      promptText.textContent = ' 阅卷 · ' + (s.project.name_cn || '').slice(0, 12);
      promptEl.classList.add('show');
      promptShown = true;
      cursorText = '阅卷';
      s.group.rotation.y = s.yaw + Math.sin(clock.elapsedTime * 2.2) * 0.08;
      break;
    } else {
      s.group.rotation.y += (s.yaw - s.group.rotation.y) * 0.08;
    }
  }
  if (!promptShown) {
    for (const c of contactDecals) {
      const dist = markDistance(c.x, c.z);
      if (dist < 4.0) {
        nearestContact = c;
        promptText.textContent = ' 联系 · ' + (c.contact.display || '').slice(0, 18);
        promptEl.classList.add('show');
        promptShown = true;
        cursorText = '联系';
        break;
      }
    }
  }
  if (!promptShown) {
    for (const tr of trophies) {
      const dist = markDistance(tr.x, tr.z);
      if (dist < 5.0) {
        nearestTrophy = tr;
        promptText.textContent = ' 荣誉 · ' + (tr.award.name || '').slice(0, 16);
        promptEl.classList.add('show');
        promptShown = true;
        cursorText = '观赏';
        break;
      }
    }
  }
  if (!promptShown) promptEl.classList.remove('show');
  // 3D 场景接管 cursor-ring 显示状态
  let ringState = 'idle';
  if (closestInteractiveDistance < 5) ringState = 'trigger';
  else if (closestInteractiveDistance < 15) ringState = 'near';
  else if (closestInteractiveDistance < 45) ringState = 'far';
  const ringProgress = Number.isFinite(closestInteractiveDistance)
    ? Math.max(0, Math.min(1, 1 - closestInteractiveDistance / 15)) * 360
    : 0;
  cursor.style.setProperty('--ring-progress', `${ringProgress.toFixed(0)}deg`);
  setSceneCursor(cursorText, ringState);

  // === camera follow ===
  if (chassisBody) {
    const q = chassisBody.quaternion;
    // 车头朝 local -Z (车实际朝 -Z 开向场地中心)
    const carFwd = new CANNON.Vec3(0, 0, -1);
    q.vmult(carFwd, carFwd);
    const speedMs = Math.hypot(chassisBody.velocity.x, chassisBody.velocity.z);
    const vNorm = Math.min(speedMs / 18, 1);
    let targetFov = THREE.MathUtils.lerp(70, 85, vNorm);
    const steerMag = (keys.a || keys.d) ? 1 : 0;
    if (steerMag) targetFov -= 4.5;
    camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, 0.06);
    camera.updateProjectionMatrix();

    const dist = THREE.MathUtils.lerp(4.0, 7.0, vNorm);
    const heightOff = THREE.MathUtils.lerp(2.0, 1.3, vNorm);
    camTarget.set(
      chassisBody.position.x + carFwd.x * THREE.MathUtils.lerp(5, 12, vNorm),
      chassisBody.position.y + 1.15,
      chassisBody.position.z + carFwd.z * THREE.MathUtils.lerp(5, 12, vNorm)
    );
    const baseBack = -carFwd.x * dist;
    const baseBackZ = -carFwd.z * dist;
    const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
    const finalBack = baseBack * cosY - baseBackZ * sinY;
    const finalBackZ = baseBack * sinY + baseBackZ * cosY;
    camDesired.set(
      chassisBody.position.x + finalBack,
      chassisBody.position.y + heightOff,
      chassisBody.position.z + finalBackZ
    );

    const diveElapsed = introDiveActive ? Math.min((performance.now() - introDiveStart) / 1500, 1) : 1;
    if (introDiveActive && diveElapsed < 1) {
      const eased = diveElapsed < 0.5 ? 2 * diveElapsed * diveElapsed : 1 - Math.pow(-2 * diveElapsed + 2, 2) / 2;
      camera.position.set(
        THREE.MathUtils.lerp(0, camDesired.x, eased),
        THREE.MathUtils.lerp(80, camDesired.y, eased),
        THREE.MathUtils.lerp(80, camDesired.z, eased)
      );
      camera.lookAt(0, 8, -55);
    } else {
      // 高速时 damping 极高几乎瞬移跟车; 同时硬盾: 距离超过 1.5x dist 直接 snap
      const damping = 1 - Math.exp(-THREE.MathUtils.lerp(9, 25, vNorm) * dt);
      camera.position.lerp(camDesired, damping);
      const camDist = camera.position.distanceTo(camDesired);
      const maxDist = dist * 1.5;
      if (camDist > maxDist) camera.position.copy(camDesired);
      camera.lookAt(camTarget);
    }
  }

  // === HUD update ===
  if (chassisBody) {
    const speed = chassisBody.velocity.length() * 3.6;
    document.getElementById('speedVal').textContent = speed.toFixed(0) + ' km/h';
    document.getElementById('posVal').textContent = `x ${chassisBody.position.x.toFixed(1)}  z ${chassisBody.position.z.toFixed(1)}`;
  }

  // === 30s tutorial: gate prompt ===
  const elapsed = (performance.now() - startTime) / 1000;
  if (elapsed > 18 && elapsed < 30 && chassisBody) {
    // near the first scroll cluster
    const dx = chassisBody.position.x;
    const dz = chassisBody.position.z - 22;
    const distGate = Math.sqrt(dx*dx + dz*dz);
    if (distGate < 14 && !window._gatePromptShown) {
      window._gatePromptShown = true;
      hintEl.classList.add('show');
      hintEl.querySelector('.title').textContent = '按 E 阅卷';
      hintEl.querySelector('.sub').textContent = 'READ SCROLL';
      setTimeout(() => hintEl.classList.remove('show'), 4500);
    }
  }

  // === bounds: keep car inside ===
  if (chassisBody) {
    const halfBound = 120;
    if (Math.abs(chassisBody.position.x) > halfBound || Math.abs(chassisBody.position.z) > halfBound) {
      // gentle pushback
      if (chassisBody.position.x > halfBound) chassisBody.position.x = halfBound;
      if (chassisBody.position.x < -halfBound) chassisBody.position.x = -halfBound;
      if (chassisBody.position.z > halfBound) chassisBody.position.z = halfBound;
      if (chassisBody.position.z < -halfBound) chassisBody.position.z = -halfBound;
    }
    if (chassisBody.position.y < -5) resetCar();
  }

  // === 翻车自动复位检测 ===
  // 车的 local-up 经 quaternion 旋转后取 world-Y 分量；< 0.3 视为侧翻/倒翻
  if (chassisBody) {
    const localUp = new CANNON.Vec3(0, 1, 0);
    const worldUp = new CANNON.Vec3();
    chassisBody.quaternion.vmult(localUp, worldUp);
    const upDot = worldUp.y;
    if (upDot < 0.3) {
      if (!window._flipTime) {
        window._flipTime = performance.now();
        // 显示提示
        const fn = document.getElementById('flipNotice');
        if (fn) fn.classList.add('show');
      }
      if (performance.now() - window._flipTime > 1500) {
        // 自动复位：保留 x/z 位置 + y 抬高 + quaternion 清零
        const px = chassisBody.position.x;
        const pz = chassisBody.position.z;
        chassisBody.position.set(px, 2, pz);
        chassisBody.velocity.set(0, 0, 0);
        chassisBody.angularVelocity.set(0, 0, 0);
        chassisBody.quaternion.set(0, 0, 0, 1);
        window._flipTime = null;
        const fn = document.getElementById('flipNotice');
        if (fn) fn.classList.remove('show');
      }
    } else if (window._flipTime) {
      window._flipTime = null;
      const fn = document.getElementById('flipNotice');
      if (fn) fn.classList.remove('show');
    }
  }

  updateCursor(dt);
  renderer.render(scene, camera);
}

function updateCursor(dt) {
  // lerp 0.22 跟随
  cursorRX += (cursorTX - cursorRX) * 0.22;
  cursorRY += (cursorTY - cursorRY) * 0.22;
  cursor.style.transform = `translate3d(${cursorRX}px, ${cursorRY}px, 0)`;
}

animate();

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ DEBUG hooks (v2) ============
window.__drive = {
  THREE, scene, camera, renderer, world, vehicle, chassisBody,
  scrolls, trophies, contactDecals, animatables, proximityTriggers, uWind, D,
  getState: () => ({
    gameStarted,
    inputLocked,
    introDiveActive,
    cameraFov: camera.fov,
    position: {
      x: chassisBody.position.x,
      y: chassisBody.position.y,
      z: chassisBody.position.z
    },
    counts: {
      projects: scrolls.length,
      awards: trophies.length,
      contacts: contactDecals.length,
      animatables: animatables.length,
      sceneChildren: scene.children.length,
      bodies: world.bodies.length
    }
  })
};

// audio v2 hooks (no-op for v1)
window.onCarSpeed = () => {};
window.onStelaHit = () => {};
window.onTrophy = () => {};
window.onCollision = () => {};

// click mute icon (v2 placeholder)
document.getElementById('muteIc').addEventListener('click', e => {
  e.currentTarget.textContent = e.currentTarget.textContent === '🔇' ? '🔊' : '🔇';
});

console.log('[drive.html] init complete. scene objects:', scene.children.length, 'physics bodies:', world.bodies.length);
