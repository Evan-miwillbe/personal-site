<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teng Meiming - Coastal Observatory - drive preview</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;700&family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="data.js"></script>
<style>
:root{
  --bg:#0a0a14;
  --ink:#2a2520;
  --ink-soft:#8a877e;
  --accent:#7F2020;
  --sage:#869B7E;
  --sage-deep:#5D7B5D;
  --tile:#524940;
  --slate:#4A6B7C;
  --cinnabar:#C0392B;
  --hud-bg:rgba(246,243,235,0.32);
  --hud-border:rgba(127,32,32,0.4);
  --hud-blur:blur(14px) saturate(1.1);
  --cinnabar-line:1px solid rgba(127,32,32,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#F6F3EB;font-family:'Inter','Noto Serif SC',-apple-system,BlinkMacSystemFont,sans-serif;cursor:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}

/* === cursor-ring (sourced from hello.html, scaled for drive scene) === */
.cursor-ring{position:fixed;top:0;left:0;width:42px;height:42px;margin:-21px 0 0 -21px;pointer-events:none;z-index:10000;will-change:transform;display:flex;align-items:center;justify-content:center;background:transparent;border:0;transform:translate3d(-100px,-100px,0);--ring-progress:0deg;filter:drop-shadow(0 2px 3px rgba(3,9,18,.72))}
.cursor-ring::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:#fff2cf;box-shadow:0 0 0 2px rgba(5,12,22,.9),0 0 10px rgba(255,216,142,.92);opacity:1;transition:opacity .18s,transform .22s}
.cursor-ring .circle{width:100%;height:100%;border-radius:50%;background:rgba(246,243,235,.12);border:2px solid rgba(255,242,207,.96);box-shadow:0 0 0 1px rgba(5,12,22,.72),0 0 15px rgba(255,207,119,.45),inset 0 0 10px rgba(246,243,235,.09);backdrop-filter:blur(4px) saturate(1.1);-webkit-backdrop-filter:blur(4px);transform:scale(.54);transition:transform .35s cubic-bezier(.55,.085,0,.99),background-color .25s,border-color .25s,box-shadow .25s,backdrop-filter .25s}
.cursor-ring.far .circle{transform:scale(.6);background:rgba(212,160,80,.14);border-color:rgba(255,225,169,.92);box-shadow:0 0 0 1px rgba(5,12,22,.68),0 0 18px rgba(255,195,96,.5)}
.cursor-ring.near .circle{transform:scale(.7);background:conic-gradient(from -90deg, rgba(255,204,111,.92) var(--ring-progress), rgba(255,232,190,.13) 0),rgba(200,160,80,.18);border-color:rgba(255,229,177,.98);box-shadow:0 0 0 1px rgba(5,12,22,.68),0 0 22px rgba(255,196,94,.58)}
.cursor-ring.trigger .circle{transform:scale(.82);background:rgba(255,212,128,.28);border-color:#fff0c8;box-shadow:0 0 0 1px rgba(5,12,22,.7),0 0 28px rgba(255,200,102,.72)}
.cursor-ring.hover .circle{transform:scale(1);background:rgba(127,32,32,.64);border-color:rgba(255,239,204,.98);box-shadow:0 0 0 1px rgba(5,12,22,.72),0 0 22px rgba(255,203,111,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cursor-ring.text .circle{transform:scale(1.2);background:rgba(127,32,32,0.32);border-color:rgba(127,32,32,0);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cursor-ring.text::after{opacity:0;transform:scale(.4)}
.cursor-ring .cr-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.3);font-family:'Noto Serif SC',serif;font-size:11px;font-weight:500;color:#F6F3EB;letter-spacing:.04em;white-space:nowrap;opacity:0;transition:opacity .22s .12s,transform .35s cubic-bezier(.55,.085,0,.99) .06s;pointer-events:none}
.cursor-ring.text .cr-label{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cursor-ring.text .cr-label.en{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.28em;font-weight:600}
.cursor-ring.click .circle{transform:scale(.6)}
@media (hover:none),(pointer:coarse){.cursor-ring{display:none}}

/* === HUD frames === */
.hud{position:fixed;background:var(--hud-bg);backdrop-filter:var(--hud-blur);-webkit-backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#F6F3EB;z-index:50;letter-spacing:0.04em;line-height:1.5}

/* === top-left brand === */
.brand{position:fixed;top:18px;left:24px;z-index:100;font-family:'Noto Serif SC',serif;font-size:14px;color:#F6F3EB;letter-spacing:0.08em;text-decoration:none;background:transparent}
.brand .sep{color:var(--accent);margin:0 0.5em}
.brand:hover{color:var(--accent)}

/* === top-right links === */
.toplinks{position:fixed;top:22px;right:24px;z-index:100;display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:lowercase;letter-spacing:0.06em}
.toplinks a{color:#c8c4b8;text-decoration:none;padding:2px 0;border-bottom:1px solid transparent;transition:color 0.2s,border-color 0.2s}
.toplinks a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.toplinks a.active{color:var(--accent);border-bottom:1px solid var(--accent)}
.toplinks .dot{color:var(--ink-soft);opacity:0.4;user-select:none}
@media (max-width:640px){
  .brand{top:14px;left:18px;font-size:13px}
  .toplinks{top:44px;left:18px;right:auto;gap:12px;font-size:10px}
}

/* === bottom-left status === */
.status{bottom:22px;left:24px;display:flex;flex-direction:column;gap:3px}
.status .row{display:flex;justify-content:space-between;gap:18px;min-width:170px}
.status .label{color:var(--ink-soft);opacity:0.72}
.status .val{color:#F6F3EB;font-weight:500}

/* === bottom-right helper === */
.helper{bottom:22px;right:24px;display:flex;gap:10px;align-items:center}
.helper .ic{width:28px;height:28px;border:var(--cinnabar-line);background:rgba(246,243,235,0.4);backdrop-filter:var(--hud-blur);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);cursor:none;border-radius:50%;font-family:'JetBrains Mono',monospace}
.helper .ic.breath{animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:0.7}50%{opacity:1}}

/* === navigation chart === */
.nav-map{position:fixed;left:24px;top:86px;width:230px;padding:11px 11px 9px;background:rgba(5,14,25,.76);border:1px solid rgba(255,226,166,.38);box-shadow:0 14px 36px rgba(0,0,0,.28),inset 0 0 28px rgba(95,166,186,.08);backdrop-filter:blur(12px) saturate(1.05);-webkit-backdrop-filter:blur(12px) saturate(1.05);z-index:120;pointer-events:auto;transition:transform .25s ease,border-color .25s ease}
.nav-map .map-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:rgba(246,243,235,.72)}
.nav-map .map-head b{font-weight:500;color:#ffd791}.nav-map canvas{display:block;width:208px;height:208px;cursor:pointer}.nav-map:hover{border-color:rgba(255,226,166,.62);transform:translateY(2px)}
.boundary-notice{position:fixed;left:50%;top:96px;transform:translate(-50%,-8px);padding:8px 14px;background:rgba(5,14,25,.8);border:1px solid rgba(255,215,145,.55);color:#ffe5b2;font:10px/1.4 'JetBrains Mono',monospace;letter-spacing:.14em;z-index:180;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}.boundary-notice.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.nav-map{left:12px;top:66px;width:164px;padding:7px}.nav-map canvas{width:148px;height:148px}.nav-map .map-head{font-size:8px;margin-bottom:4px}.boundary-notice{top:72px;max-width:82vw;text-align:center}}

/* === live world clock + expandable illustrated map === */
.world-clock{position:fixed;left:24px;top:332px;z-index:122;display:flex;align-items:center;gap:9px;padding:8px 10px;background:rgba(5,14,25,.72);border:1px solid rgba(255,226,166,.28);backdrop-filter:blur(10px);font:9px/1.3 'JetBrains Mono',monospace;letter-spacing:.12em;color:rgba(246,243,235,.78)}
.world-clock .orb{width:9px;height:9px;border-radius:50%;background:#ffd98a;box-shadow:0 0 12px rgba(255,190,90,.85)}
.world-clock.night .orb{background:#c8dcff;box-shadow:0 0 14px rgba(131,178,255,.92)}
.world-clock button{border:0;border-left:1px solid rgba(255,226,166,.28);padding-left:9px;background:transparent;color:#ffd791;font:inherit;letter-spacing:.08em;cursor:pointer}
.map-backdrop{position:fixed;inset:0;background:rgba(2,8,16,.66);backdrop-filter:blur(6px);z-index:114;opacity:0;pointer-events:none;transition:opacity .32s ease}
.map-backdrop.show{opacity:1;pointer-events:auto}
.nav-map .map-toggle{border:0;background:transparent;color:#ffd791;font:inherit;letter-spacing:.12em;cursor:pointer}
.nav-map.expanded{left:50%;top:50%;width:min(760px,86vw);padding:16px;transform:translate(-50%,-50%);z-index:130;border-color:rgba(255,226,166,.64);box-shadow:0 30px 100px rgba(0,0,0,.58),inset 0 0 54px rgba(95,166,186,.1)}
.nav-map.expanded:hover{transform:translate(-50%,-50%)}
.nav-map.expanded canvas{width:min(720px,calc(86vw - 32px));height:min(720px,calc(86vw - 32px),calc(82vh - 58px));margin:auto}
.nav-map.expanded .map-head{font-size:10px;margin-bottom:12px}
.nav-map.expanded .map-toggle::after{content:'收起地图'}
.nav-map:not(.expanded) .map-toggle::after{content:'展开'}
@media(max-width:720px){.world-clock{left:12px;top:238px;padding:6px 8px;font-size:7px}.nav-map.expanded{width:92vw;padding:10px}.nav-map.expanded canvas{width:calc(92vw - 20px);height:min(calc(92vw - 20px),72vh)}}

/* === 卷轴提示 (scroll hint) === */
.scrollHint{position:fixed;bottom:90px;right:24px;z-index:60;background:rgba(246,243,235,0.62);backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:12px 16px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:0.08em;min-width:160px;max-width:220px;line-height:1.7;opacity:0;transform:translateX(80px) scaleX(0.2);transform-origin:right center;transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1),transform 0.6s cubic-bezier(0.16,1,0.3,1)}
.scrollHint.show{opacity:1;transform:translateX(0) scaleX(1)}
.scrollHint.shake{animation:shake 0.45s ease}
.scrollHint .label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:4px}
.scrollHint .title{font-size:15px;font-weight:500;margin-bottom:6px;color:var(--ink)}
.scrollHint .sub{font-size:11px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* === 中央"疾驰"二字飞字 === */
.flytext{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);font-family:'Noto Serif SC',serif;font-weight:700;font-size:96px;color:#c8a050;letter-spacing:0.2em;pointer-events:none;z-index:200;opacity:0;text-shadow:0 0 24px rgba(200,160,80,0.35)}
.flytext.show{animation:flytext 0.9s cubic-bezier(0.16,1,0.3,1) forwards}
@keyframes flytext{0%{opacity:0;transform:translate(-50%,-50%) scale(0.7)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}}

/* === Dialog 抽屉 === */
.drawer{position:fixed;top:0;right:0;width:420px;max-width:90vw;height:100vh;background:rgba(246,243,235,0.94);backdrop-filter:blur(20px) saturate(1.15);border-left:2px solid var(--accent);padding:64px 36px 36px;font-family:'Noto Serif SC',serif;color:var(--ink);z-index:500;transform:translateX(110%);transition:transform 0.55s cubic-bezier(0.16,1,0.3,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(42,37,32,0.18)}
.drawer.show{transform:translateX(0)}
.drawer .close{position:absolute;top:20px;right:20px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--accent);cursor:none;border:var(--cinnabar-line);background:transparent;border-radius:50%}
.drawer .close:hover{background:rgba(127,32,32,0.12)}
.drawer .label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:8px}
.drawer h1{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:500;margin-bottom:6px;color:var(--ink);line-height:1.3}
.drawer h2{font-size:15px;color:var(--ink-soft);font-weight:400;margin-bottom:22px;font-family:'Inter',sans-serif;letter-spacing:0.02em}
.drawer .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:18px;letter-spacing:0.04em}
.drawer .divider{width:48px;height:2px;background:var(--accent);margin-bottom:22px}
.drawer .desc{font-size:14px;color:var(--ink);line-height:1.8;margin-bottom:26px}
.drawer .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.drawer .tag{font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 10px;border:1px solid rgba(127,32,32,0.32);color:var(--accent);letter-spacing:0.06em}
.drawer .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.drawer .actions a{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(127,32,32,0.06);border-left:2px solid var(--accent);color:var(--ink);text-decoration:none;font-family:'Noto Serif SC',serif;font-size:13px;transition:background 0.2s}
.drawer .actions a:hover{background:rgba(127,32,32,0.14)}
.drawer .actions a .arrow{font-family:'JetBrains Mono',monospace;color:var(--accent)}
.drawer.contact{padding-top:80px}
.drawer.contact .big{font-size:22px;font-family:'JetBrains Mono',monospace;color:var(--accent);margin-bottom:18px;word-break:break-all}
.drawer.award h1{font-size:24px}

/* === intro overlay === */
.intro{position:fixed;inset:0;background:radial-gradient(circle at 50% 58%,rgba(246,211,157,.1),rgba(8,18,30,.2) 48%,rgba(5,12,22,.34));backdrop-filter:blur(.7px) saturate(1.04);-webkit-backdrop-filter:blur(.7px) saturate(1.04);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Noto Serif SC',serif;transition:opacity .9s ease;color:#F6F3EB}.intro:before{content:'';position:absolute;width:min(520px,82vw);height:min(500px,72vh);border:1px solid rgba(246,243,235,.22);border-radius:46% 54% 42% 58%/55% 42% 58% 45%;box-shadow:0 0 70px rgba(103,196,205,.1),inset 0 0 42px rgba(255,255,255,.035);animation:floatFrame 6s ease-in-out infinite;pointer-events:none}.intro>*{position:relative;z-index:1}@keyframes floatFrame{50%{transform:translateY(-8px) rotate(1.5deg)}}
.intro.hide{opacity:0;pointer-events:none}
.intro .seal{width:84px;height:84px;background:#7F2020;color:#F6F3EB;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:600;letter-spacing:.12em;animation:sealAppear .6s ease-out}
.intro .seal-char{font-size:20px;line-height:1.12;text-align:center}
.intro .seal-en{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.18em;margin-top:5px;opacity:.72}
.intro h1{font-size:24px;font-weight:500;margin:22px 0 10px;color:#F6F3EB;letter-spacing:0.18em}
.intro .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a877e;letter-spacing:0.14em;margin-bottom:34px}
.intro .start{font-family:'Noto Serif SC',serif;font-size:15px;color:#fff;padding:12px 34px;border:1px solid #b95b4d;background:#7f2020;cursor:none;letter-spacing:0.12em;box-shadow:0 12px 30px rgba(90,20,20,.25);transition:background .2s,transform .2s,box-shadow .2s}
.intro .start:hover{background:#9b2f29;transform:translateY(-2px);box-shadow:0 16px 34px rgba(90,20,20,.32)}
.intro .controls{margin-top:30px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a877e;letter-spacing:0.08em;line-height:1.9;text-align:center}
.intro .controls .k{color:var(--accent);font-weight:500}
.intro.started .start{opacity:0;pointer-events:none}
.intro.started .seal{animation:sealPulse .45s ease-out}
@keyframes sealAppear{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sealPulse{0%{transform:scale(1)}45%{transform:scale(.88)}100%{transform:scale(1)}}

/* === proximity prompt (in-scene small toast) === */
.prompt{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:rgba(246,243,235,0.55);backdrop-filter:var(--hud-blur);border-left:var(--cinnabar-line);padding:8px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);letter-spacing:0.1em;z-index:80;opacity:0;transition:opacity 0.35s}
.prompt.show{opacity:1}
.prompt .k{font-family:'JetBrains Mono',monospace;color:var(--accent);padding:1px 6px;border:1px solid rgba(127,32,32,0.3);margin-right:6px;font-size:11px}

/* === flip notice (翻车自动复位提示) === */
.flipNotice{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:rgba(246,243,235,0.75);backdrop-filter:var(--hud-blur);border:1px solid rgba(127,32,32,0.5);border-left:3px solid var(--accent);padding:10px 18px;font-family:'Noto Serif SC',serif;font-size:14px;color:var(--accent);letter-spacing:0.12em;z-index:90;opacity:0;transition:opacity 0.3s}
.flipNotice.show{opacity:1}
@media (max-width:640px){
  .intro{padding:0 20px;text-align:center;overflow:hidden}
  .intro:before{top:50%;left:50%;width:calc(100vw - 36px);height:min(520px,68vh);transform:translate(-50%,-50%);animation:none}
  .intro h1{font-size:20px;letter-spacing:.11em;white-space:nowrap;margin:18px 0 8px}
  .intro .seal{width:76px;height:76px}
  .intro .sub{max-width:310px;font-size:8px;line-height:1.6;letter-spacing:.07em;margin-bottom:26px;white-space:normal}
  .intro .start{font-size:14px;padding:11px 30px}
  .intro .controls{font-size:0;max-width:310px;margin-top:22px}
  .intro .controls:after{content:'WASD 行车 · E 阅卷 · R 复位';font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(246,243,235,.74);letter-spacing:.05em}
  .status{bottom:16px;left:14px;transform:scale(.88);transform-origin:left bottom}
  .helper{bottom:16px;right:14px}
}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<a class="brand" href="index.html" data-cursor="返回">滕美名<span class="sep">·</span>边塞观星</a>

<nav class="toplinks">
  <a href="index.html" data-cursor="切换">home</a><span class="dot">·</span>
  <a href="notes.html" data-cursor="切换">notes</a><span class="dot">·</span>
  <a href="walk.html" data-cursor="切换">walk</a><span class="dot">·</span>
  <a href="drive.html" class="active" data-cursor="当前">drive</a>
</nav>

<div class="hud status">
  <div class="row"><span class="label">速度</span><span class="val" id="speedVal">0 km/h</span></div>
  <div class="row"><span class="label">位置</span><span class="val" id="posVal">x 0  z 0</span></div>
  <div class="row"><span class="label">模式</span><span class="val">第三人称</span></div>
</div>

<div class="helper">
  <div class="ic breath" id="muteIc" title="解锁声音" data-cursor="声音">🔇</div>
  <div class="ic" id="helpIc" title="帮助" data-cursor="帮助">?</div>
</div>

<div class="map-backdrop" id="mapBackdrop"></div>
<div class="nav-map" id="navMapPanel" aria-label="边塞导航图">
  <div class="map-head"><span>星槎舆图 · 点击地点前往</span><button class="map-toggle" id="mapToggle" aria-label="展开或收起地图"></button></div>
  <canvas id="navMap" width="416" height="416" aria-label="点击地图地标快速前往"></canvas>
</div>
<div class="world-clock" id="worldClock">
  <span class="orb"></span><span id="worldClockText">自动时间</span><button id="timeModeBtn" type="button">AUTO</button>
</div>
<div class="boundary-notice" id="boundaryNotice">已至边界 · 沿星灯折返</div>

<div class="scrollHint" id="hint">
  <div class="label">驾乘指引</div>
  <div class="title">W A S D 朝北开</div>
  <div class="sub">FIND ASTROLABE</div>
</div>

<div class="flytext" id="flyText">疾&nbsp;驰</div>

<div class="prompt" id="prompt"><span class="k">E</span><span id="promptText">阅卷</span></div>

<div class="flipNotice" id="flipNotice">翻车 · 即将自动复位</div>

<div class="drawer" id="drawer">
  <button class="close" id="closeDrawer">×</button>
  <div id="drawerBody"></div>
</div>

<div class="intro" id="intro">

function wrapText(ctx, text, maxW) {
  const words = String(text || '').split(/\s+/);
  const lines = [];
  let cur = '';
  for (const word of words) {
    if (ctx.measureText(word).width > maxW) {
      if (cur) { lines.push(cur); cur = ''; }
      for (const ch of word) {
        const test = cur + ch;
        if (ctx.measureText(test).width > maxW && cur.length > 0) {
          lines.push(cur);
          cur = ch;
        } else {
          cur = test;
        }
      }
      continue;
    }
    const test = cur ? cur + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && cur.length > 0) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function makeGroundTex() {
  const s = 4096;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const toPxX = x => ((x + 120) / 240) * s;
  const toPxZ = z => ((120 - z) / 240) * s;
  const worldW = meters => (meters / 240) * s;

  const grad = ctx.createLinearGradient(0, 0, 0, s);
  grad.addColorStop(0, hexColor(C.ground));
  grad.addColorStop(0.48, '#526a55');
  grad.addColorStop(1, '#354f49');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, s, s);

  for (let i = 0; i < 12000; i++) {
    const alpha = 0.03 + Math.random() * 0.09;
    const light = Math.random() < 0.55 ? 255 : 60;
    ctx.fillStyle = `rgba(${light},${light},${light},${alpha})`;
    ctx.fillRect(Math.random() * s, Math.random() * s, Math.random() * 5 + 1, Math.random() * 5 + 1);
  }

  // Roads are modeled as raised geometry now. Keeping this old painted path
  // caused the serrated "massage board" edge visible at the three-way junction.

  for (let i = 0; i < 2600; i++) {
    const x = toPxX((Math.random() - 0.5) * 160);
    const z = toPxZ((Math.random() - 0.5) * 160);
    ctx.fillStyle = `rgba(122,112,72,${Math.random() * 0.14})`;
    ctx.beginPath();
    ctx.ellipse(x, z, Math.random() * 6 + 1, Math.random() * 2 + 0.5, Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }

  const t = new THREE.CanvasTexture(c);
  return crispCanvasTexture(t);
}

function makeWallTex() {

    ctx.fillRect(Math.random()*s, Math.random()*s, 1, 1);

    g.addColorStop(1, 'rgba(120,100,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function addWallSegment(cx, cz, w, d, h, gateW = 0) {
  // h = wall height; gateW > 0 means leave a gate in the center
  const wallParts = [];
  if (gateW > 0) {
    const sideW = (w - gateW) / 2;
    if (sideW > 0.1) {
      wallParts.push([cx - (gateW/2 + sideW/2), cz, sideW, d, h]);
      wallParts.push([cx + (gateW/2 + sideW/2), cz, sideW, d, h]);
    }
    // 月洞门顶部横梁
    const lintelH = 1.2;
    wallParts.push([cx, cz, gateW, d, lintelH, h - lintelH]); // raised lintel
  } else {
    wallParts.push([cx, cz, w, d, h]);
  }
  for (const part of wallParts) {
    const [x, z, pw, pd, ph, py] = part;
    const yOff = py !== undefined ? py : 0;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(pw, ph, pd), wallMat);
    mesh.position.set(x, ph/2 + yOff, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    // 屋顶（黛瓦）
    const tileTop = new THREE.Mesh(new THREE.BoxGeometry(pw + 0.2, 0.15, pd + 0.2), tileMat);
    tileTop.position.set(x, ph + yOff + 0.075, z);
    tileTop.castShadow = true;
    scene.add(tileTop);
    // 物理刚体
    const body = new CANNON.Body({ mass: 0, material: groundMat });
    body.addShape(new CANNON.Box(new CANNON.Vec3(pw/2, ph/2, pd/2)));
    body.position.set(x, ph/2 + yOff, z);
    world.addBody(body);
  }
}

function makePlum(x, z) {
  const g = new THREE.Group();
  // 弯干 (4 节)
  let prev = new THREE.Vector3(0, 0, 0);
  const trunkMat = new THREE.MeshStandardMaterial({ color: C.woodDark, roughness: 0.85 });
  for (let i = 0; i < 4; i++) {
    const next = new THREE.Vector3(prev.x + (Math.random()-0.5)*0.3, prev.y + 0.5, prev.z + (Math.random()-0.5)*0.3);
    const mid = new THREE.Vector3().addVectors(prev, next).multiplyScalar(0.5);
    const len = prev.distanceTo(next);
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, len, 8), trunkMat);
    cyl.position.copy(mid);
    const dir = next.clone().sub(prev).normalize();
    cyl.lookAt(next);
    cyl.rotateX(Math.PI / 2);
    g.add(cyl);
    prev = next;
  }
  // 花簇 (红)
  const flowerMat = new THREE.MeshStandardMaterial({ color: C.plum, emissive: C.plum, emissiveIntensity: 0.04, roughness: 0.6 });
  for (let i = 0; i < 12; i++) {
    const flower = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), flowerMat);
    flower.position.set((Math.random()-0.5)*1.2, 1.4 + Math.random()*0.8, (Math.random()-0.5)*1.2);
    g.add(flower);
  }
  g.position.set(x, 0, z); scene.add(g);
}

function buildPond() {
  const g = new THREE.Group();
  const w = 30, d = 12;
  const alphaCanvas = document.createElement('canvas');
  alphaCanvas.width = 1024; alphaCanvas.height = 512;
  const actx = alphaCanvas.getContext('2d');
  actx.fillStyle = '#000000';
  actx.fillRect(0, 0, 1024, 512);
  actx.fillStyle = '#ffffff';
  actx.beginPath();
  actx.ellipse(512, 256, 480, 230, 0, 0, Math.PI * 2);
  actx.fill();
  const alphaTex = new THREE.CanvasTexture(alphaCanvas);

  const colorCanvas = document.createElement('canvas');
  colorCanvas.width = 1024; colorCanvas.height = 512;
  const cctx = colorCanvas.getContext('2d');
  const grad = cctx.createRadialGradient(512, 256, 0, 512, 256, 480);
  grad.addColorStop(0, hexColor(C.pondDeep));
  grad.addColorStop(0.7, hexColor(C.pondShallow));
  grad.addColorStop(1, '#C8D2C5');
  cctx.fillStyle = grad;
  cctx.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 200; i++) {
    cctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`;
    cctx.beginPath();
    cctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 8, 0, Math.PI * 2);
    cctx.fill();
  }
  const colorTex = new THREE.CanvasTexture(colorCanvas);
  colorTex.colorSpace = THREE.SRGBColorSpace;

  const water = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshStandardMaterial({
      map: colorTex,
      alphaMap: alphaTex,
      transparent: true,
      roughness: 0.4,
      metalness: 0.2,
      side: THREE.DoubleSide
    })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -0.05, 0);
  g.add(water);

  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(
      new THREE.CircleGeometry(0.45 + Math.random() * 0.15, 16),
      new THREE.MeshStandardMaterial({ color: C.bamboo, side: THREE.DoubleSide, roughness: 0.8 })
    );
    leaf.rotation.x = -Math.PI / 2;
    leaf.position.set((Math.random() - 0.5) * 20, 0.02, (Math.random() - 0.5) * 7);
    g.add(leaf);
  }

  const koi = [];
  for (let i = 0; i < 3; i++) {
    const fish = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 8, 6),
      new THREE.MeshStandardMaterial({ color: C.accent, emissive: C.accent, emissiveIntensity: 0.18, roughness: 0.45 })
    );
    fish.scale.set(1, 0.4, 0.6);
    fish.position.set((i - 1) * 6, 0.04, i % 2 === 0 ? -2 : 2);
    fish.userData = { baseX: fish.position.x, baseZ: fish.position.z, phase: i * 1.2 };
    g.add(fish);
    koi.push(fish);
  }
  g.userData.koi = koi;
  scene.add(g);
  pondGroup = g;
}

function buildArchBridge() {
  const g = new THREE.Group();
  const deckMat = new THREE.MeshStandardMaterial({ color: C.bridge, roughness: 0.88, flatShading: true });
  const visualSteps = 9;
  for (let i = 0; i < visualSteps; i++) {
    const t = (i / (visualSteps - 1)) * 2 - 1;
    const yArch = 1.25 * Math.cos(t * Math.PI / 2);
    const z = t * 7;
    const slab = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.28, 1.55), deckMat);
    slab.position.set(0, 0.5 + yArch, z);
    slab.castShadow = true;
    slab.receiveShadow = true;
    g.add(slab);
  }

  const railMat = new THREE.MeshStandardMaterial({ color: C.wallStone, roughness: 0.9 });
  for (const side of [-1, 1]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.16, 14.2), railMat);
    rail.position.set(side * 2.25, 2.0, 0);
    g.add(rail);
  }

  for (const side of [-1, 1]) {
    for (let i = 0; i < 6; i++) {
      const pillar = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 0.6, 0.25),
        new THREE.MeshStandardMaterial({ color: C.bridge, roughness: 0.88 })
      );
      pillar.position.set(side * 2, 1.8, -5 + i * 2);
      g.add(pillar);
    }
  }

  scene.add(g);

  const halfWidth = 2;
  const stepCount = 9;
  for (let i = 0; i < stepCount; i++) {
    const t = (i / (stepCount - 1)) * 2 - 1;
    const yArch = 1.25 * Math.cos(t * Math.PI / 2);
    const z = t * 7;
    const stepBody = new CANNON.Body({
      mass: 0,
      material: groundMat,
      shape: new CANNON.Box(new CANNON.Vec3(halfWidth, 0.24, 0.9))
    });
    stepBody.position.set(0, 0.55 + yArch, z);
    world.addBody(stepBody);
  }
}

// ============ (13) "格物致知" 立体字 (核心 wow point) ============
const wordChars = ['格', '物', '致', '知'];
const stereoChars = [];
function buildStereoWord() {
  const wordX = [-4.5, -1.5, 1.5, 4.5];
  for (let i = 0; i < 4; i++) {
    const tex     = makeBigChar(wordChars[i]);
    const texMirr = makeBigChar(wordChars[i], true);  // 预镜像版本，用于 -z 面
    // 用 6 个独立材质（BoxGeometry 6 面），正反面分别贴正/镜像贴图以保证从两侧都正向可读
    const matFront = new THREE.MeshStandardMaterial({ map: tex,     roughness: 0.5, metalness: 0.05 });
    const matBack  = new THREE.MeshStandardMaterial({ map: texMirr, roughness: 0.5, metalness: 0.05 });
    const matSide  = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.8 });
    // BoxGeometry 材质 index 顺序: [+x, -x, +y, -y, +z, -z]

    const mesh = new THREE.Mesh(

function makeWoodSignTex(text, sub, mirror = false) {
  const w = 512, h = 256;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor(C.woodDark);
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 36; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.08})`;
    ctx.fillRect(0, Math.random() * h, w, 1);
  }
  if (mirror) {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.strokeStyle = hexColor(C.accent);
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, w - 36, h - 36);
  ctx.fillStyle = hexColor(C.cream);
  ctx.font = 'bold 64px "Noto Serif SC","Songti SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 - 18);
  ctx.font = '28px "JetBrains Mono",monospace';
  ctx.fillText(sub, w / 2, h / 2 + 58);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function buildGuideArrow() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = hexColor(C.accent);
  ctx.beginPath();
  ctx.moveTo(256, 70);
  ctx.lineTo(370, 215);
  ctx.lineTo(305, 215);
  ctx.lineTo(305, 430);
  ctx.lineTo(207, 430);
  ctx.lineTo(207, 215);
  ctx.lineTo(142, 215);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const arrow = new THREE.Mesh(
    new THREE.PlaneGeometry(5.5, 5.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide })

function stdMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.86,
    metalness: opts.metalness ?? 0,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1,
    side: opts.side ?? THREE.FrontSide,
    flatShading: opts.flatShading ?? false
  });
}

function meshBox(w, h, d, color, opts = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), stdMat(color, opts));
  mesh.castShadow = opts.castShadow ?? true;
  mesh.receiveShadow = opts.receiveShadow ?? true;
  return mesh;
}

// Close the underside of a driveable ramp with a real triangular-prism mesh.
// The thin road slab remains responsible for wheel contact; this foundation
// makes the raised road read as terrain instead of a floating, hollow shell.
function addSolidRampFoundation(x, z, halfWidth, halfLength, rise, yaw = 0, color = 0x435044) {
  const topInset = 0.18;
  const lowY = -topInset;
  const highY = Math.max(lowY, rise - topInset);
  const vertices = new Float32Array([
    -halfWidth, 0, -halfLength,
     halfWidth, 0, -halfLength,
    -halfWidth, 0,  halfLength,
     halfWidth, 0,  halfLength,
    -halfWidth, highY, -halfLength,
     halfWidth, highY, -halfLength,
    -halfWidth, lowY,   halfLength,
     halfWidth, lowY,   halfLength
  ]);
  const indices = [
    0,2,1, 1,2,3,       // bottom
    4,6,5, 5,6,7,       // sloped top
    0,1,4, 1,5,4,       // high end
    2,6,3, 3,6,7,       // low end
    0,4,2, 2,4,6,       // left side
    1,3,5, 3,7,5        // right side
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const foundation = new THREE.Mesh(
    geometry,
    stdMat(color, { roughness: 0.99, flatShading: true })
  );
  foundation.position.set(x, 0, z);
  foundation.rotation.y = yaw;
  foundation.castShadow = true;
  foundation.receiveShadow = true;
  scene.add(foundation);

  // Do not give the foundation a second, almost-coplanar sloped top. Cannon
  // otherwise lets a wheel ray touch the road while the chassis touches that
  // obstacle face; at the side/seam the two contact normals can pin the car.
  // Stepped, recessed fill keeps the terrain physically solid while leaving
  // the thin groundMat ramp as the only driveable/contact surface.
  const physicsBottom = -0.35;
  const topClearance = 0.9;
  const slices = 6;
  const sliceLength = (halfLength * 2) / slices;
  for (let i = 0; i < slices; i++) {
    const localZ = -halfLength + (i + 0.5) * sliceLength;
    // Use the lower end of each slice, so no step can intersect the ramp.
    const lowerEdgeZ = localZ + sliceLength / 2;
    const roadYAtLowerEdge = rise * (halfLength - lowerEdgeZ) / (halfLength * 2);
    const topY = Math.max(physicsBottom + 0.08, roadYAtLowerEdge - topClearance);
    const halfHeight = (topY - physicsBottom) / 2;
    const body = new CANNON.Body({ mass: 0, material: obstacleMat });
    body.addShape(new CANNON.Box(new CANNON.Vec3(
      Math.max(0.1, halfWidth - 0.22),
      halfHeight,
      Math.max(0.1, sliceLength / 2 - 0.025)
    )));
    const local = new CANNON.Vec3(0, physicsBottom + halfHeight, localZ);
    if (yaw) {
      body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
      body.quaternion.vmult(local, local);
    }
    body.position.set(x + local.x, local.y, z + local.z);
    world.addBody(body);
  }
  return foundation;
}

const driveableSlopes = [];
const driveablePlateaus = [];

function addStaticBox(x, y, z, hx, hy, hz, yaw = 0, pitch = 0, material = obstacleMat) {
  const body = new CANNON.Body({ mass: 0, material });
  body.addShape(new CANNON.Box(new CANNON.Vec3(hx, hy, hz)));
  body.position.set(x, y, z);
  if (yaw || pitch) {
    const qx = new CANNON.Quaternion();
    const qy = new CANNON.Quaternion();
    qx.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), pitch);
    qy.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
    qy.mult(qx, body.quaternion);
  }
  world.addBody(body);
  return body;
}

// Driving surface model shared by rescue logic and the chase camera.
// The main ground is y=0; the north ramp rises from z=-30 to the y=6 plateau.
function getDriveSurfaceHeight(x, z) {
  let height = 0;
  if (Math.abs(x) <= 20 && z <= -23.5 && z >= -44.5) {
    height = Math.max(height, THREE.MathUtils.clamp((-z - 24) * 0.3, 0, 6));
  }
  if (Math.abs(x) <= 20 && z < -44.5 && z >= -59) height = Math.max(height, 6);
  for (const slope of driveableSlopes) {
    const dx=x-slope.x,dz=z-slope.z,c=Math.cos(slope.yaw),s=Math.sin(slope.yaw);
    const lx=dx*c-dz*s,lz=dx*s+dz*c;
    if(Math.abs(lx)<=slope.halfWidth && Math.abs(lz)<=slope.halfLength){
      height=Math.max(height,THREE.MathUtils.clamp((slope.halfLength-lz)/(slope.halfLength*2)*slope.rise,0,slope.rise));
    }
  }
  for (const p of driveablePlateaus) {
    if(Math.abs(x-p.x)<=p.halfWidth && Math.abs(z-p.z)<=p.halfLength) height=Math.max(height,p.height);
  }
  return height;
}

function makeLabelTexture(title, sub = '', mirror = false, opts = {}) {
  const w = opts.w || 512;
  const h = opts.h || 256;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor(opts.bg ?? C.woodDark);
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 42; i++) {
    ctx.fillStyle = `rgba(246,243,235,${Math.random() * 0.06})`;
    ctx.fillRect(0, Math.random() * h, w, 1);
  }
  ctx.strokeStyle = hexColor(opts.line ?? C.goldStrong);
  ctx.lineWidth = 5;
  ctx.strokeRect(18, 18, w - 36, h - 36);
  ctx.lineWidth = 1;
  ctx.strokeRect(30, 30, w - 60, h - 60);
  if (mirror) {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.fillStyle = hexColor(opts.fg ?? C.paper);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const main = String(title || '').trim();
  let fontSize = opts.mainSize || 46;
  do {
    ctx.font = `600 ${fontSize}px "Noto Serif SC","Songti SC",serif`;
    if (ctx.measureText(main).width < w - 88) break;
    fontSize -= 3;
  } while (fontSize > 18);
  ctx.fillText(main, w / 2, sub ? h / 2 - 22 : h / 2);
  if (sub) {
    ctx.fillStyle = hexColor(opts.subFg ?? C.starWarm);
    ctx.font = `${opts.subSize || 22}px "JetBrains Mono",monospace`;
    const subLines = wrapText(ctx, sub, w - 90).slice(0, 2);
    let y = h / 2 + 34;
    subLines.forEach(line => {
      ctx.fillText(line, w / 2, y);
      y += 26;
    });
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makePlaqueBox(width, height, depth, title, sub = '', opts = {}) {
  const front = new THREE.MeshStandardMaterial({ map: makeLabelTexture(title, sub, false, opts), roughness: 0.78 });
  const back = new THREE.MeshStandardMaterial({ map: makeLabelTexture(title, sub, true, opts), roughness: 0.78 });
  const side = stdMat(opts.sideColor ?? C.woodDark, { roughness: 0.82 });
  const geo = new THREE.BoxGeometry(width, height, depth);
  geo.clearGroups();
  geo.addGroup(0, 24, 0);
  geo.addGroup(24, 6, 1);
  geo.addGroup(30, 6, 2);
  const plaque = new THREE.Mesh(geo, [side, front, back]);
  plaque.castShadow = true;
  return plaque;
}

function buildSkyDome() {
  const geo = new THREE.SphereGeometry(180, 48, 24);
  const mat = new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,
    uniforms:{
      topColor:{value:new THREE.Color(0x071428)},
      midColor:{value:new THREE.Color(0x173a5b)},
      lowColor:{value:new THREE.Color(0xd18462)}
    },
    vertexShader:`varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`varying vec3 vPos;uniform vec3 topColor;uniform vec3 midColor;uniform vec3 lowColor;void main(){float h=clamp(vPos.y/180.0*.5+.5,0.0,1.0);vec3 c=mix(lowColor,midColor,smoothstep(.05,.48,h));c=mix(c,topColor,smoothstep(.48,.94,h));gl_FragColor=vec4(c,1.0);}`
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.renderOrder = -100;
  scene.add(sky);
  skyCycle.sky=sky;
  scene.background = null;
}

function buildStars() {
  const starGeo = new THREE.PlaneGeometry(0.42, 0.42);
  const starMat = new THREE.MeshBasicMaterial({
    color: C.starWhite,
    transparent: true,
    opacity: 0.88,
    fog: false,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const stars = new THREE.InstancedMesh(starGeo, starMat, 500);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 500; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 0.75 + 0.12);
    const r = 168;
    dummy.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
    const s = 0.45 + Math.random() * 1.7;
    dummy.scale.set(s, s, s);
    dummy.lookAt(0, 12, 0);
    dummy.updateMatrix();
    stars.setMatrixAt(i, dummy.matrix);
  }
  stars.renderOrder = -99;
  scene.add(stars);
  skyCycle.stars=stars;
}

function makeMountainLayer(z, h, color, alpha, offset) {
  const shape = new THREE.Shape();
  shape.moveTo(-170, 0);
  for (let i = 0; i <= 36; i++) {
    const x = -170 + i * (340 / 36);
    const t = i / 36;
    const ridge = h * (0.34 + 0.18 * Math.sin(t * 17 + offset) + 0.12 * Math.sin(t * 31 + offset * 0.7));
    shape.lineTo(x, ridge + h * 0.18);
  }
  shape.lineTo(170, -h * 0.32);
  shape.lineTo(-170, -h * 0.32);
  shape.lineTo(-170, 0);
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: alpha < 1, opacity: alpha, fog: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, h * 0.18, z);
  scene.add(mesh);
  return mesh;
}

function makePrayerFlag(seed = 0) {
  const colors = [C.prayerFlag1, C.prayerFlag2, C.prayerFlag3, C.prayerFlag4, C.prayerFlag5];
  const group = new THREE.Group();
  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(0.72, 0.42, 4, 1),

function buildAstrolabe() {
  const group = new THREE.Group();
  const stoneMat = stdMat(C.stone, { roughness: 0.92 });
  const woodMat = stdMat(C.woodLight, { roughness: 0.82 });
  const darkMat = stdMat(C.woodDark, { roughness: 0.84 });
  const goldMat = stdMat(C.goldRoof, { roughness: 0.62, metalness: 0.15, emissive: 0x3a2810, emissiveIntensity: 0.25 });

  const base = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 12), stoneMat);
  base.position.y = 2;
  group.add(base);

  const floor2 = new THREE.Mesh(new THREE.BoxGeometry(10, 3.5, 10), woodMat);
  floor2.position.y = 5.75;
  group.add(floor2);

  for (let dir = 0; dir < 4; dir++) {
    const win = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 1.35),
      new THREE.MeshBasicMaterial({ color: C.windowWarm, transparent: true, opacity: 0.72, fog: true })
    );
    const angle = dir * Math.PI / 2;
    win.position.set(Math.sin(angle) * 5.04, 5.75, Math.cos(angle) * 5.04);
    win.rotation.y = angle;
    win.userData.baseOpacity = 0.72;
    group.add(win);
    animatables.push({ mesh: win, type: 'window', uWind });
  }

  const floor3 = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 8), woodMat);
  floor3.position.y = 9;
  group.add(floor3);

  const eave3 = new THREE.Mesh(new THREE.ConeGeometry(7, 1.5, 4), darkMat);
  eave3.position.y = 11;
  eave3.rotation.y = Math.PI / 4;
  group.add(eave3);

  const floor4 = new THREE.Mesh(new THREE.BoxGeometry(6, 2.5, 6), woodMat);
  floor4.position.y = 13;
  group.add(floor4);

  const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 2.5, 4), goldMat);
  roof.position.y = 15.75;
  roof.rotation.y = Math.PI / 4;
  group.add(roof);

  const armillar = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.06, 8, 36), goldMat);
    ring.rotation.x = (i === 0) ? Math.PI / 2 : 0;
    ring.rotation.z = (i === 1) ? Math.PI / 2 : (i === 2 ? Math.PI / 4 : 0);
    armillar.add(ring);
  }
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 12),
    stdMat(C.goldStrong, { emissive: 0x6a4810, emissiveIntensity: 0.55, metalness: 0.2 })
  );
  armillar.add(core);
  armillar.position.y = 18.5;
  group.add(armillar);
  animatables.push({ mesh: armillar, type: 'armillar', uWind });

  for (let i = 0; i < 4; i++) {
    const angle = i * Math.PI / 2 + Math.PI / 4;
    const flag = makePrayerFlag(0.31 + i * 0.17);
    flag.position.set(Math.sin(angle) * 3.5, 17, Math.cos(angle) * 3.5);
    group.add(flag);
  }

  group.position.set(0, 0, -55);
  scene.add(group);
  addStaticBox(0, 8.8, -55, 6.2, 8.8, 6.2);
  return group;
}

function buildAwardHill() {
  const angle = Math.atan2(6, 20);
  const rampLen = Math.sqrt(6 * 6 + 20 * 20);
  addSolidRampFoundation(0, -34, 18, 10, 6, 0, C.mountainFront);
  const ramp = new THREE.Mesh(new THREE.BoxGeometry(36, 0.26, rampLen), stdMat(C.groundPath, { roughness: 0.96, flatShading: true }));
  ramp.position.set(0, 3, -34);
  ramp.rotation.x = angle;
  ramp.receiveShadow = true;
  scene.add(ramp);
  addStaticBox(0, 3, -34, 18, 0.13, rampLen / 2, 0, angle, groundMat);

  const plateauMass = new THREE.Mesh(new THREE.BoxGeometry(38, 5.9, 15), stdMat(C.mountainFront, { roughness: 0.99, flatShading: true }));
  plateauMass.position.set(0, 2.95, -51.5);
  plateauMass.castShadow = true;
  plateauMass.receiveShadow = true;
  scene.add(plateauMass);
  // Recess the solid mass below and behind the ramp seam. The top slab alone
  // carries the wheels, avoiding an obstacle/ground double contact at z=-44.
  addStaticBox(0, 2.55, -51.75, 18.75, 2.55, 7.15, 0, 0, obstacleMat);
  const plateau = new THREE.Mesh(new THREE.BoxGeometry(38, 0.26, 15), stdMat(C.groundPath, { roughness: 0.95, flatShading: true }));
  plateau.position.set(0, 5.9, -51.5);
  plateau.receiveShadow = true;
  scene.add(plateau);
  addStaticBox(0, 5.9, -51.5, 19, 0.13, 7.5, 0, 0, groundMat);

  const rockGeo = new THREE.DodecahedronGeometry(0.5, 0);
  const rockMat = stdMat(C.stoneDark, { roughness: 0.94, flatShading: true });
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, 18);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 18; i++) {
    dummy.position.set((Math.random() - 0.5) * 34, 6.05, -46 - Math.random() * 11);
    const s = 0.6 + Math.random() * 0.9;
    dummy.scale.set(s, 0.45 + Math.random() * 0.5, s);
    dummy.rotation.set(Math.random(), Math.random(), Math.random());
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  }
  scene.add(rocks);
}

function makeMiniArmillary(scale = 1) {

}

function buildProjectShrine(projectData, position, style, yaw = 0) {
  const group = new THREE.Group();
  const base = meshBox(7.2, 0.42, 6.2, C.stone, { roughness: 0.95 });
  base.position.y = 0.21;
  group.add(base);

  if (style === 'astronomy') {
    for (const x of [-2.5, 2.5]) {
      for (const z of [-1.9, 1.9]) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 2.8, 8), stdMat(C.woodLight));
        col.position.set(x, 1.62, z);
        group.add(col);
      }
    }
    const roof = new THREE.Mesh(new THREE.ConeGeometry(4.2, 1.1, 4), stdMat(C.goldRoof, { emissive: 0x251a08, emissiveIntensity: 0.1 }));
    roof.position.y = 3.25;
    roof.rotation.y = Math.PI / 4;
    group.add(roof);
    const arm = makeMiniArmillary(0.9);
    arm.position.set(0, 1.36, 0);
    group.add(arm);
  } else if (style === 'medicine') {
    const roof = new THREE.Mesh(new THREE.ConeGeometry(4.4, 0.9, 4), stdMat(C.woodDark));
    roof.position.y = 3.1;
    roof.rotation.y = Math.PI / 4;
    group.add(roof);
    for (const x of [-2.2, 2.2]) {
      for (const z of [-1.8, 1.8]) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 2.5, 8), stdMat(C.woodLight));
        col.position.set(x, 1.5, z);
        group.add(col);

function updateWindAnimation(time) {
  uWind.direction.x = Math.cos(time * 0.0003) * 0.7 + 0.3;
  uWind.direction.y = Math.sin(time * 0.0004) * 0.5 + 0.3;
  uWind.direction.normalize();
  uWindDirection.copy(uWind.direction);
  uWind.strength = 0.8 + Math.sin(time * 0.0008) * 0.3;

  animatables.forEach(a => {
    if (a.type === 'prayer') {
      const phase = a.mesh.userData.windPhase || 0;
      const t = time * 0.001 + phase;
      a.mesh.rotation.z = Math.sin(t * 2) * 0.25 * uWind.strength;
      a.mesh.position.y = a.mesh.userData.basePos.y + Math.sin(t * 3) * 0.08 * uWind.strength;
    } else if (a.type === 'pine') {
      a.mesh.rotation.x = Math.sin(time * 0.0008 + a.mesh.position.x) * 0.035 * uWind.strength;
      a.mesh.rotation.z = Math.sin(time * 0.0007 + a.mesh.position.z) * 0.025 * uWind.strength;
    } else if (a.type === 'grass') {
      a.mesh.rotation.x = Math.sin(time * 0.0012 + a.mesh.position.x) * 0.12 * uWind.strength;
    } else if (a.type === 'flagField') {
      a.mesh.rotation.z = Math.sin(time * 0.0018 + (a.mesh.userData.windPhase || 0)) * 0.035 * uWind.strength;
    } else if (a.type === 'armillar') {
      a.mesh.rotation.y = time * 0.00022;
      a.mesh.rotation.x = Math.sin(time * 0.00017) * 0.28;
    } else if (a.type === 'window') {
      a.mesh.material.opacity = 0.62 + Math.sin(time * 0.001 + a.mesh.position.x) * 0.14;
    } else if (a.type === 'coastWater') {
      a.mesh.material.map.offset.x = time * 0.000018 + a.phase;
      a.mesh.material.map.offset.y = time * 0.000011;
    } else if (a.type === 'beacon') {
      a.mesh.material.emissiveIntensity = 1.05 + Math.sin(time*.0025)*.35;
    } else if (a.type === 'routeRing') {
      const s = 1 + Math.sin(time*.0018 + a.phase)*.08; a.mesh.scale.setScalar(s); a.mesh.material.opacity=.48+Math.sin(time*.0018+a.phase)*.24;
    } else if (a.type === 'buoy') {
      a.mesh.position.y = -.12 + Math.sin(time*.0012 + (a.phase||0))*.14;
      a.mesh.rotation.z = Math.sin(time*.0009 + (a.phase||0))*.035;
    }
  });
}


function makeWaveTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#083251'; ctx.fillRect(0,0,512,512);
  ctx.fillStyle = '#0c5268';
  for(let y=0;y<512;y+=64)for(let x=0;x<512;x+=64){
    if(((x+y)/64)%2===0)ctx.fillRect(x,y,64,64);
  }
  ctx.strokeStyle = 'rgba(166,215,225,.28)'; ctx.lineWidth = 4;
  for(let y=28;y<512;y+=46){
    ctx.beginPath();
    for(let x=0;x<=512;x+=16){ const yy=y+Math.sin(x*.035+y*.018)*5; x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy); }
    ctx.stroke();
  }
  return crispCanvasTexture(new THREE.CanvasTexture(c), 8, 8);
}

function autoNightBlend(date=new Date()){
  const h=date.getHours()+date.getMinutes()/60;
  if(h>=19||h<5.5)return 1;
  if(h<7)return 1-(h-5.5)/1.5;
  if(h<17)return 0;
  return (h-17)/2;
}
function refreshClockTarget(force=false){
  const now=new Date(),minute=now.getHours()*60+now.getMinutes();
  if(!force&&skyCycle.lastMinute===minute)return;
  skyCycle.lastMinute=minute;
  skyCycle.targetBlend=skyCycle.mode==='day'?0:skyCycle.mode==='night'?1:autoNightBlend(now);
  const phase=skyCycle.targetBlend>.72?'夜晚':skyCycle.targetBlend>.18?'暮光':'白天';
  const text=document.getElementById('worldClockText');
  if(text)text.textContent=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} · ${phase}`;
  const panel=document.getElementById('worldClock');if(panel)panel.classList.toggle('night',skyCycle.targetBlend>.45);
  const btn=document.getElementById('timeModeBtn');if(btn)btn.textContent=skyCycle.mode.toUpperCase();
}
function updateDayNight(dt){
  refreshClockTarget();
  skyCycle.blend=THREE.MathUtils.lerp(skyCycle.blend,skyCycle.targetBlend,1-Math.exp(-dt*1.65));
  const n=skyCycle.blend,t=1-n;
  const mix=(day,night)=>new THREE.Color(day).lerp(new THREE.Color(night),n);
  if(skyCycle.sky){
    skyCycle.sky.material.uniforms.topColor.value.copy(mix(0x6f9fca,0x061329));
    skyCycle.sky.material.uniforms.midColor.value.copy(mix(0xb7d6df,0x173754));
    skyCycle.sky.material.uniforms.lowColor.value.copy(mix(0xffd5a2,0x8a4d5f));
  }
  if(skyCycle.stars)skyCycle.stars.material.opacity=THREE.MathUtils.smoothstep(n,.12,.86)*.92;
  if(skyCycle.moon){skyCycle.moon.material.opacity=THREE.MathUtils.smoothstep(n,.28,.9);skyCycle.moon.material.transparent=true;}
  if(skyCycle.moonGlow)skyCycle.moonGlow.material.opacity=THREE.MathUtils.smoothstep(n,.28,.9)*.18;
  if(skyCycle.sunDisc)skyCycle.sunDisc.material.opacity=THREE.MathUtils.smoothstep(t,.18,.78)*.92;
  const now=new Date(),dayP=THREE.MathUtils.clamp((now.getHours()+now.getMinutes()/60-6)/12,0,1),ang=dayP*Math.PI;
  sun.position.set(Math.cos(ang)*76,22+Math.sin(ang)*68,Math.sin(ang*.8)*44-10);
  sun.intensity=THREE.MathUtils.lerp(3.1,.48,n);sun.color.copy(mix(0xffedcf,0x88aaff));
  fillLight.intensity=THREE.MathUtils.lerp(.72,.18,n);hemi.intensity=THREE.MathUtils.lerp(1.45,.72,n);
  hemi.color.copy(mix(0xbce5ff,0x728fc1));hemi.groundColor.copy(mix(0x6d7655,0x171829));
  scene.fog.color.copy(mix(0x9ab8c0,0x102538));scene.fog.near=THREE.MathUtils.lerp(105,72,n);scene.fog.far=THREE.MathUtils.lerp(310,245,n);
  renderer.toneMappingExposure=THREE.MathUtils.lerp(1.22,1.42,n);
  groundMatGl.color.copy(mix(0xffffff,0x84909b));
  for(const c of cycleMaterials)c.material.color.copy(c.day.clone().lerp(c.night,n));
  for(const p of practicalLights)p.light.intensity=THREE.MathUtils.lerp(p.day,p.night,n);
  for(const p of practicalGlowMaterials)p.material.opacity=THREE.MathUtils.lerp(p.day,p.night,n);
}

function buildFrontierBoundary(){
  const limit = 137;
  const stoneMat = stdMat(0x3d4650, { roughness: .92 });
  const railMat = stdMat(0x6d4a34, { roughness: .84 });
  const lampMat = new THREE.MeshStandardMaterial({ color:0xffd08a, emissive:0xffa43e, emissiveIntensity:1.35, roughness:.4 });
  const posts=[];
  const addPost = (x,z,lit=false) => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(.62,1.35,.62), stoneMat);
    post.position.set(x,.675,z); post.rotation.y=Math.atan2(x,z); post.castShadow=true; post.receiveShadow=true; scene.add(post); posts.push(post);
    if(lit){
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),lampMat);
      lamp.position.set(x,1.55,z); scene.add(lamp);
    }
  };
  const count=52;
  for(let i=0;i<count;i++){
    const a=i/count*Math.PI*2;
    addPost(Math.sin(a)*limit,Math.cos(a)*limit,i%4===0);
  }
  for(let i=0;i<count;i++){
    const a0=i/count*Math.PI*2, a1=(i+1)/count*Math.PI*2;
    const x0=Math.sin(a0)*limit,z0=Math.cos(a0)*limit,x1=Math.sin(a1)*limit,z1=Math.cos(a1)*limit;
    const rail=meshBox(.26,.25,Math.hypot(x1-x0,z1-z0)-.55,0x6d4a34); rail.material=railMat;
    rail.position.set((x0+x1)/2,1.08,(z0+z1)/2); rail.rotation.y=Math.atan2(x1-x0,z1-z0); scene.add(rail);
  }
  // The circular fence suggests a shoreline path; the driving loop applies a soft radial limit.
}

function installChassisCollisionFeedback(){
  chassisBody.addEventListener('collide', e => {
    const other=e.body;
    if(!other||other.material!==obstacleMat)return;
    const now=performance.now();
    if(now-lastObstacleHitAt<160)return;
    lastObstacleHitAt=now;
    const impact=e.contact?.getImpactVelocityAlongNormal?.() ?? chassisBody.velocity.length();
    const away=new CANNON.Vec3(
      chassisBody.position.x-other.position.x,
      0,
      chassisBody.position.z-other.position.z
    );
    if(away.lengthSquared()<.0001){
      const fwd=new CANNON.Vec3(0,0,-1);chassisBody.quaternion.vmult(fwd,fwd);
      away.set(-fwd.x,0,-fwd.z);
    }
    away.normalize();
    const strength=THREE.MathUtils.clamp(impact*.18,.7,4.2);
    chassisBody.velocity.x+=away.x*strength;
    chassisBody.velocity.z+=away.z*strength;
    chassisBody.velocity.y=Math.min(chassisBody.velocity.y+.55+strength*.08,3.2);
    chassisBody.angularVelocity.x+=away.z*strength*.18;
    chassisBody.angularVelocity.z-=away.x*strength*.18;
    const notice=document.getElementById('boundaryNotice');
    if(notice&&impact>1.2){
      notice.textContent='撞击 · 反作用';
      notice.classList.add('show');
      window._boundaryNoticeUntil=now+700;
    }
  });
}

function meadowSpotAllowed(x,z){
  const r=Math.hypot(x,z); if(r<17||r>126) return false;
  if(Math.abs(x)<7 && z>-70 && z<68) return false;
  if(getDriveSurfaceHeight(x,z)>.2) return false;
  const blocks=[[-28,25,9],[28,25,9],[-30,0,9],[30,0,9],[0,-25,9],[0,-52,22],[63,10,12],[64,62,7],[-66,-58,7],[-88,-6,10],[78,48,10],[-92,76,9],[-68,67,14],[83,-74,16],[38,78,13]];
  return !blocks.some(([bx,bz,br])=>(x-bx)*(x-bx)+(z-bz)*(z-bz)<br*br);
}

function makeGrassTuftGeometry(){
  const vertices=[];
  for(let i=0;i<5;i++){
    const a=i/5*Math.PI*2,px=Math.cos(a)*.055,pz=Math.sin(a)*.055;
    const sx=-Math.sin(a)*.075,sz=Math.cos(a)*.075;
    vertices.push(px+sx,0,pz+sz, px-sx,0,pz-sz, px+Math.cos(a)*.13,.72,pz+Math.sin(a)*.13);
  }
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geo.computeVertexNormals();return geo;
}

const meadowClusters=[
  {x:-54,z:54,rx:24,rz:16},{x:55,z:48,rx:22,rz:18},{x:-76,z:-48,rx:26,rz:18},
  {x:82,z:24,rx:20,rz:26},{x:-42,z:-18,rx:18,rz:14},{x:43,z:-63,rx:24,rz:16},
  {x:-98,z:66,rx:16,rz:22},{x:96,z:-72,rx:20,rz:18},{x:12,z:86,rx:28,rz:12}
];
function sampleMeadowCluster(rnd,flower=false){
  for(let tries=0;tries<100;tries++){
    const c=meadowClusters[Math.floor(rnd()*meadowClusters.length)];
    const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*(flower?.72:1);
    const x=c.x+Math.cos(a)*c.rx*r,z=c.z+Math.sin(a)*c.rz*r;
    if(meadowSpotAllowed(x,z))return {x,z};
  }
  return {x:34+(rnd()-.5)*15,z:75+(rnd()-.5)*12};
}

function buildInteractiveMeadow(){
  // Interaction language inspired by Bruno Simon's MIT folio grass, flowers and
  // explosive crates, reimplemented here for the lightweight Three.js scene.
  // https://github.com/brunosimon/folio-2025
  let seed=9417; const rnd=()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296);
  const mobile=window.matchMedia('(max-width:720px)').matches;
  const grassCount=mobile?520:1240,flowerCount=mobile?64:148;
  const grassGeo=makeGrassTuftGeometry();
  const grassMat=new THREE.MeshStandardMaterial({color:0xc2cf9f,roughness:.98,flatShading:true,side:THREE.DoubleSide,vertexColors:true,emissive:0x24351f,emissiveIntensity:.52});
  const grass=new THREE.InstancedMesh(grassGeo,grassMat,grassCount); grass.instanceMatrix.setUsage(THREE.DynamicDrawUsage); grass.receiveShadow=true;
  for(let i=0;i<grassCount;i++){
    const spot=sampleMeadowCluster(rnd,false),x=spot.x,z=spot.z;
    const scale=.55+rnd()*1.25,rot=rnd()*Math.PI*2,phase=rnd()*Math.PI*2;
    interactiveMeadow.grassRecords.push({x,z,scale,rot,phase,state:1,target:1,regrowAt:0});
    grass.setColorAt(i,new THREE.Color().setHSL(.19+rnd()*.06,.32+rnd()*.16,.48+rnd()*.16));
  }
  if(grass.instanceColor)grass.instanceColor.needsUpdate=true;
  interactiveMeadow.grass=grass; scene.add(grass);

  const stems=new THREE.InstancedMesh(new THREE.CylinderGeometry(.025,.035,.54,5),stdMat(0x5c7f52,{roughness:.95}),flowerCount);
  const heads=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.23,0),new THREE.MeshStandardMaterial({roughness:.8,vertexColors:true,emissive:0x2a2018,emissiveIntensity:.3}),flowerCount);
  stems.instanceMatrix.setUsage(THREE.DynamicDrawUsage); heads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  for(let i=0;i<flowerCount;i++){
    const spot=sampleMeadowCluster(rnd,true),x=spot.x,z=spot.z;
    interactiveMeadow.flowerRecords.push({x,z,phase:rnd()*Math.PI*2,state:1,target:1,regrowAt:0});
    heads.setColorAt(i,new THREE.Color([0xe9c46a,0xd98b98,0xb7a6d8,0xf0e4c5][i%4]));
  }
  if(heads.instanceColor)heads.instanceColor.needsUpdate=true;
  interactiveMeadow.stems=stems;interactiveMeadow.heads=heads;scene.add(stems,heads);
  updateInteractiveMeadow(0,0,true);
}

function updateInteractiveMeadow(dt,time,force=false){
  if(!interactiveMeadow.grass)return;
  if(!force&&time-interactiveMeadow.lastUpdate<66)return;
  dt=force?0:Math.min((time-interactiveMeadow.lastUpdate)/1000,.12);interactiveMeadow.lastUpdate=time;
  const cp=chassisBody?chassisBody.position:null,d=interactiveMeadow.dummy,now=performance.now();
  let dirty=force;
  interactiveMeadow.grassRecords.forEach((g,i)=>{
    if(cp&&((cp.x-g.x)**2+(cp.z-g.z)**2)<2.5){g.target=.025;g.regrowAt=now+9000;}
    else if(g.target<1&&now>g.regrowAt)g.target=1;
    const before=g.state;g.state=THREE.MathUtils.lerp(g.state,g.target,Math.min(1,dt*(g.target<1?15:1.4)));if(Math.abs(before-g.state)>.001)dirty=true;
    const sway=Math.sin(time*.0016+g.phase)*.12*g.state;
    d.position.set(g.x,.36*g.scale*g.state,g.z);d.scale.set(g.scale,g.scale*g.state,g.scale);d.rotation.set(sway,g.rot,sway*.35);d.updateMatrix();interactiveMeadow.grass.setMatrixAt(i,d.matrix);
  });
  interactiveMeadow.flowerRecords.forEach((f,i)=>{
    if(cp&&((cp.x-f.x)**2+(cp.z-f.z)**2)<2.2){f.target=.02;f.regrowAt=now+11000;}
    else if(f.target<1&&now>f.regrowAt)f.target=1;
    f.state=THREE.MathUtils.lerp(f.state,f.target,Math.min(1,dt*(f.target<1?14:1.1)));
    const sway=Math.sin(time*.0014+f.phase)*.15*f.state;
    d.position.set(f.x,.27*f.state,f.z);d.scale.set(1,f.state,1);d.rotation.set(sway,0,sway*.5);d.updateMatrix();interactiveMeadow.stems.setMatrixAt(i,d.matrix);
    d.position.set(f.x+Math.sin(sway)*.16,.56*f.state,f.z);d.scale.setScalar(f.state);d.rotation.set(0,f.phase,0);d.updateMatrix();interactiveMeadow.heads.setMatrixAt(i,d.matrix);
  });
  interactiveMeadow.grass.instanceMatrix.needsUpdate=true;interactiveMeadow.stems.instanceMatrix.needsUpdate=true;interactiveMeadow.heads.instanceMatrix.needsUpdate=true;
}

function triggerControlledExplosion(crate){
  crate.state='cooldown';crate.group.visible=false;crate.respawnAt=performance.now()+14000;
  const group=new THREE.Group();group.position.set(crate.x,.45,crate.z);scene.add(group);
  const core=new THREE.Mesh(new THREE.SphereGeometry(.8,14,10),new THREE.MeshBasicMaterial({color:0xffd174,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending}));group.add(core);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.11,8,40),new THREE.MeshBasicMaterial({color:0xff7a2f,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));ring.rotation.x=Math.PI/2;group.add(ring);
  explosionFx.push({group,core,ring,life:1});
  if(chassisBody){
    const dx=chassisBody.position.x-crate.x,dz=chassisBody.position.z-crate.z,len=Math.max(1,Math.hypot(dx,dz));
    chassisBody.velocity.x+=dx/len*1.5;chassisBody.velocity.z+=dz/len*1.5;chassisBody.velocity.y=Math.min(chassisBody.velocity.y+1.4,3.2);chassisBody.angularVelocity.scale(.45,chassisBody.angularVelocity);
  }
  const notice=document.getElementById('boundaryNotice');notice.textContent='星火箱触发 · 轻推反馈';notice.classList.add('show');window._boundaryNoticeUntil=performance.now()+1000;
}

function updateExplosiveCrates(dt,time){
  if(!chassisBody)return;const now=performance.now(),cp=chassisBody.position,speed=Math.hypot(chassisBody.velocity.x,chassisBody.velocity.z);
  for(const c of explosiveCrates){
    if(c.state==='cooldown'){if(now>c.respawnAt){c.state='ready';c.group.visible=true;}continue;}
    c.fuse.material.emissiveIntensity=1.25+Math.sin(time*.008+c.phase)*.65;c.ring.rotation.z+=dt*.5;
    const dist=Math.hypot(cp.x-c.x,cp.z-c.z);
    if(c.state==='ready'&&dist<1.75&&speed>.8){c.state='fuse';c.triggerAt=now+520;}
    if(c.state==='fuse'){const pulse=1+Math.sin(time*.04)*.22;c.group.scale.setScalar(pulse);if(now>c.triggerAt)triggerControlledExplosion(c);}
    else c.group.scale.lerp(new THREE.Vector3(1,1,1),.14);
  }
  for(let i=explosionFx.length-1;i>=0;i--){const fx=explosionFx[i];fx.life-=dt*1.35;const p=1-fx.life;fx.core.scale.setScalar(1+p*5);fx.ring.scale.setScalar(1+p*7);fx.core.material.opacity=Math.max(0,fx.life*.8);fx.ring.material.opacity=Math.max(0,fx.life*.7);fx.group.position.y+=dt*.7;if(fx.life<=0){scene.remove(fx.group);explosionFx.splice(i,1);}}
}

    const gltf = await loader.loadAsync('assets/vendor/bruno-simon/folio-2025-default-vehicle.glb');
    const root = gltf.scene;
    const findPart = prefix => {
      let match = null;
      root.traverse(child => {
        if (!match && child.name && child.name.toLowerCase().startsWith(prefix.toLowerCase())) match = child;
      });
      return match;
    };
    const chassis = findPart('chassis');
    const wheelSource = findPart('wheelContainer');
    const stopLights = findPart('stopLights');
    const backLights = findPart('backLights');
    if (!chassis || !wheelSource) throw new Error('Vehicle GLB is missing chassis or wheelContainer');

    chassis.removeFromParent();
    chassis.position.set(0, 0, 0);
    chassis.rotation.set(0, 0, 0);
    chassis.traverse(child => {
      if (!child.isMesh) return;
      child.castShadow = true;
      child.receiveShadow = true;
      if (child.material) child.material.envMapIntensity = 0.75;
    });

    carGroup.clear();
    brakeLightMeshes.length = 0;
    const chassisAdapter = new THREE.Group();
    chassisAdapter.rotation.y = Math.PI / 2; // Original vehicle faces +X; this scene drives toward -Z.
    chassisAdapter.scale.setScalar(0.78);
    chassisAdapter.position.y = -0.03;
    chassisAdapter.add(chassis);
    carGroup.add(chassisAdapter);
    brunoChassisAdapter = chassisAdapter;

    for (const x of [-0.38, 0.38]) {
      const target = new THREE.Object3D();
      target.position.set(x, -0.05, -13);
      carGroup.add(target);
      const headlight = new THREE.SpotLight(0xffe2aa, 34, 24, 0.38, 0.62, 1.35);
      headlight.position.set(x, 0.28, -0.92);
      headlight.target = target;
      carGroup.add(headlight);
    }

    if (stopLights) { stopLights.visible = true; brakeLightMeshes.push(stopLights); }
    if (backLights) backLights.visible = true;

    for (const oldWheel of wheelMeshes) oldWheel.removeFromParent();
    wheelMeshes.length = 0;
    brunoWheelVisuals.length = 0;
    for (let i = 0; i < 4; i++) {
      const wheelClone = wheelSource.clone(true);
      wheelClone.position.set(0, 0, 0);
      wheelClone.rotation.set(0, 0, 0);
      let cylinder = null;
      let suspension = null;
      wheelClone.traverse(child => {
        if (child.name && child.name.toLowerCase().startsWith('wheelcylinder')) cylinder = child;
        if (child.name && child.name.toLowerCase().startsWith('wheelsuspension')) suspension = child;
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
      });
      if (!cylinder) throw new Error('Vehicle GLB wheelContainer is missing wheelCylinder');
      cylinder.position.set(0,0,0);
      // Match the source implementation: suspension and wheel guard stay attached
      // to the chassis; only wheelCylinder rolls. Rotating the whole container is
      // what made the suspension bars point forward like extra rollers.
      const sideFlip = i === 0 || i === 2;
      wheelClone.rotation.y = sideFlip ? Math.PI : 0;
      chassisAdapter.add(wheelClone);
      brunoWheelVisuals.push({ container:wheelClone, cylinder, suspension, sideFlip });
    }
  } catch (error) {
    console.warn('Bruno Simon vehicle visual could not be loaded; keeping local rover fallback.', error);
  }
}

// 撞前方挡墙时自动腾起 (用户冲坡 = 自动起飞, 不用按 Space)
let lastBoostTime = 0;
// Disabled: climbing must come from wheel contact with the ramp, not a collision jump.
if (false) chassisBody.addEventListener('collide', (e) => {
  if (performance.now() - lastBoostTime < 600) return;  // 600ms 防抖
  const speed = Math.hypot(chassisBody.velocity.x, chassisBody.velocity.z);
  if (speed < 6) return;  // 高速撞才触发
  if (chassisBody.position.y > 1.5) return;  // 在空中不再连发
  // 检测撞击是否来自车前方 (normal 与车头方向有较大对齐)
  const fwd = new CANNON.Vec3(0, 0, -1);
  chassisBody.quaternion.vmult(fwd, fwd);
  const n = e.contact.ni;
  const dot = n.x * fwd.x + n.z * fwd.z;
  if (Math.abs(dot) > 0.5) {
    chassisBody.velocity.y = 9;  // 起飞
    lastBoostTime = performance.now();
  }
});

function playBellTone() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(196, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(98, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.05);
    setTimeout(() => ctx.close(), 1300);
  } catch (err) {
    // Audio is optional; browser gesture policies vary.
  }
}

// ============ RESET CAR ============
function resetCar() {
  const outsideMap = Math.hypot(chassisBody.position.x,chassisBody.position.z) > 145 || chassisBody.position.y < -3;
  if (outsideMap) {
    // 掉到坑里, 回山门 spawn
    chassisBody.position.set(0, 1.5, 55);
    chassisBody.quaternion.set(0, 0, 0, 1);
  } else {
    // 就地复位: 保留 x/z, 抬高 1m, 保留 yaw, 把 pitch/roll 归零
    chassisBody.position.y = getDriveSurfaceHeight(chassisBody.position.x, chassisBody.position.z) + 1.45;
    const fwd = new CANNON.Vec3(0, 0, -1);
    chassisBody.quaternion.vmult(fwd, fwd);
    const yaw = Math.atan2(-fwd.x, -fwd.z);
    chassisBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
  }
  chassisBody.velocity.set(0, 0, 0);
  chassisBody.angularVelocity.set(0, 0, 0);
  // 清掉所有按键 + 引擎/转向/刹车残留, 避免"重置后车自动开走再翻"循环
  for (const k in keys) keys[k] = false;
  if (vehicle) {
    for (let i = 0; i < 4; i++) {
      vehicle.applyEngineForce(0, i);
      vehicle.setBrake(2, i);
      vehicle.setSteeringValue(0, i);
    }
  }
}

  explosiveCrates.forEach((c,i)=>{if(c.state!=='cooldown'){const target={x:c.x,z:c.z,label:'星火箱',spawnX:c.x+5*(i%2?1:-1),spawnZ:c.z+5,yaw:i%2?-.8:.8};dot(c.x,c.z,'星火箱','#ff6f55',2.7,target);}});
  const px = cx + chassisBody.position.x * mapScale;
  const py = cy + chassisBody.position.z * mapScale;
  const fwd = new CANNON.Vec3(0, 0, -1);
  chassisBody.quaternion.vmult(fwd, fwd);
  const angle = Math.atan2(fwd.z, fwd.x) + Math.PI / 2;
  navCtx.save();
  navCtx.translate(px, py); navCtx.rotate(angle);
  navCtx.beginPath(); navCtx.moveTo(0, -9); navCtx.lineTo(-6, 6); navCtx.lineTo(0, 3); navCtx.lineTo(6, 6); navCtx.closePath();
  navCtx.fillStyle = '#f6f3eb'; navCtx.shadowColor = '#ffb75e'; navCtx.shadowBlur = 8; navCtx.fill();
  navCtx.restore();
  navCtx.strokeStyle='rgba(246,243,235,.3)';navCtx.lineWidth=1;navCtx.strokeRect(.5,.5,W-1,W-1);
}

function navigationTargets(){
  const projectSpawns=[
    {spawnX:-22,spawnZ:34,yaw:-.65},{spawnX:22,spawnZ:34,yaw:.65},
    {spawnX:-18,spawnZ:7,yaw:-.35},{spawnX:18,spawnZ:7,yaw:.35},{spawnX:0,spawnZ:-15,yaw:Math.PI}
  ];
  return [
    ...worldZoneTargets,
    ...scrolls.map((s,i)=>({x:s.x,z:s.z,label:`项目 ${String(i+1).padStart(2,'0')}`,...projectSpawns[i]})),
    {x:-99,z:32,label:'西岸山坡',spawnX:-96,spawnZ:38,yaw:Math.PI/2},
    {x:101,z:-28,label:'东岸山坡',spawnX:96,spawnZ:-34,yaw:-Math.PI/2},
    ...explosiveCrates.filter(c=>c.state!=='cooldown').map((c,i)=>({x:c.x,z:c.z,label:'星火箱',spawnX:c.x+5*(i%2?1:-1),spawnZ:c.z+5,yaw:i%2?-.8:.8}))
  ];
}
function normalizeMapTarget(target){
  const safe={...target};
  const minClear=7.2;
  for(const s of scrolls){
    const tx=safe.spawnX ?? safe.x,tz=safe.spawnZ ?? safe.z;
    const dist=Math.hypot(tx-s.x,tz-s.z);
    if(dist<minClear){
      const dx=tx-s.x,dz=tz-s.z,len=Math.hypot(dx,dz)||1;
      safe.spawnX=s.x+dx/len*minClear;
      safe.spawnZ=s.z+dz/len*minClear;
    }
  }
  safe.spawnX=THREE.MathUtils.clamp(safe.spawnX ?? safe.x,-118,118);
  safe.spawnZ=THREE.MathUtils.clamp(safe.spawnZ ?? safe.z,-118,118);
  return safe;
}
function resetChaseCameraToVehicle(target){
  const safe=normalizeMapTarget(target);
  const spawnX=safe.spawnX ?? safe.x,spawnZ=safe.spawnZ ?? safe.z;
  const yaw=safe.yaw ?? 0;
  const surfaceY=getDriveSurfaceHeight(spawnX,spawnZ);
  chassisBody.position.set(spawnX,surfaceY+2.05,spawnZ);
  chassisBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),yaw);
  chassisBody.velocity.set(0,0,0);chassisBody.angularVelocity.set(0,0,0);
  if(vehicle){for(let i=0;i<4;i++){vehicle.applyEngineForce(0,i);vehicle.setBrake(3,i);vehicle.setSteeringValue(0,i);}}
  camYaw=0;introDiveActive=false;
  const fwd=new CANNON.Vec3(0,0,-1);chassisBody.quaternion.vmult(fwd,fwd);
  camera.position.set(spawnX-fwd.x*12,surfaceY+7.2,spawnZ-fwd.z*12);
  camera.lookAt(spawnX+fwd.x*7,surfaceY+1.4,spawnZ+fwd.z*7);
}
function travelToMapTarget(target){
  if(!chassisBody||!target)return;
  resetChaseCameraToVehicle(target);
  for(const k in keys)keys[k]=false;
  window._mapTravelGraceUntil=performance.now()+1800;
  const notice=document.getElementById('boundaryNotice');notice.textContent=`已前往 · ${target.label}`;notice.classList.add('show');window._boundaryNoticeUntil=performance.now()+1100;
  setMapExpanded(false);
}

});
