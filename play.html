<style>
  :root{
    --accent:#7F2020;
    --accent-hover:#a02828;
    --bg:#F6F3EB;
    --sage:#869B7E;
    --sand:#C9CAAC;
    --ink:#2a2520;
    --ink-soft:#6b6358;
    --ink-mute:#a39d8e;
    --hud-bg:rgba(246, 243, 235, 0.35);
    --hud-border:rgba(127, 32, 32, 0.4);
    --hud-blur:blur(14px) saturate(1.1);
    --hanzi:"Noto Serif SC","Songti SC","STSong",serif;
    --mono:"JetBrains Mono","SF Mono",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:var(--hanzi);
  }
  canvas{display:block;cursor:grab;outline:none}
  canvas:active{cursor:grabbing}

  /* ============ 加载页 ============ */
  #loader{
    position:fixed;inset:0;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;
    transition:opacity .8s ease;
  }
  #loader.hidden{opacity:0;pointer-events:none}
  #loader .seal{
    font-family:var(--hanzi);
    font-size:88px;color:var(--accent);
    border:3px solid var(--accent);
    width:140px;height:140px;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
    margin-bottom:28px;
    box-shadow:0 0 0 6px var(--bg), 0 0 0 8px var(--accent);
    letter-spacing:0;
  }
  #loader .seal-sub{
    font-size:13px;letter-spacing:.4em;color:var(--ink);
    margin-bottom:24px;opacity:.7;
  }
  #loader .progress{
    width:220px;height:2px;background:#e6e1d2;
    overflow:hidden;
  }
  #loader .progress .bar{
    height:100%;background:var(--accent);width:0%;
    transition:width .25s ease;
  }
  #loader .hint{
    font-size:11px;color:var(--ink);opacity:.5;
    letter-spacing:.2em;margin-top:18px;
  }

  /* ============ HUD ============ */
  #hud{
    position:fixed;top:24px;left:24px;
    background:var(--hud-bg);
    backdrop-filter:var(--hud-blur);
    -webkit-backdrop-filter:var(--hud-blur);
    border-left:1px solid var(--hud-border);
    padding:18px 24px;
    font-size:13px;line-height:1.8;
    z-index:10;

  }

    font-size:15px;font-weight:600;color:var(--accent);
    letter-spacing:.08em;margin-bottom:4px;
  }
  #hud .subtitle{

  }
  #hud .keys{
    font-family:var(--mono);font-size:11px;
    color:var(--ink);opacity:.75;

    border-top:1px dashed rgba(127,32,32,.2);
    padding-top:10px;margin-top:4px;

  }

  }

    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:rgba(246,243,235,.55);
    backdrop-filter:blur(10px);

    border:1px solid rgba(127,32,32,.4);

    z-index:12;
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;

  #stamina-bar .fill{
    height:100%;width:100%;

    transition:width .05s linear;
    transform-origin:left;
  }

    position:fixed;inset:0;

    display:none;

    margin-bottom:8px;font-weight:600;

    font-size:13px;letter-spacing:.1em;
  }
  #mobile-block .links a.primary{

  /* ============ 鼠标跟随：玻璃圆光标 ============ */
  @media (hover:hover) and (pointer:fine){
    body, a, button{cursor:none}
    canvas{cursor:none}
    canvas:active{cursor:none}
  }
  .cursor-ring{
    position:fixed; top:0; left:0;
    width:42px; height:42px;
    margin:-21px 0 0 -21px;
    pointer-events:none; z-index:9999;
    will-change:transform;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:0;
  }
  .cursor-ring .circle{
    width:100%; height:100%; border-radius:50%;
    background:rgba(127, 32, 32, 0.18);
    border:1.5px solid rgba(127, 32, 32, 0.6);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    transform:scale(.22);
    transition:transform .45s cubic-bezier(.55,.085,0,.99),
               background-color .3s ease,
               border-color .3s ease,
               backdrop-filter .3s ease,
               -webkit-backdrop-filter .3s ease;
  }
  .cursor-ring.hover .circle{
    transform:scale(.95);
    background:rgba(127, 32, 32, 0.22);
    border-color:rgba(127, 32, 32, 0.8);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .cursor-ring.text .circle{
    transform:scale(1.2);
    background:rgba(127, 32, 32, 0.28);
    border-color:rgba(127, 32, 32, 0);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .cursor-ring .cr-label{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(.3);
    font-family:"Noto Serif SC",serif;
    font-size:11px; font-weight:500;
    color:#F6F3EB;
    letter-spacing:.04em; white-space:nowrap;
    opacity:0;
    transition:opacity .25s .15s, transform .4s cubic-bezier(.55,.085,0,.99) .08s;
    pointer-events:none;
  }
  .cursor-ring.text .cr-label{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
  .cursor-ring.text .cr-label.en{
    font-family:"JetBrains Mono",monospace;
    font-size:9px; letter-spacing:.28em; font-weight:600;
  }
  .cursor-ring.click .circle{transform:scale(.6)}
  @media (hover:none), (pointer:coarse){
    .cursor-ring{display:none}
    body{cursor:default}
    canvas{cursor:grab}
    canvas:active{cursor:grabbing}
  }
</style>

<!-- ============ Custom Cursor (玻璃圆) ============ -->
<div class="cursor-ring" id="cursorRing">

  <span class="cr-label" id="cursorLabel">阅读</span>
</div>
<script>
(function(){
  if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const ring = document.getElementById('cursorRing');
  const label = document.getElementById('cursorLabel');
  let mx = window.innerWidth/2, my = window.innerHeight/2;
  let rx = mx, ry = my;
  let raf = null;
  ring.style.transform = 'translate3d(-100px,-100px,0)';
  document.addEventListener('mousemove', e=>{
    mx = e.clientX; my = e.clientY;
    if(!raf) raf = requestAnimationFrame(tick);
  });
  function tick(){
    rx += (mx - rx) * 0.22;
    ry += (my - ry) * 0.22;
    ring.style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
    if(Math.abs(mx - rx) > 0.1 || Math.abs(my - ry) > 0.1){
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
    }
  }
  document.addEventListener('mousedown', ()=> ring.classList.add('click'));
  document.addEventListener('mouseup', ()=> ring.classList.remove('click'));
  document.querySelectorAll('a, button').forEach(el=>{
    el.addEventListener('mouseenter', ()=>{
      if(el.hasAttribute('data-cursor')) return;
      ring.classList.add('hover');
    });
    el.addEventListener('mouseleave', ()=>{
      ring.classList.remove('hover');
    });
  });
  document.querySelectorAll('[data-cursor]').forEach(el=>{
    const text = el.dataset.cursor;
    const isEnglish = /^[A-Z]+$/.test(text);
    el.addEventListener('mouseenter', ()=>{
      label.textContent = text;
      label.classList.toggle('en', isEnglish);
      ring.classList.add('text');
      ring.classList.remove('hover');
    });
    el.addEventListener('mouseleave', ()=>{
      ring.classList.remove('text');
    });
  });
  document.addEventListener('mouseleave', ()=>{
    ring.style.opacity = '0';
  });
  document.addEventListener('mouseenter', ()=>{
    ring.style.opacity = '1';
  });
  // 暴露给 module 脚本：在 3D 场景接近石碑时让 cursor 显示"阅读"
  // 仅在 3D scene 自己设置过时才清除，避免与 DOM hover 冲突
  let sceneOwnsText = false;
  window.__cursorRing = {
    showRead: ()=>{
      label.textContent = '阅读';
      label.classList.remove('en');
      ring.classList.add('text');
      ring.classList.remove('hover');
      sceneOwnsText = true;
    },
    clear: ()=>{
      if (sceneOwnsText) {
        ring.classList.remove('text');
        sceneOwnsText = false;
      }
    }
  };
  // DOM 元素 mouseenter 时归还所有权
  document.querySelectorAll('[data-cursor]').forEach(el=>{
    el.addEventListener('mouseenter', ()=>{ sceneOwnsText = false; });
  });
})();
</script>

<script type="module">
import * as THREE from 'three';

// ============ 移动端拦截 ============
if ('ontouchstart' in window && !window.matchMedia('(min-width: 900px)').matches) {
  document.getElementById('mobile-block').classList.add('show');
  document.getElementById('loader').classList.add('hidden');
  throw new Error('mobile-blocked');
}

// ============ 配色 ============
const C = {
  accent: 0x7F2020,
  accentLight: 0xa02828,
  bg: 0xF6F3EB,
  sage: 0x869B7E,
  sageDark: 0x5d6e57,
  sand: 0xC9CAAC,
  ink: 0x2a2520,
  brick: 0x9a8d72,
  brickDark: 0x6e6650,
  wall: 0xefe6d2,
  roof: 0x3a3128,
  wood: 0x6b3a2a,
  bamboo: 0x7a8b5a,
  bamboo2: 0x9aab74,
  lantern: 0xff5050,
};

// ============ 项目数据 ============
const FALLBACK_PROJECTS = [
  { id:'multi-agent-research', name_cn:'Multi-Agent Research', tagline:'多 Agent 深度研究框架', url_detail:'projects/multi-agent-research.html', featured_award:null, color:'#7F2020' },
  { id:'auto-new', name_cn:'auto-new', tagline:'Skill / 脚本 / prompt 自迭代引擎', url_detail:'projects/auto-new.html', featured_award:null, color:'#7F2020' },
  { id:'personal-context-system', name_cn:'Personal Context System', tagline:'可维护个人 Context 系统', url_detail:'projects/obsidian-lifeos.html', featured_award:null, color:'#869B7E' },
  { id:'knowledge-healer', name_cn:'knowledge-healer', tagline:'飞书知识库自愈巡检', url_detail:'projects/knowledge-healer.html', featured_award:'飞书十佳', color:'#7F2020' },
  { id:'lark-survey-scoreboard', name_cn:'lark-survey-scoreboard', tagline:'飞书实时评分大屏', url_detail:'projects/lark-survey-scoreboard.html', featured_award:'飞书十佳', color:'#869B7E' }
];
const PROJECTS = (window.SITE_DATA && Array.isArray(window.SITE_DATA.projects) && window.SITE_DATA.projects.length)
  ? window.SITE_DATA.projects : FALLBACK_PROJECTS;
document.getElementById('projCount').textContent = PROJECTS.length;

// ============ Three.js 基础 ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.Fog(0xeae3cf, 28, 90);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 3.2, 14);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ============ 光照 ============
const ambient = new THREE.AmbientLight(0xfff4e0, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff0d8, 0.95);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;

// ============ 程序化纹理：青砖地面 ============
function makeBrickTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  // 底色
  ctx.fillStyle = '#a89c82';
  ctx.fillRect(0, 0, s, s);
  // 砖块
  const tileW = 64, tileH = 32;
  for (let y = 0; y < s; y += tileH) {
    const offset = (y / tileH) % 2 === 0 ? 0 : tileW / 2;
    for (let x = -tileW; x < s + tileW; x += tileW) {
      const tx = x + offset;
      const shade = 130 + Math.floor(Math.random() * 40);
      ctx.fillStyle = `rgb(${shade-10},${shade-18},${shade-35})`;
      ctx.fillRect(tx + 1, y + 1, tileW - 2, tileH - 2);
      // 颗粒
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.08})`;
        ctx.fillRect(tx + Math.random()*tileW, y + Math.random()*tileH, 2, 2);
      }
    }
    // 缝隙
    ctx.fillStyle = '#5a5240';
    ctx.fillRect(0, y, s, 1);
  }
  for (let x = 0; x < s; x += tileW/2) {
    ctx.fillStyle = '#5a5240';
    ctx.fillRect(x, 0, 1, s);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 10);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeMossTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 20, s/2, s/2, s/2);
  g.addColorStop(0, 'rgba(134,155,126,0.0)');
  g.addColorStop(0.6, 'rgba(93,110,87,0.4)');
  g.addColorStop(1, 'rgba(70,85,60,0.8)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 80; i++) {
    ctx.fillStyle = `rgba(134,155,126,${Math.random()*0.6})`;
    ctx.beginPath();
    ctx.arc(Math.random()*s, Math.random()*s, Math.random()*4 + 1, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

function makeWallTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#efe6d2';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 2000; i++) {
    ctx.fillStyle = `rgba(${110+Math.random()*30},${100+Math.random()*30},${80+Math.random()*30},${Math.random()*0.12})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
  // 水渍
  for (let i = 0; i < 4; i++) {
    const g = ctx.createRadialGradient(Math.random()*s, Math.random()*s, 5, Math.random()*s, Math.random()*s, 40);
    g.addColorStop(0, 'rgba(120,100,80,0.15)');
    g.addColorStop(1, 'rgba(120,100,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeScrollTexture(title, tagline) {
  const w = 256, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  // 米黄底
  ctx.fillStyle = '#f4ead0';
  ctx.fillRect(0, 0, w, h);
  // 老旧纹理
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(${120+Math.random()*40},${100+Math.random()*30},${70+Math.random()*30},${Math.random()*0.1})`;
    ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1);
  }
  // 边框
  ctx.strokeStyle = '#7F2020';
  ctx.lineWidth = 3;
  ctx.strokeRect(16, 16, w-32, h-32);
  ctx.lineWidth = 1;
  ctx.strokeRect(22, 22, w-44, h-44);
  // 标题
  ctx.fillStyle = '#7F2020';
  ctx.font = 'bold 26px "Noto Serif SC","Songti SC",serif';
  ctx.textAlign = 'center';
  // 中文分行
  const lines = wrapText(ctx, title, w - 60);
  let y = 80;
  lines.forEach(line => { ctx.fillText(line, w/2, y); y += 34; });
  // 分隔
  ctx.fillStyle = '#7F2020';
  ctx.fillRect(w/2 - 30, y + 12, 60, 2);
  // tagline
  ctx.fillStyle = '#2a2520';
  ctx.font = '15px "Noto Serif SC","Songti SC",serif';
  const tlines = wrapText(ctx, tagline, w - 60);
  y += 50;
  tlines.forEach(line => { ctx.fillText(line, w/2, y); y += 22; });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  for (const word of words) {
    if (ctx.measureText(word).width > maxW) {
      if (cur) { lines.push(cur); cur = ''; }
      for (const ch of word) {
        const test = cur + ch;
        if (ctx.measureText(test).width > maxW && cur.length > 0) {
          lines.push(cur);
          cur = ch;
        } else {
          cur = test;
        }
      }
      continue;
    }
    const test = cur ? cur + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && cur.length > 0) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function makePlaqueTexture(text) {
  const w = 512, h = 128;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7F2020';
  ctx.fillRect(0, 0, w, h);
  // 金边
  ctx.strokeStyle = '#d4a55a';
  ctx.lineWidth = 4;
  ctx.strokeRect(6, 6, w-12, h-12);
  ctx.lineWidth = 1;
  ctx.strokeRect(14, 14, w-28, h-28);
  // 文字
  ctx.fillStyle = '#f4ead0';
  ctx.font = 'bold 64px "Noto Serif SC","Songti SC",serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w/2, h/2 + 4);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildHall(x, z, scale = 1) {
  const g = new THREE.Group();
  const w = 10 * scale, d = 6 * scale, h = 4 * scale;
  // 主体
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ map: wallTex.clone(), color: C.wall, roughness: 0.9 })
  );
  body.material.map.repeat.set(3, 1);
  body.position.y = h/2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  // 屋顶（双坡）
  const roofH = 2 * scale;
  const roofGeo = new THREE.BufferGeometry();
  const v = new Float32Array([
    -w/2 - 0.5, 0, -d/2 - 0.4,   w/2 + 0.5, 0, -d/2 - 0.4,   0, roofH, -d/2 - 0.4,
    -w/2 - 0.5, 0,  d/2 + 0.4,   w/2 + 0.5, 0,  d/2 + 0.4,   0, roofH,  d/2 + 0.4,
  ]);
  // 简化：用 box + 角度
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(d/2 + 0.8, roofH, 4),
    new THREE.MeshStandardMaterial({ color: C.roof, roughness: 0.6, flatShading: true })
  );
  roof.rotation.y = Math.PI/4;
  roof.scale.set(1.4 * (w/(d+1.6)), 1, 1);
  roof.position.y = h + roofH/2;
  roof.castShadow = true;
  g.add(roof);
  // 屋脊
  const ridge = new THREE.Mesh(
    new THREE.BoxGeometry(w + 1, 0.25, 0.3),
    new THREE.MeshStandardMaterial({ color: C.ink, roughness: 0.5 })
  );
  ridge.position.y = h + roofH - 0.1;
  g.add(ridge);
  // 门
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(2.2 * scale, 2.8 * scale, 0.15),
    new THREE.MeshStandardMaterial({ color: C.accent, roughness: 0.5 })
  );
  door.position.set(0, 1.4 * scale, d/2 + 0.08);
  door.castShadow = true;
  g.add(door);
  // 门框
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(2.6 * scale, 3.2 * scale, 0.25),
    new THREE.MeshStandardMaterial({ color: C.wood, roughness: 0.6 })
  );
  frame.position.set(0, 1.6 * scale, d/2 + 0.04);
  g.add(frame);
  // 匾额（"美名书院"）
  const plaqueMat = new THREE.MeshStandardMaterial({
    map: makePlaqueTexture('美名书院'),
    roughness: 0.5,
    emissive: 0x220505, emissiveIntensity: 0.15,
  });
  const plaque = new THREE.Mesh(
    new THREE.BoxGeometry(3.6 * scale, 0.9 * scale, 0.18),
    plaqueMat
  );
  plaque.position.set(0, 3.4 * scale, d/2 + 0.15);
  plaque.castShadow = true;
  g.add(plaque);
  // 两侧朱红柱
  for (const sx of [-1, 1]) {
    const col = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, h, 12),
      new THREE.MeshStandardMaterial({ color: C.accent, roughness: 0.4 })
    );
    col.position.set(sx * (w/2 - 0.6), h/2, d/2 + 0.3);
    col.castShadow = true;
    g.add(col);
  }
  // 台阶
  for (let i = 0; i < 3; i++) {
    const step = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.6, 0.18, 0.5 + i * 0.3),
      new THREE.MeshStandardMaterial({ color: C.sand, roughness: 0.8 })
    );
    step.position.set(0, 0.09 + i * 0.18, d/2 + 0.4 + i * 0.25);
    step.receiveShadow = true;
    g.add(step);
  }
  g.position.set(x, 0, z);
  return g;
}

    g.add(col);

    new THREE.ConeGeometry(w * 0.8, 1.8, 4),
    new THREE.MeshStandardMaterial({ color: C.roof, roughness: 0.6, flatShading: true })
  );
  roof.rotation.y = Math.PI/4;

    new THREE.BoxGeometry(w + 0.4, 0.2, d + 0.4),
    new THREE.MeshStandardMaterial({ color: C.sand, roughness: 0.8 })
  );
  base.position.y = 0.1;
  base.receiveShadow = true;
  g.add(base);
  g.position.set(x, 0, z);
  return g;
}

const lanterns = [];
function makeLantern(x, y, z, scaleVal = 1) {

    new THREE.SphereGeometry(0.32 * scaleVal, 16, 12),
    new THREE.MeshStandardMaterial({
      color: 0xc63030,
      emissive: 0xff4040, emissiveIntensity: 0.55,
      roughness: 0.5,
    })
  );
  body.scale.y = 0.85;
  body.position.y = -0.05;
  g.add(body);
  // 上下盖
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.18 * scaleVal, 0.18 * scaleVal, 0.08, 12),
    new THREE.MeshStandardMaterial({ color: C.ink, roughness: 0.7 })
  );
  cap.position.y = 0.22 * scaleVal;
  g.add(cap);
  const cap2 = cap.clone();
  cap2.position.y = -0.32 * scaleVal;
  g.add(cap2);
  // 流苏
  const tassel = new THREE.Mesh(
    new THREE.ConeGeometry(0.06, 0.25, 8),
    new THREE.MeshStandardMaterial({ color: 0xe8b840 })
  );
  tassel.position.y = -0.5 * scaleVal;
  g.add(tassel);
  // 点光源
  const pl = new THREE.PointLight(0xff7040, 0.7, 6, 2);

  g.position.set(x, y, z);
  g.userData.baseY = y;
  g.userData.phase = Math.random() * Math.PI * 2;
  lanterns.push(g);
  return g;
}

function makeBamboo(x, z, height = 5) {
  const g = new THREE.Group();
  const segs = Math.floor(height / 0.7);
  for (let i = 0; i < segs; i++) {
    const seg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.08, 0.65, 8),
      new THREE.MeshStandardMaterial({ color: C.bamboo, roughness: 0.7 })
    );
    seg.position.y = i * 0.7 + 0.35;
    seg.castShadow = true;
    g.add(seg);
    // 节
    const node = new THREE.Mesh(
      new THREE.TorusGeometry(0.08, 0.015, 4, 8),
      new THREE.MeshStandardMaterial({ color: C.sageDark })
    );
    node.position.y = i * 0.7 + 0.7;
    node.rotation.x = Math.PI/2;
    g.add(node);
  }
  // 顶部叶片簇
  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(
      new THREE.ConeGeometry(0.18, 0.7, 4),
      new THREE.MeshStandardMaterial({ color: i % 2 ? C.bamboo : C.bamboo2, roughness: 0.6, flatShading: true })
    );
    const ang = (i / 6) * Math.PI * 2;
    leaf.position.set(Math.cos(ang) * 0.25, height - 0.2 + Math.random()*0.4, Math.sin(ang) * 0.25);
    leaf.rotation.set(Math.random()*0.4, Math.random(), Math.random()*0.4);
    leaf.castShadow = true;
    g.add(leaf);
  }
  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI;
  return g;
}

// ============ 樱花树（Cherry Blossom） ============
const trunkMat = new THREE.MeshToonMaterial({ color: 0x5c3a1e });
const blossomPinks = [0xffb7c5, 0xff91a4, 0xffc0cb, 0xffe0e6, 0xffffff];

function makeCherryBlossom(x, z, opts = {}) {
  const g = new THREE.Group();
  const scale = opts.scale || (0.7 + Math.random() * 0.6);
  const h = (3.5 + Math.random() * 1.5) * scale;

  // -- trunk --
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08 * scale, 0.18 * scale, h, 8),
    trunkMat
  );
  trunk.position.y = h / 2;
  trunk.castShadow = true;
  g.add(trunk);

  // -- branches (2-4 random) --
  const branchCount = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < branchCount; i++) {
    const bLen = (1.0 + Math.random() * 1.2) * scale;
    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03 * scale, 0.06 * scale, bLen, 6),
      trunkMat
    );
    const bY = h * (0.5 + Math.random() * 0.35);
    const ang = (i / branchCount) * Math.PI * 2 + Math.random() * 0.5;
    branch.position.set(
      Math.cos(ang) * bLen * 0.35,
      bY,
      Math.sin(ang) * bLen * 0.35
    );
    branch.rotation.z = (Math.random() - 0.5) * 0.6 + (Math.cos(ang) > 0 ? -0.5 : 0.5);
    branch.rotation.x = (Math.random() - 0.5) * 0.4;
    branch.castShadow = true;
    g.add(branch);

    // blossom cluster at branch tip
    const cSize = (0.4 + Math.random() * 0.4) * scale;
    const cluster = new THREE.Mesh(
      new THREE.SphereGeometry(cSize, 6, 5),
      new THREE.MeshToonMaterial({
        color: blossomPinks[Math.floor(Math.random() * blossomPinks.length)],
      })
    );
    cluster.position.set(
      Math.cos(ang) * bLen * 0.65,
      bY + bLen * 0.25,
      Math.sin(ang) * bLen * 0.65
    );
    cluster.scale.y = 0.7 + Math.random() * 0.3;
    cluster.castShadow = true;
    g.add(cluster);
  }

  // -- crown canopy (2-3 overlapping spheres at top) --
  for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) {
    const r = (0.6 + Math.random() * 0.5) * scale;
    const canopy = new THREE.Mesh(
      new THREE.SphereGeometry(r, 7, 6),
      new THREE.MeshToonMaterial({
        color: blossomPinks[Math.floor(Math.random() * blossomPinks.length)],
      })
    );
    canopy.position.set(
      (Math.random() - 0.5) * 0.6 * scale,
      h - 0.2 + Math.random() * 0.5 * scale,
      (Math.random() - 0.5) * 0.6 * scale
    );
    canopy.scale.y = 0.65 + Math.random() * 0.25;
    canopy.castShadow = true;
    g.add(canopy);
  }

  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  return g;
}

    pos[i3]     += petalVel[i3]     * dt + Math.sin(Date.now() * 0.001 + i) * 0.003;

    pos[i3 + 2] += petalVel[i3 + 2] * dt + Math.cos(Date.now() * 0.0012 + i) * 0.003;

      pos[i3 + 2] = (Math.random() - 0.5) * 40;

// ============ 项目展示物（卷轴 / 石碑） ============
const projectObjects = [];
function placeProjects() {
  const n = PROJECTS.length;
  const radius = 9.5;
  for (let i = 0; i < n; i++) {
    const proj = PROJECTS[i];
    const ang = (i / n) * Math.PI * 2 + Math.PI/2; // 起始在前方
    const px = Math.cos(ang) * radius;
    const pz = Math.sin(ang) * radius;
    const featured = !!proj.featured_award;
    const obj = featured ? makeStele(proj) : makeScroll(proj);
    obj.position.set(px, 0, pz);
    obj.lookAt(0, obj.position.y, 0);
    obj.userData.project = proj;
    obj.userData.baseRotY = obj.rotation.y;
    projectObjects.push(obj);
    scene.add(obj);
  }
}

// 鼠标拖拽旋转
let dragging = false;
let lastX = 0, lastY = 0;
renderer.domElement.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
addEventListener('mouseup', () => { dragging = false; });
addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  player.yaw -= dx * 0.005;
  player.pitch -= dy * 0.003;
  player.pitch = Math.max(-0.7, Math.min(0.5, player.pitch));
});

// ============ 碰撞 / 边界 ============
function clampPosition(p) {
  const lim = courtyard - 1.2;
  p.x = Math.max(-lim, Math.min(lim, p.x));
  p.z = Math.max(-lim, Math.min(courtyard + 4, p.z));
  // 中央石台
  const distCenter = Math.hypot(p.x, p.z);
  if (distCenter < 2.7) {
    const ang = Math.atan2(p.z, p.x);
    p.x = Math.cos(ang) * 2.7;
    p.z = Math.sin(ang) * 2.7;
  }
  // 项目物体
  projectObjects.forEach(o => {
    const d = Math.hypot(p.x - o.position.x, p.z - o.position.z);
    if (d < 1.0) {
      const ang = Math.atan2(p.z - o.position.z, p.x - o.position.x);
      p.x = o.position.x + Math.cos(ang) * 1.0;
      p.z = o.position.z + Math.sin(ang) * 1.0;
    }
  });
}

  let best = null;
  projectObjects.forEach(o => {
    const d = Math.hypot(player.pos.x - o.position.x, player.pos.z - o.position.z);
    if (!best || d < best.dist) best = { obj: o, dist: d };
  });
  return best;
}

// ============ Sprint / Stamina (Genshin-style) ============
const sprint = {
  stamina: 100,           // current stamina (0-100)
  maxStamina: 100,
  drainRate: 18,          // per second while sprinting
  regenRate: 25,          // per second while idle
  regenDelay: 1.5,        // seconds after sprint ends before regen starts
  idleTimer: 0,           // time since last sprint
  active: false,          // currently sprinting?
  walkSpeed: 4.0,
  sprintSpeed: 4.0 * 1.7, // 6.8
  fovBase: 55,            // camera resting FOV (matches initial PerspectiveCamera)
  fovSprint: 65,          // FOV while sprinting
  fovCurrent: 55,
};

// ============ Stamina HUD refs ============
const stBar = document.getElementById('stamina-bar');
const stFill = document.getElementById('staminaFill');

// ============ 主循环 ============
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  // --- Sprint state machine ---
  const wantSprint = (keys['ShiftLeft'] || keys['ShiftRight']);
  const dir = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) dir.z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) dir.z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) dir.x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dir.x += 1;
  const moving = dir.lengthSq() > 0;
  if (moving) dir.normalize();

  // Enter/exit sprint
  sprint.active = wantSprint && moving && sprint.stamina > 0;

  if (sprint.active) {
    sprint.stamina = Math.max(0, sprint.stamina - sprint.drainRate * dt);
    sprint.idleTimer = 0;
    if (sprint.stamina === 0) sprint.active = false; // exhausted
  } else {
    sprint.idleTimer += dt;
    if (sprint.idleTimer >= sprint.regenDelay) {
      sprint.stamina = Math.min(sprint.maxStamina, sprint.stamina + sprint.regenRate * dt);
    }
  }

  // FOV lerp
  const targetFov = sprint.active ? sprint.fovSprint : sprint.fovBase;
  sprint.fovCurrent += (targetFov - sprint.fovCurrent) * Math.min(1, 8 * dt);
  camera.fov = sprint.fovCurrent;
  camera.updateProjectionMatrix();

  // Stamina HUD
  const stPct = sprint.stamina / sprint.maxStamina;
  stFill.style.width = (stPct * 100) + '%';
  stBar.classList.toggle('show', sprint.active || sprint.stamina < sprint.maxStamina);
  stBar.classList.toggle('low', stPct < 0.2);

  const speed = sprint.active ? sprint.sprintSpeed : sprint.walkSpeed;
  // 朝向相机：yaw=0 时朝 -Z，W (dir.z=-1) 应让 z 减小
  const cosY = Math.cos(player.yaw), sinY = Math.sin(player.yaw);
  const moveX = dir.x * cosY + dir.z * sinY;
  const moveZ = -dir.x * sinY + dir.z * cosY;
  player.pos.x += moveX * speed * dt;
  player.pos.z += moveZ * speed * dt;

  // 跳跃 / 重力
  if (!player.onGround) {
    player.pos.y += player.jumpVel * dt;
    player.jumpVel -= 12 * dt;
    if (player.pos.y <= 1.7) {
      player.pos.y = 1.7;
      player.jumpVel = 0;
      player.onGround = true;
    }
  }
  // 走路时轻微 head bob（冲刺时更强烈）
  if (moving && player.onGround) {
    const bobFreq = sprint.active ? 13 : 9;
    const bobAmp  = sprint.active ? 0.065 : 0.04;
    player.pos.y = 1.7 + Math.sin(t * bobFreq) * bobAmp;
  } else if (player.onGround) {
    player.pos.y = 1.7;
  }

  clampPosition(player.pos);

  // 应用相机
  camera.position.copy(player.pos);
  const lookDir = new THREE.Vector3(
    Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    Math.cos(player.yaw) * Math.cos(player.pitch)
  );
  // 注意：默认 yaw=0 时向 -Z 看
  camera.lookAt(
    player.pos.x - lookDir.x,
    player.pos.y + lookDir.y,
    player.pos.z - lookDir.z
  );

  // 灯笼摇摆
  lanterns.forEach(l => {
    l.position.y = l.userData.baseY + Math.sin(t * 1.5 + l.userData.phase) * 0.04;
    l.rotation.z = Math.sin(t * 1.2 + l.userData.phase) * 0.06;
  });

  // 项目物体动画
  projectObjects.forEach(o => {
    if (o.userData.star) {
      o.userData.star.rotation.y += dt * 1.5;
      o.userData.star.position.y = 3.55 + Math.sin(t * 2 + o.position.x) * 0.08;
    }
    if (o.userData.glow) {
      o.userData.glow.material.opacity = 0.18 + Math.sin(t * 1.8 + o.position.x) * 0.1;
      o.userData.glow.rotation.z += dt * 0.3;
    }
  });

  // 接近检测
  const nearest = findNearest();
  let proximityOn = false;
  projectObjects.forEach(o => {
    const d = Math.hypot(player.pos.x - o.position.x, player.pos.z - o.position.z);
    if (o.userData.halo) {
      const targetOp = d < 4.5 ? 0.45 - d/12 : 0;
      o.userData.halo.material.opacity += (targetOp - o.userData.halo.material.opacity) * 0.1;
      o.userData.halo.rotation.z += dt * 0.4;
    }
  });
  if (nearest && nearest.dist < 4.5 && !dialogOpen) {
    proximity.classList.add('show');
    proximityOn = true;
    if (window.__cursorRing) window.__cursorRing.showRead();
  } else {
    proximity.classList.remove('show');
    if (window.__cursorRing) window.__cursorRing.clear();
  }

  // falling petals
  updatePetals(dt);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ============ 加载完成 ============
const loadBar = document.getElementById('loadBar');
let loadProg = 0;
const loadTick = setInterval(() => {
  loadProg += 8 + Math.random() * 14;
  if (loadProg >= 100) {
    loadProg = 100;
    clearInterval(loadTick);
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      tick();
    }, 350);
  }
  loadBar.style.width = loadProg + '%';
}, 90);

// ============ 窗口 resize ============
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
