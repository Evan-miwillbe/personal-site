<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>滕美名 · 探索 · Drive Around</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#dfe6ed;font-family:"Inter","HarmonyOS Sans SC","PingFang SC",sans-serif;color:#1b1a17}
  canvas{display:block;cursor:grab;outline:none}
  canvas:active{cursor:grabbing}

  /* 加载页 */
  #loader{
    position:fixed;inset:0;
    background:#fbfaf6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;
    transition:opacity .6s;
  }
  #loader.hidden{opacity:0;pointer-events:none}
  #loader .seal{
    font-family:"Noto Serif SC","Songti SC",serif;
    font-size:64px;color:#8b2f2f;
    border:2px solid #8b2f2f;
    padding:8px 16px;
    margin-bottom:32px;
  }
  #loader .hint{
    font-size:13px;color:#666;letter-spacing:.16em;margin-top:8px;
  }
  #loader .progress{
    width:200px;height:2px;background:#eee;margin-top:24px;
  }
  #loader .progress .bar{
    height:100%;background:#8b2f2f;width:0%;transition:width .3s;
  }

  /* HUD */
  #hud{
    position:fixed;top:24px;left:24px;
    background:rgba(251,250,246,.85);
    backdrop-filter:blur(8px);
    border:1px solid rgba(139,47,47,.3);
    border-left:3px solid #8b2f2f;
    padding:14px 20px;
    font-size:13px;line-height:1.7;
    z-index:10;
    max-width:280px;
  }
  #hud strong{color:#8b2f2f;font-weight:600;letter-spacing:.04em}
  #hud .keys{font-family:"JetBrains Mono",monospace;font-size:11px;color:#555;margin-top:6px;letter-spacing:.04em}
  #hud .keys kbd{
    background:#fff;border:1px solid #ccc;border-bottom-width:2px;
    padding:1px 6px;border-radius:3px;font-family:inherit;font-size:10px;
    margin:0 1px;
  }

  /* 右上角 切回简历 */
  .toplinks{
    position:fixed;top:24px;right:24px;z-index:10;
    display:flex;gap:14px;
  }
  .toplinks a{
    background:rgba(251,250,246,.85);
    backdrop-filter:blur(8px);
    border:1px solid #ccc;
    padding:8px 14px;
    font-size:12px;text-decoration:none;color:#1b1a17;
    letter-spacing:.04em;
    transition:all .2s;
  }
  .toplinks a:hover{border-color:#8b2f2f;color:#8b2f2f}

  /* Dialog 弹窗 */
  #dialog{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(120%);
    width:min(560px,calc(100% - 48px));
    background:rgba(251,250,246,.96);
    backdrop-filter:blur(12px);
    border:1px solid rgba(139,47,47,.3);
    border-top:3px solid #8b2f2f;
    padding:28px 32px;
    z-index:20;
    transition:transform .4s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:0 12px 40px rgba(0,0,0,.12);
  }
  #dialog.open{transform:translateX(-50%) translateY(0)}
  #dialog .dlg-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;color:#8b2f2f;
    letter-spacing:.24em;text-transform:uppercase;
    margin-bottom:10px;
  }
  #dialog h3{
    font-family:"Noto Serif SC","Songti SC",serif;
    font-size:22px;font-weight:500;margin-bottom:12px;line-height:1.4;
  }
  #dialog p{font-size:14.5px;line-height:1.75;color:#4a4842;margin-bottom:12px}
  #dialog .dlg-meta{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;color:#888;letter-spacing:.06em;
    border-top:1px dashed #ccc;padding-top:10px;
    display:flex;flex-wrap:wrap;gap:18px;
  }
  #dialog .dlg-close{
    position:absolute;top:14px;right:18px;
    width:28px;height:28px;border-radius:50%;
    border:1px solid #ccc;background:none;cursor:pointer;
    font-size:14px;color:#888;line-height:1;
  }
  #dialog .dlg-close:hover{border-color:#8b2f2f;color:#8b2f2f}
  #dialog a{color:#8b2f2f}

  /* 移动端方向键 */
  #touch{
    position:fixed;bottom:24px;left:24px;
    display:none;z-index:15;
    grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);
    gap:6px;
  }
  #touch button{
    background:rgba(251,250,246,.7);
    backdrop-filter:blur(6px);
    border:1px solid #aaa;
    border-radius:8px;
    font-size:18px;color:#333;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  #touch button:active{background:#8b2f2f;color:#fff}
  #touch .up{grid-column:2;grid-row:1}
  #touch .left{grid-column:1;grid-row:2}
  #touch .down{grid-column:2;grid-row:2}
  #touch .right{grid-column:3;grid-row:2}
  @media(max-width:768px){
    #touch{display:grid}
    #hud{font-size:12px;padding:10px 14px;max-width:240px}
  }

  /* 速度计 */
  #speedo{
    position:fixed;bottom:24px;right:24px;z-index:10;
    font-family:"JetBrains Mono",monospace;
    background:rgba(251,250,246,.85);
    backdrop-filter:blur(8px);
    border:1px solid #ccc;
    padding:8px 14px;font-size:12px;letter-spacing:.06em;
    color:#555;
  }
  #speedo .num{color:#8b2f2f;font-size:16px;font-weight:600}
</style>
</head>
<body>

<!-- 加载页 -->
<div id="loader">
  <div class="seal">滕</div>
  <div style="font-family:'Noto Serif SC',serif;font-size:18px;letter-spacing:.12em;color:#1b1a17;">
    滕美名 · DRIVE AROUND
  </div>
  <div class="hint">正在加载 3D 场景...</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

<!-- HUD 提示 -->
<div id="hud">
  <strong>开车探索我的项目</strong><br/>
  撞到地上立着的方块，会展开详情。
  <div class="keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 · 拖动旋转视角
  </div>
</div>

<!-- 右上角链接 -->
<div class="toplinks">
  <a href="index.html">→ 简历版</a>
</div>

<!-- 弹窗 -->
<div id="dialog">
  <button class="dlg-close" onclick="closeDialog()">×</button>
  <div class="dlg-label" id="dlg-label">PROJECT</div>
  <h3 id="dlg-title">—</h3>
  <p id="dlg-body">—</p>
  <div class="dlg-meta" id="dlg-meta"></div>
</div>

<!-- 移动端方向键 -->
<div id="touch">
  <button class="up" data-key="w">▲</button>
  <button class="left" data-key="a">◀</button>
  <button class="down" data-key="s">▼</button>
  <button class="right" data-key="d">▶</button>
</div>

<!-- 速度计 -->
<div id="speedo">
  <span class="num" id="speed">0</span> · KM/H
</div>

<!-- Three.js ESM 配置 -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ============ 项目数据 ============
const PROJECTS = [
  {
    id:'multi-agent',
    label:'PROJECT · 01',
    title:'Multi-Agent Research · 多 Agent 深度研究框架',
    body:'13 天 / 77 commits / 47 轮控制实验 / v1 → v9.0。从 PM 中心制 7-Agent 简化为扁平星型 2-3 Agent，实证 Lost in Middle 效应（中间合规率 0% vs 首尾 100%）。',
    meta:'2026.04—05 · 个人独立研究 · 方法论已落地为飞书十佳作品',
    pos:[-18, 0, -12], size:[6,5,2.5], color:0xb84a4a, name:'Multi-Agent'
  },
  {
    id:'knowledge-healer',
    label:'★ 飞书 CLI 十佳',
    title:'knowledge-healer · 飞书知识库自愈巡检',
    body:'3+2 多 Agent 并行架构，对飞书知识库做 7 维健康诊断。关键创新：跨源交叉验证（文档 vs 群聊），检测知识漂移——文档没改，但群里有人说"现在不这么做了"。',
    meta:'2026.05 · MIT License · github.com/Evan-miwillbe/knowledge-healer',
    pos:[12, 0, -18], size:[5,6,2.5], color:0xc8943a, name:'knowledge-\nhealer'
  },
  {
    id:'lark-scoreboard',
    label:'★ 飞书 CLI 十佳',
    title:'lark-survey-scoreboard · 飞书实时评分大屏',
    body:'培训结束打开飞书妙记说一句话，AI 替你想题目、生成问卷。手机评分，大屏 1 秒刷新，数据存自己的飞书 Base，总成本 ¥0。起源于美动医疗实习需求。',
    meta:'2026.04 · github.com/Evan-miwillbe/lark-survey-scoreboard',
    pos:[20, 0, 8], size:[5,5.5,2.5], color:0xe8b86f, name:'lark-survey'
  },
  {
    id:'obsidian',
    label:'PROJECT · 04',
    title:'Obsidian LifeOS · 个人知识管理系统',
    body:'日 / 周 / 月三层任务视图 + 知识库面板。基于 Claude Code Superpowers 开发。配套韩国开发者开源终端插件二改（Tab 多页 / 上下分屏 / 一键复制路径）。',
    meta:'2026.03 — 至今 · 近 2 万字知识库',
    pos:[-22, 0, 8], size:[6,4.5,2.5], color:0x6b8e7e, name:'LifeOS'
  },
  {
    id:'about',
    label:'ABOUT',
    title:'关于滕美名',
    body:'上海对外经贸大学国际经济与贸易（全英语实验班）应届。武警湖南总队长沙支队退役。GPA 3.3，团支书。一条能力主线：识别重复模式 → 工具化 → 沉淀复用——从部队文书 SOP 到天风 REITs 周报 SOP 到美动 VBA 到 AI Skill 生态一脉相承。',
    meta:'22 岁 · 上海 · 慢工的研究型创造者',
    pos:[0, 0, 22], size:[7,6,2.5], color:0x4a6b8e, name:'About'
  },
  {
    id:'contact',
    label:'CONTACT',
    title:'想聊聊？',
    body:'我在找能让我和前沿待在一起、能动手做 AI 工具的位置——腾讯研究院 / 字节研究院类研究岗、AI Agent / Developer Experience PM、AI 创业团队早期员工、AI 行业研究。',
    meta:'Tengmeiming@163.com · +86 185-1677-3139 · github.com/Evan-miwillbe',
    pos:[0, 0, -26], size:[7,5,2.5], color:0x8b2f2f, name:'Contact'
  }
];

// ============ 场景设置 ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ed);
scene.fog = new THREE.Fog(0xdfe6ed, 35, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ 光照 ============
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff5e0, 1.1);
sun.position.set(20, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 100;
sun.shadow.bias = -0.0005;
scene.add(sun);

// 半球光让暗部不死黑
const hemi = new THREE.HemisphereLight(0xc4d4e0, 0xe8dcc0, 0.3);
scene.add(hemi);

// ============ 地面 ============
const groundGeo = new THREE.PlaneGeometry(120, 120, 60, 60);
const groundMat = new THREE.MeshStandardMaterial({
  color:0xeae3d2, roughness:0.95, metalness:0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 网格线辅助
const grid = new THREE.GridHelper(120, 60, 0xc8c0ad, 0xd8d2c0);
grid.position.y = 0.01;
scene.add(grid);

// ============ 车辆 ============
const car = new THREE.Group();
const bodyGeo = new THREE.BoxGeometry(1.4, 0.55, 2.2);
const bodyMat = new THREE.MeshStandardMaterial({color:0x8b2f2f, roughness:0.5, metalness:0.15});
const carBody = new THREE.Mesh(bodyGeo, bodyMat);
carBody.position.y = 0.65;
carBody.castShadow = true;
car.add(carBody);

// 车顶（简化驾驶舱）
const cabinGeo = new THREE.BoxGeometry(1.1, 0.4, 1.0);
const cabinMat = new THREE.MeshStandardMaterial({color:0x1b1a17, roughness:0.3});
const cabin = new THREE.Mesh(cabinGeo, cabinMat);
cabin.position.set(0, 1.12, -0.1);
cabin.castShadow = true;
car.add(cabin);

// 4 个轮子
const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.28, 16);
const wheelMat = new THREE.MeshStandardMaterial({color:0x222, roughness:0.7});
const wheelPositions = [[-0.7,0.32,0.75],[0.7,0.32,0.75],[-0.7,0.32,-0.75],[0.7,0.32,-0.75]];
const wheels = [];
wheelPositions.forEach(p=>{
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI/2;
  w.position.set(...p);
  w.castShadow = true;
  car.add(w);
  wheels.push(w);
});

// 前灯
[-0.45, 0.45].forEach(x=>{
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.08,8,8),
    new THREE.MeshStandardMaterial({color:0xfff5b8, emissive:0xfff5b8, emissiveIntensity:.3})
  );
  head.position.set(x, 0.7, 1.12);
  car.add(head);
});

scene.add(car);

// 车辆运动状态
const carState = {
  speed: 0,
  heading: 0,          // 朝向（弧度）
  steering: 0,
  maxSpeed: 0.42,
  accel: 0.012,
  brake: 0.025,
  friction: 0.985,
  turnRate: 0.038,
};

// ============ 项目方块 ============
const projectMeshes = [];
const interactionRadius = 4.5;

function createProjectBlock(proj){
  const group = new THREE.Group();
  group.position.set(proj.pos[0], proj.pos[1], proj.pos[2]);
  group.userData = proj;

  // 主块
  const geo = new THREE.BoxGeometry(...proj.size);
  const mat = new THREE.MeshStandardMaterial({
    color: proj.color, roughness:0.45, metalness:0.05,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = proj.size[1]/2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  // 顶部"光柱"提示有交互
  const beamGeo = new THREE.CylinderGeometry(0.05, 0.05, 3, 8);
  const beamMat = new THREE.MeshBasicMaterial({color: proj.color, transparent:true, opacity:0.4});
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.position.y = proj.size[1] + 1.5;
  group.add(beam);
  group.userData.beam = beam;

  // 顶部小球（hover 感）
  const orbGeo = new THREE.SphereGeometry(0.18, 12, 12);
  const orbMat = new THREE.MeshStandardMaterial({color: proj.color, emissive: proj.color, emissiveIntensity:0.6});
  const orb = new THREE.Mesh(orbGeo, orbMat);
  orb.position.y = proj.size[1] + 3.2;
  group.add(orb);
  group.userData.orb = orb;

  scene.add(group);
  projectMeshes.push(group);
  return group;
}

PROJECTS.forEach(createProjectBlock);

// ============ 装饰：散落的几何体（"小石头"） ============
const decoColors = [0xc4baa3, 0xb5a890, 0xa89880];
for(let i = 0; i < 40; i++){
  const size = Math.random()*0.8 + 0.4;
  const geo = Math.random() > 0.5
    ? new THREE.BoxGeometry(size, size*0.6, size)
    : new THREE.IcosahedronGeometry(size*0.6, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: decoColors[Math.floor(Math.random()*3)], roughness:0.9
  });
  const m = new THREE.Mesh(geo, mat);
  // 避开车辆出生点
  let x,z;
  do{
    x = (Math.random()-0.5) * 100;
    z = (Math.random()-0.5) * 100;
  } while(Math.abs(x) < 6 && Math.abs(z) < 6);
  m.position.set(x, size*0.3, z);
  m.rotation.y = Math.random() * Math.PI * 2;
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// 几棵"树"
function makeTree(x, z){
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.2, 1.4),
    new THREE.MeshStandardMaterial({color:0x6b4423, roughness:0.9})
  );
  trunk.position.set(x, 0.7, z);
  trunk.castShadow = true;
  scene.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(0.9, 1.8, 8),
    new THREE.MeshStandardMaterial({color:0x5a7d5a, roughness:0.85})
  );
  leaves.position.set(x, 2.0, z);
  leaves.castShadow = true;
  scene.add(leaves);
}
for(let i=0;i<12;i++){
  let x,z;
  do{ x = (Math.random()-0.5)*100; z = (Math.random()-0.5)*100; }
  while(Math.abs(x)<10 && Math.abs(z)<10);
  makeTree(x, z);
}

// ============ 3D 文字（姓名） ============
let nameText, projectLabels = [];
const fontLoader = new FontLoader();
const bar = document.getElementById('bar');
bar.style.width = '40%';

fontLoader.load(
  'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_regular.typeface.json',
  (font) => {
    bar.style.width = '90%';

    // 主姓名
    const nameGeo = new TextGeometry('TENG MEIMING', {
      font, size:2.2, height:0.5,
      curveSegments:6, bevelEnabled:true,
      bevelThickness:0.05, bevelSize:0.03, bevelSegments:3
    });
    nameGeo.computeBoundingBox();
    const w = nameGeo.boundingBox.max.x - nameGeo.boundingBox.min.x;
    nameGeo.translate(-w/2, 0, 0);
    const nameMat = new THREE.MeshStandardMaterial({color:0x1b1a17, roughness:0.4, metalness:0.1});
    nameText = new THREE.Mesh(nameGeo, nameMat);
    nameText.position.set(0, 0.5, 0);
    nameText.castShadow = true;
    scene.add(nameText);

    // 项目方块旁边的小标签
    PROJECTS.forEach(p=>{
      const labelText = p.name || p.id;
      const labelGeo = new TextGeometry(labelText, {
        font, size:0.55, height:0.1,
        curveSegments:4
      });
      labelGeo.computeBoundingBox();
      const lw = labelGeo.boundingBox.max.x - labelGeo.boundingBox.min.x;
      labelGeo.translate(-lw/2, 0, 0);
      const labelMat = new THREE.MeshStandardMaterial({color:0x1b1a17});
      const label = new THREE.Mesh(labelGeo, labelMat);
      label.position.set(p.pos[0], p.size[1] + 0.5, p.pos[2] + p.size[2]/2 + 0.1);
      label.castShadow = true;
      scene.add(label);
      projectLabels.push(label);
    });

    bar.style.width = '100%';
    setTimeout(()=>{
      document.getElementById('loader').classList.add('hidden');
    }, 400);
  },
  (xhr)=>{ bar.style.width = (40 + xhr.loaded/xhr.total*50) + '%'; },
  ()=>{
    // font load failed, still continue
    document.getElementById('loader').classList.add('hidden');
  }
);

// ============ 控制 ============
const keys = {w:false,a:false,s:false,d:false};
document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(k==='w'||k==='arrowup') keys.w = true;
  if(k==='a'||k==='arrowleft') keys.a = true;
  if(k==='s'||k==='arrowdown') keys.s = true;
  if(k==='d'||k==='arrowright') keys.d = true;
  if(k==='escape') closeDialog();
});
document.addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(k==='w'||k==='arrowup') keys.w = false;
  if(k==='a'||k==='arrowleft') keys.a = false;
  if(k==='s'||k==='arrowdown') keys.s = false;
  if(k==='d'||k==='arrowright') keys.d = false;
});

// 触屏按钮
document.querySelectorAll('#touch button').forEach(btn=>{
  const k = btn.dataset.key;
  const down = e=>{ e.preventDefault(); keys[k]=true; };
  const up = e=>{ e.preventDefault(); keys[k]=false; };
  btn.addEventListener('touchstart', down);
  btn.addEventListener('touchend', up);
  btn.addEventListener('mousedown', down);
  btn.addEventListener('mouseup', up);
});

// 相机控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI/2 - 0.1;
controls.target.copy(car.position);

// ============ Dialog ============
let activeDialogId = null;
function openDialog(proj){
  if(activeDialogId === proj.id) return;
  activeDialogId = proj.id;
  document.getElementById('dlg-label').textContent = proj.label;
  document.getElementById('dlg-title').textContent = proj.title;
  document.getElementById('dlg-body').textContent = proj.body;
  document.getElementById('dlg-meta').innerHTML = proj.meta.split(' · ').map(s=>{
    if(s.includes('@')) return `<a href="mailto:${s}">${s}</a>`;
    if(s.startsWith('github.com')) return `<a href="https://${s}" target="_blank">${s}</a>`;
    return `<span>${s}</span>`;
  }).join('');
  document.getElementById('dialog').classList.add('open');
}
window.closeDialog = function(){
  activeDialogId = null;
  document.getElementById('dialog').classList.remove('open');
};

// ============ 动画循环 ============
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // 车辆控制
  if(keys.w) carState.speed = Math.min(carState.speed + carState.accel, carState.maxSpeed);
  else if(keys.s) carState.speed = Math.max(carState.speed - carState.brake, -carState.maxSpeed*0.5);
  else carState.speed *= carState.friction;

  if(Math.abs(carState.speed) > 0.001){
    const turn = (keys.a ? 1 : 0) - (keys.d ? 1 : 0);
    carState.heading += turn * carState.turnRate * Math.sign(carState.speed) * Math.min(Math.abs(carState.speed)/carState.maxSpeed, 1);
  }

  car.position.x += Math.sin(carState.heading) * carState.speed;
  car.position.z += Math.cos(carState.heading) * carState.speed;
  car.rotation.y = carState.heading;

  // 边界
  car.position.x = Math.max(-55, Math.min(55, car.position.x));
  car.position.z = Math.max(-55, Math.min(55, car.position.z));

  // 轮子滚动
  wheels.forEach(w=>{ w.rotation.x -= carState.speed * 2; });

  // 相机跟随
  const camTargetX = car.position.x;
  const camTargetZ = car.position.z;
  controls.target.lerp(new THREE.Vector3(camTargetX, 1, camTargetZ), 0.08);
  // 相机距离根据速度推远
  controls.update();

  // 项目交互
  let nearestProj = null;
  let nearestDist = Infinity;
  projectMeshes.forEach(g=>{
    const dx = g.position.x - car.position.x;
    const dz = g.position.z - car.position.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    // 浮动小球动画
    if(g.userData.orb) g.userData.orb.position.y = g.userData.size[1] + 3.2 + Math.sin(t*2 + g.position.x)*0.15;
    if(g.userData.beam) g.userData.beam.material.opacity = 0.3 + Math.sin(t*1.5)*0.1;
    if(d < nearestDist){ nearestDist = d; nearestProj = g.userData; }
  });
  if(nearestDist < interactionRadius && nearestProj){
    openDialog(nearestProj);
  } else if(nearestDist > interactionRadius + 1.5 && activeDialogId){
    closeDialog();
  }

  // 速度计
  document.getElementById('speed').textContent = Math.round(Math.abs(carState.speed)/carState.maxSpeed * 120);

  renderer.render(scene, camera);
}

// 初始相机位置
camera.position.set(0, 8, 14);
controls.update();

animate();

// ============ 响应 resize ============
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>


<!-- ============ 烟花点击效果（参考 eduardbodak.com） ============ -->
<style>
.spark{
  position:fixed; pointer-events:none; z-index:9998;
  width:6px; height:6px; border-radius:50%;
  will-change:transform, opacity;
}
@media (hover:none), (pointer:coarse){
  /* 移动端禁用，避免在滚动时误触 */
  .spark{display:none}
}
</style>
<script>
(function(){
  // 8 方向 + 中式书院 5 色
  var COLORS = ['#7F2020','#a02828','#869B7E','#C9CAAC','#c9a35a'];
  function spark(x, y, angle, color){
    var s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.background = color;
    document.body.appendChild(s);
    var anim = s.animate([
      {transform:'translate(-50%,-50%) rotate('+angle+'deg) translate(8px,0) scale(1)', opacity:1},
      {transform:'translate(-50%,-50%) rotate('+angle+'deg) translate(28px,0) scale(.6,.85)', opacity:.9, offset:.65},
      {transform:'translate(-50%,-50%) rotate('+angle+'deg) translate(38px,0) scale(0,0)', opacity:0}
    ], {duration:480, easing:'cubic-bezier(.22,.6,.4,1)', fill:'forwards'});
    anim.onfinish = function(){ s.remove(); };
  }
  document.addEventListener('click', function(e){
    // 触屏 / pointer 设备跳过
    if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
    // 主鼠标左键
    if(e.button !== 0) return;
    for(var i = 0; i < 8; i++){
      var ang = i * 45;
      var col = COLORS[(i + Math.floor(Math.random()*COLORS.length)) % COLORS.length];
      spark(e.clientX, e.clientY, ang, col);
    }
  }, {passive:true});
})();
</script>
