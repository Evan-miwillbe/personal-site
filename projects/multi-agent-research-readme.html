<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-Agent Research · README · 滕美名</title>
<meta name="description" content="Multi-Agent Deep Research Framework 完整设计决策叙事 — v9.0 / 31 轮实验 / 77 commits" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3EB;
    --card:#fdfaf3;
    --ink:#2a2520;
    --ink-soft:#6b6358;
    --ink-mute:#a39d8e;
    --line:#dcd5c1;
    --line-soft:#ebe5d2;
    --accent:#7F2020;
    --accent-hover:#a02828;
    --accent-soft:#f0e1de;
    --sage:#869B7E;
    --sand-soft:#e6e3d0;
    --display:"Cormorant Garamond","Noto Serif SC",ui-serif,serif;
    --serif:"Fraunces","Noto Serif SC",ui-serif,serif;
    --hanzi:"Noto Serif SC","Songti SC",serif;
    --sans:"Inter","HarmonyOS Sans SC","PingFang SC",ui-sans-serif,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  ::selection{background:var(--accent);color:#fff}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 800px 400px at 100% -10%, var(--accent-soft), transparent),
      radial-gradient(ellipse 600px 400px at 0% 80%, var(--sand-soft), transparent);
    opacity:.5;
  }
  a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--accent-soft);transition:color .2s}
  a:hover{color:var(--accent-hover);text-decoration-color:var(--accent)}
  .container{max-width:840px;margin:0 auto;padding:0 28px;position:relative;z-index:1}

  /* ============ Top ============ */
  header.top{
    padding:24px 0;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);margin-bottom:48px;
    position:sticky;top:0;background:rgba(246,243,235,.92);backdrop-filter:blur(8px);z-index:50;
  }
  .back-link{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);
    text-decoration:none;padding:6px 12px;border-radius:6px;transition:all .2s;
    letter-spacing:.04em;border:none;
  }
  .back-link:hover{background:var(--accent-soft);color:var(--accent)}
  .logo{
    display:flex;align-items:center;gap:10px;
    font-family:var(--serif);font-size:16px;font-weight:600;
    text-decoration:none;border:none;color:var(--ink);
  }
  .logo .seal{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;background:var(--accent);color:var(--bg);
    border-radius:4px;font-family:var(--hanzi);font-size:14px;font-weight:600;
    transform:rotate(-3deg);position:relative;
  }
  .logo .seal::after{
    content:"";position:absolute;inset:-3px;
    border:1px solid var(--accent);border-radius:5px;
    transform:rotate(2deg);opacity:.4;
  }

  /* ============ Header meta ============ */
  .doc-meta{
    margin-bottom:48px;padding-bottom:32px;border-bottom:1px solid var(--line);
  }
  .doc-meta .crumbs{
    display:flex;gap:8px;font-family:var(--mono);font-size:11px;
    color:var(--accent);letter-spacing:.18em;text-transform:uppercase;
    margin-bottom:16px;
  }
  .doc-meta .crumbs span:not(:last-child)::after{content:"·";margin-left:8px;color:var(--ink-mute)}
  .doc-meta .source{
    margin-top:12px;
    font-family:var(--mono);font-size:11px;color:var(--ink-mute);
    letter-spacing:.04em;
  }
  .doc-meta .source a{color:var(--ink-soft);text-decoration:none;border-bottom:1px dashed var(--line)}
  .doc-meta .source a:hover{color:var(--accent);border-color:var(--accent)}

  /* ============ README content (rendered from .md) ============ */
  #readme-content{padding-bottom:96px}
  #readme-content h1{
    font-family:var(--display);font-style:italic;font-weight:600;
    font-size:48px;line-height:1.1;letter-spacing:-.02em;
    margin:0 0 20px;color:var(--ink);
  }
  #readme-content h2{
    font-family:var(--display);font-style:italic;font-weight:500;
    font-size:32px;line-height:1.2;letter-spacing:-.01em;
    margin:64px 0 18px;color:var(--accent);
    padding-top:28px;border-top:1px solid var(--line);
  }
  #readme-content h2:first-of-type{border-top:none;padding-top:0;margin-top:48px}
  #readme-content h3{
    font-family:var(--serif);font-weight:600;
    font-size:22px;line-height:1.3;letter-spacing:-.005em;
    margin:40px 0 14px;color:var(--ink);
  }
  #readme-content h4{
    font-family:var(--serif);font-weight:600;
    font-size:17px;line-height:1.4;
    margin:28px 0 10px;color:var(--ink);
  }
  #readme-content h5, #readme-content h6{
    font-family:var(--mono);font-weight:600;font-size:12px;
    letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);margin:24px 0 8px;
  }
  #readme-content p{
    margin:0 0 18px;color:var(--ink);font-size:16px;line-height:1.85;
  }
  #readme-content p strong, #readme-content li strong{color:var(--accent);font-weight:600}
  #readme-content p em, #readme-content li em{
    color:var(--ink);font-style:italic;font-family:var(--serif);
    background:linear-gradient(transparent 60%, var(--accent-soft) 60%);
    padding:0 2px;
  }
  #readme-content ul, #readme-content ol{
    margin:0 0 22px 0;padding-left:24px;color:var(--ink);
  }
  #readme-content li{margin-bottom:8px;line-height:1.8}
  #readme-content li > ul, #readme-content li > ol{margin-top:8px;margin-bottom:0}
  #readme-content blockquote{
    border-left:3px solid var(--accent);
    padding:8px 0 8px 22px;margin:22px 0;
    font-family:var(--serif);font-style:italic;
    color:var(--ink-soft);font-size:17px;line-height:1.7;
    background:linear-gradient(90deg, var(--accent-soft) 0%, transparent 30%);
  }
  #readme-content blockquote p{margin-bottom:0;color:inherit;font-size:inherit}
  #readme-content code{
    font-family:var(--mono);font-size:.88em;
    background:var(--accent-soft);color:var(--accent);
    padding:2px 6px;border-radius:3px;
  }
  #readme-content pre{
    background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:18px 22px;margin:22px 0;overflow-x:auto;
    font-family:var(--mono);font-size:13px;line-height:1.65;
    color:var(--ink);
  }
  #readme-content pre code{
    background:transparent;color:inherit;padding:0;font-size:inherit;
  }
  #readme-content hr{
    border:none;height:1px;background:var(--line);margin:48px 0;
  }
  #readme-content table{
    width:100%;border-collapse:collapse;margin:22px 0;
    font-size:14.5px;
  }
  #readme-content thead{
    background:var(--sand-soft);
  }
  #readme-content th{
    text-align:left;padding:12px 14px;
    font-family:var(--mono);font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);font-weight:600;
    border-bottom:2px solid var(--accent);
  }
  #readme-content td{
    padding:12px 14px;border-bottom:1px solid var(--line);
    color:var(--ink);vertical-align:top;line-height:1.65;
  }
  #readme-content tr:last-child td{border-bottom:none}
  #readme-content tbody tr:hover{background:var(--accent-soft)}
  #readme-content img{max-width:100%;height:auto;border-radius:4px;margin:18px 0}

  /* ============ Loading state ============ */
  .loading{
    text-align:center;padding:120px 0;
    color:var(--ink-mute);font-family:var(--mono);font-size:13px;
    letter-spacing:.12em;
  }
  .loading::after{
    content:"";display:inline-block;width:14px;height:14px;margin-left:8px;
    border:2px solid var(--accent-soft);border-top-color:var(--accent);
    border-radius:50%;vertical-align:middle;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .error{
    background:var(--accent-soft);border-left:3px solid var(--accent);
    padding:18px 22px;color:var(--accent);font-size:14px;line-height:1.7;
    margin:32px 0;border-radius:0 4px 4px 0;
  }

  /* ============ Footer ============ */
  footer.foot{
    text-align:center;padding:32px 0 48px;
    color:var(--ink-mute);font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    border-top:1px solid var(--line);margin-top:32px;
  }
  footer.foot a{color:var(--ink-soft);border:none;text-decoration:underline;text-underline-offset:2px}
  footer.foot a:hover{color:var(--accent)}

  /* ============ Top scroll-to-top button ============ */
  .scroll-top{
    position:fixed;bottom:32px;right:32px;
    width:42px;height:42px;border-radius:50%;
    background:var(--accent);color:var(--bg);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-style:italic;font-size:18px;
    box-shadow:0 4px 14px rgba(127,32,32,.25);
    opacity:0;pointer-events:none;
    transition:opacity .3s, transform .3s;
    z-index:100;
  }
  .scroll-top.visible{opacity:1;pointer-events:auto}
  .scroll-top:hover{background:var(--accent-hover);transform:translateY(-2px)}

  @media(max-width:768px){
    #readme-content h1{font-size:36px}
    #readme-content h2{font-size:26px}
    #readme-content h3{font-size:19px}
    #readme-content pre{padding:14px 16px;font-size:12px}
    .container{padding:0 20px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding-top:0;padding-bottom:0">
    <a href="multi-agent-research.html" class="back-link"><span>←</span> 回到项目页</a>
    <a href="../index.html" class="logo"><span class="seal">滕</span>Teng Meiming</a>
  </div>
</header>

<div class="container">
  <div class="doc-meta">
    <div class="crumbs">
      <span>Multi-Agent Research</span>
      <span>README</span>
      <span>v9.0 / 1000 行 / 31 轮实验</span>
    </div>
    <div class="source">
      源文件：<code style="font-family:var(--mono);font-size:11px;background:transparent;color:var(--ink-soft);padding:0">~/.claude/skills/multi-agent-research/README.md</code>
      &nbsp;·&nbsp;
      <a href="https://github.com/Evan-miwillbe/multi-agent-research#readme" target="_blank">GitHub 原版 ↗</a>
      &nbsp;·&nbsp;
      <a href="../files/multi-agent-research-README.md" download>下载 .md ↓</a>
    </div>
  </div>

  <div id="readme-content">
    <div class="loading">加载 README 中</div>
  </div>
</div>

<button class="scroll-top" id="scrollTop" aria-label="回到顶部">↑</button>

<footer class="foot">
  <div class="container">
    Made by 滕美名 · 2026 · Shanghai &nbsp;|&nbsp;
    <a href="../index.html">主页</a> · <a href="../editorial.html">编辑版</a> · <a href="multi-agent-research.html">项目页</a>
  </div>
</footer>

<!-- marked.js for client-side markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
(function(){
  var content = document.getElementById('readme-content');
  var mdUrl = '../files/multi-agent-research-README.md';

  fetch(mdUrl)
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function(md){
      // marked.js v12+ uses parse()
      marked.setOptions({
        gfm: true,
        breaks: false,
        headerIds: true
      });
      content.innerHTML = marked.parse(md);
    })
    .catch(function(err){
      content.innerHTML =
        '<div class="error">'
        + '<strong>加载失败：</strong> ' + err.message
        + '<br/>请直接<a href="' + mdUrl + '" download>下载 .md 文件</a>'
        + '或<a href="https://github.com/Evan-miwillbe/multi-agent-research#readme" target="_blank">访问 GitHub 原版</a>。'
        + '</div>';
    });

  // Scroll-to-top
  var btn = document.getElementById('scrollTop');
  window.addEventListener('scroll', function(){
    if(window.scrollY > 400) btn.classList.add('visible');
    else btn.classList.remove('visible');
  });
  btn.addEventListener('click', function(){
    window.scrollTo({top:0,behavior:'smooth'});
  });
})();
</script>

</body>
</html>
