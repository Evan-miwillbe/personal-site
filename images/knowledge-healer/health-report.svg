<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" font-family="'EB Garamond', 'Songti SC', sans-serif">
  <rect width="1280" height="960" fill="#F6F3EB"/>

  <!-- 飞书文档外框 -->
  <rect x="20" y="20" width="1240" height="920" fill="#FFFFFF" stroke="#1c1916" stroke-width="1"/>
  <rect x="20" y="20" width="1240" height="36" fill="#F4F4F4"/>
  <g transform="translate(38,32)">
    <circle r="6" fill="#FF5F57"/>
    <circle cx="20" cy="0" r="6" fill="#FEBC2E"/>
    <circle cx="40" cy="0" r="6" fill="#28C840"/>
  </g>
  <text x="640" y="40" text-anchor="middle" font-family="'Songti SC', serif" font-size="11" fill="#1c1916" opacity=".6">知识库健康报告 · 飞书文档</text>

  <!-- 文档主体 -->
  <g transform="translate(80,90)">
    <!-- 顶部标题 -->
    <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">KNOWLEDGE HEALER · 巡检报告</text>
    <text y="44" font-size="32" font-weight="500" fill="#1c1916" font-family="'Songti SC', serif">知识库健康报告 <tspan font-style="italic" fill="#7F2020">2026-05-05</tspan></text>
    <text y="74" font-size="13" fill="#1c1916" opacity=".5" font-family="'JetBrains Mono', monospace" letter-spacing="2">
      WIKI://YOUR-SPACE-TOKEN · DEPTH 3 · FULL SCAN · TIME 4:23
    </text>

    <!-- 三大顶部指标 -->
    <g transform="translate(0,110)">
      <!-- 健康评分 -->
      <g transform="translate(0,0)">
        <rect width="360" height="120" fill="#7F2020"/>
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F6F3EB" opacity=".8" letter-spacing="3">HEALTH SCORE</text>
        <text x="24" y="90" font-family="'EB Garamond', serif" font-size="72" font-style="italic" font-weight="600" fill="#F6F3EB">72<tspan font-size="28" font-style="normal">/100</tspan></text>
        <text x="280" y="90" font-family="'JetBrains Mono', monospace" font-size="14" fill="#F6F3EB" opacity=".75">↑ 5</text>
        <text x="24" y="108" font-family="'Songti SC', serif" font-size="11" fill="#F6F3EB" opacity=".75">较上次提升</text>
      </g>

      <!-- 复利指数 -->
      <g transform="translate(376,0)">
        <rect width="360" height="120" fill="#869B7E"/>
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F6F3EB" opacity=".85" letter-spacing="3">复利指数 · INDEX</text>
        <text x="24" y="90" font-family="'EB Garamond', serif" font-size="72" font-style="italic" font-weight="600" fill="#F6F3EB">0.45</text>
        <text x="240" y="90" font-size="32" fill="#F6F3EB">🟡</text>
        <text x="24" y="108" font-family="'Songti SC', serif" font-size="11" fill="#F6F3EB" opacity=".85">增长放缓 · 警戒区</text>
      </g>

      <!-- 文档总数 -->
      <g transform="translate(752,0)">
        <rect width="360" height="120" fill="#C9CAAC"/>
        <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1c1916" opacity=".7" letter-spacing="3">文档总数 · DOCS</text>
        <text x="24" y="90" font-family="'EB Garamond', serif" font-size="72" font-style="italic" font-weight="600" fill="#1c1916">156</text>
        <text x="24" y="108" font-family="'Songti SC', serif" font-size="11" fill="#1c1916" opacity=".7">扫描全部空间 · 含群聊样本</text>
      </g>
    </g>

    <!-- 7 维矩阵 -->
    <g transform="translate(0,266)">
      <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">SEVEN DIMENSION DIAGNOSIS · 七维健康诊断</text>

      <!-- 表头 -->
      <g transform="translate(0,18)" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1c1916">
        <rect width="1112" height="32" fill="#F0F0F0"/>
        <text x="20" y="20" letter-spacing="2">维度</text>
        <text x="320" y="20" letter-spacing="2" text-anchor="middle">总数</text>
        <text x="450" y="20" letter-spacing="2" text-anchor="middle">P0</text>
        <text x="540" y="20" letter-spacing="2" text-anchor="middle">P1</text>
        <text x="630" y="20" letter-spacing="2" text-anchor="middle">P2</text>
        <text x="780" y="20" letter-spacing="2">代表性发现</text>
      </g>

      <!-- 7 行数据 -->
      <g transform="translate(0,54)" font-family="'Songti SC', serif" font-size="12" fill="#1c1916">
        <g transform="translate(0,0)">
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500">过期 OBSOLETE</text>
          <text x="320" y="22" text-anchor="middle">12</text>
          <text x="450" y="22" text-anchor="middle" fill="#7F2020" font-weight="600">2</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">5</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">5</text>
          <text x="780" y="22" opacity=".7">入职指南最后更新 91 天前</text>
        </g>
        <g transform="translate(0,32)">
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500">冲突 CONFLICT</text>
          <text x="320" y="22" text-anchor="middle">3</text>
          <text x="450" y="22" text-anchor="middle" fill="#7F2020" font-weight="600">1</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">2</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">0</text>
          <text x="780" y="22" opacity=".7">"裂变"主题有 3 个版本文档</text>
        </g>
        <g transform="translate(0,64)">
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500">断链 BROKEN-LINK</text>
          <text x="320" y="22" text-anchor="middle">8</text>
          <text x="450" y="22" text-anchor="middle" opacity=".3">0</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">3</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">5</text>
          <text x="780" y="22" opacity=".7">指向已删除文档的内部引用</text>
        </g>
        <g transform="translate(0,96)">
          <rect x="-8" y="-2" width="1120" height="34" fill="#7F2020" opacity=".06"/>
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500" fill="#7F2020">漂移 DRIFT</text>
          <text x="320" y="22" text-anchor="middle" font-weight="500">4</text>
          <text x="450" y="22" text-anchor="middle" fill="#7F2020" font-weight="700">2</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">2</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">0</text>
          <text x="780" y="22" opacity=".85" font-style="italic" fill="#7F2020">报销流程文档与实际操作不一致</text>
        </g>
        <g transform="translate(0,128)">
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500">管线泄漏 LEAKAGE</text>
          <text x="320" y="22" text-anchor="middle">6</text>
          <text x="450" y="22" text-anchor="middle" fill="#7F2020" font-weight="600">2</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">3</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">1</text>
          <text x="780" y="22" opacity=".7">"VPN 配置"在群里被问了 7 次</text>
        </g>
        <g transform="translate(0,160)">
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500">捕获箱老化 STAGNANT</text>
          <text x="320" y="22" text-anchor="middle">5</text>
          <text x="450" y="22" text-anchor="middle" opacity=".3">0</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">2</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">3</text>
          <text x="780" y="22" opacity=".7">入口流量 &gt; 处理速率 · 堆积中</text>
        </g>
        <g transform="translate(0,192)">
          <line x1="0" y1="0" x2="1112" y2="0" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
          <text x="20" y="22" font-weight="500">覆盖空洞 SKELETON</text>
          <text x="320" y="22" text-anchor="middle">4</text>
          <text x="450" y="22" text-anchor="middle" fill="#7F2020" font-weight="600">1</text>
          <text x="540" y="22" text-anchor="middle" fill="#869B7E">2</text>
          <text x="630" y="22" text-anchor="middle" opacity=".5">1</text>
          <text x="780" y="22" opacity=".7">有标题无内容的骨架页面</text>
        </g>
        <line x1="0" y1="224" x2="1112" y2="224" stroke="#1c1916" stroke-width=".3" opacity=".2"/>
      </g>
    </g>

    <!-- P0 修复 callout -->
    <g transform="translate(0,580)">
      <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">PRIORITY ZERO · 立即修复</text>

      <g transform="translate(0,18)">
        <rect width="1112" height="80" fill="#7F2020" opacity=".06"/>
        <rect width="4" height="80" fill="#7F2020"/>
        <text x="24" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">P0 · 漂移</text>
        <text x="24" y="50" font-family="'Songti SC', serif" font-size="15" font-weight="500" fill="#1c1916">报销流程文档与实际操作不一致</text>
        <text x="24" y="70" font-family="'Songti SC', serif" font-size="12" fill="#1c1916" opacity=".7">
          证据：财务群 3 人在 7 天内说"直接提交"流程 · 文档第 3 步仍写"先填表 → 主管签字"
        </text>
        <g transform="translate(900,30)">
          <rect width="180" height="36" fill="#7F2020"/>
          <text x="90" y="22" text-anchor="middle" font-family="'Songti SC', serif" font-size="12" fill="#F6F3EB">@张三 修复</text>
        </g>
      </g>

      <g transform="translate(0,110)">
        <rect width="1112" height="80" fill="#7F2020" opacity=".06"/>
        <rect width="4" height="80" fill="#7F2020"/>
        <text x="24" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">P0 · 管线泄漏</text>
        <text x="24" y="50" font-family="'Songti SC', serif" font-size="15" font-weight="500" fill="#1c1916">"如何配置 VPN"在技术群被问了 7 次</text>
        <text x="24" y="70" font-family="'Songti SC', serif" font-size="12" fill="#1c1916" opacity=".7">
          5 人分别回答，内容高度一致但 wiki 无此页面 · 预估 15 分钟可整理入库
        </text>
        <g transform="translate(900,30)">
          <rect width="180" height="36" fill="#7F2020"/>
          <text x="90" y="22" text-anchor="middle" font-family="'Songti SC', serif" font-size="12" fill="#F6F3EB">创建 wiki 页面</text>
        </g>
      </g>
    </g>

  </g>
</svg>
