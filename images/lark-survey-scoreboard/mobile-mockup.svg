<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'EB Garamond', 'Songti SC', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F3EB"/>
      <stop offset="100%" stop-color="#EFEBE0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feFlood flood-color="#1c1916" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>

  <!-- 标题 -->
  <g transform="translate(60,60)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">MOBILE FLOW · 3 SCREENS</text>
    <text y="32" font-size="28" font-weight="500" fill="#1c1916" font-family="'Songti SC', serif">扫码即评 · <tspan font-style="italic" fill="#7F2020">三步完成</tspan></text>
  </g>

  <!-- 三个手机框 -->
  <!-- 手机框模板：宽 240，高 480，圆角 28 -->

  <!-- Phone 1: 评分页 -->
  <g transform="translate(140,150)" filter="url(#shadow)">
    <rect width="240" height="480" rx="28" fill="#1c1916"/>
    <rect x="6" y="6" width="228" height="468" rx="22" fill="#F6F3EB"/>
    <!-- 顶部状态栏 -->
    <rect x="6" y="6" width="228" height="32" rx="22" fill="#F6F3EB"/>
    <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1c1916">9:41</text>
    <g transform="translate(190,18)">
      <rect width="14" height="8" rx="1" fill="#1c1916" opacity=".5"/>
      <circle cx="22" cy="4" r="3" fill="#869B7E"/>
    </g>
    <!-- 顶部 logo -->
    <text x="120" y="68" text-anchor="middle" font-family="'Songti SC', serif" font-size="11" fill="#7F2020" letter-spacing="2">销售代教培训反馈</text>
    <line x1="40" y1="78" x2="200" y2="78" stroke="#7F2020" stroke-width=".5" opacity=".4"/>
    <!-- 第一题 -->
    <text x="22" y="106" font-family="'Songti SC', serif" font-size="11" fill="#1c1916" opacity=".6">1 / 5</text>
    <text x="22" y="128" font-family="'Songti SC', serif" font-size="13" font-weight="500" fill="#1c1916">讲师专业度</text>
    <!-- 5 星 -->
    <g transform="translate(22,150)" font-family="'EB Garamond', serif">
      <text x="0" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="32" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="64" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="96" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="128" y="20" font-size="32" fill="#1c1916" opacity=".25">★</text>
      <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#869B7E">4 / 5</text>
    </g>
    <!-- 第二题 -->
    <line x1="22" y1="220" x2="218" y2="220" stroke="#1c1916" stroke-width=".3" opacity=".15"/>
    <text x="22" y="240" font-family="'Songti SC', serif" font-size="11" fill="#1c1916" opacity=".6">2 / 5</text>
    <text x="22" y="262" font-family="'Songti SC', serif" font-size="13" font-weight="500" fill="#1c1916">讲解清晰度</text>
    <g transform="translate(22,284)">
      <text x="0" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="32" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="64" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="96" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="128" y="20" font-size="32" fill="#7F2020">★</text>
      <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#869B7E">5 / 5</text>
    </g>
    <!-- 进度条 -->
    <g transform="translate(22,400)">
      <rect width="196" height="3" rx="1.5" fill="#1c1916" opacity=".1"/>
      <rect width="78" height="3" rx="1.5" fill="#7F2020"/>
      <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1c1916" opacity=".6">2 / 5 已完成</text>
    </g>
    <!-- 下一题按钮 -->
    <rect x="22" y="438" width="196" height="32" rx="3" fill="#7F2020"/>
    <text x="120" y="458" text-anchor="middle" font-family="'Songti SC', serif" font-size="12" fill="#F6F3EB">下 一 题 →</text>

    <!-- 标签 -->
    <text x="120" y="514" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1c1916" opacity=".6" letter-spacing="2">i · RATING</text>
  </g>

  <!-- Phone 2: 提交后 -->
  <g transform="translate(480,150)" filter="url(#shadow)">
    <rect width="240" height="480" rx="28" fill="#1c1916"/>
    <rect x="6" y="6" width="228" height="468" rx="22" fill="#F6F3EB"/>
    <rect x="6" y="6" width="228" height="32" rx="22" fill="#F6F3EB"/>
    <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1c1916">9:42</text>
    <g transform="translate(190,18)">
      <rect width="14" height="8" rx="1" fill="#1c1916" opacity=".5"/>
      <circle cx="22" cy="4" r="3" fill="#869B7E"/>
    </g>

    <text x="120" y="68" text-anchor="middle" font-family="'Songti SC', serif" font-size="11" fill="#7F2020" letter-spacing="2">销售代教培训反馈</text>
    <line x1="40" y1="78" x2="200" y2="78" stroke="#7F2020" stroke-width=".5" opacity=".4"/>

    <!-- 第三题 - 文本反馈 -->
    <text x="22" y="106" font-family="'Songti SC', serif" font-size="11" fill="#1c1916" opacity=".6">5 / 5</text>
    <text x="22" y="128" font-family="'Songti SC', serif" font-size="13" font-weight="500" fill="#1c1916">还想听什么主题？</text>

    <!-- 文本框 -->
    <rect x="22" y="146" width="196" height="120" rx="3" fill="#F6F3EB" stroke="#869B7E" stroke-width=".8"/>
    <text x="32" y="172" font-family="'Songti SC', serif" font-size="11" fill="#1c1916">想再深入听 ROI 测算的</text>
    <text x="32" y="192" font-family="'Songti SC', serif" font-size="11" fill="#1c1916">实际案例，以及如何把</text>
    <text x="32" y="212" font-family="'Songti SC', serif" font-size="11" fill="#1c1916">销售带教数据可视化。</text>
    <text x="32" y="238" font-family="'Songti SC', serif" font-size="11" fill="#1c1916" opacity=".4">|</text>

    <!-- 字数 -->
    <text x="208" y="284" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#869B7E">38 / 200</text>

    <!-- 提交按钮 -->
    <rect x="22" y="400" width="196" height="38" rx="3" fill="#7F2020"/>
    <text x="120" y="423" text-anchor="middle" font-family="'Songti SC', serif" font-size="13" fill="#F6F3EB" font-weight="500">提  交</text>

    <!-- 进度满 -->
    <g transform="translate(22,378)">
      <rect width="196" height="3" rx="1.5" fill="#1c1916" opacity=".1"/>
      <rect width="196" height="3" rx="1.5" fill="#7F2020"/>
    </g>

    <text x="120" y="514" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1c1916" opacity=".6" letter-spacing="2">ii · SUBMIT</text>
  </g>

  <!-- Phone 3: 完成确认 -->
  <g transform="translate(820,150)" filter="url(#shadow)">
    <rect width="240" height="480" rx="28" fill="#1c1916"/>
    <rect x="6" y="6" width="228" height="468" rx="22" fill="#F6F3EB"/>
    <rect x="6" y="6" width="228" height="32" rx="22" fill="#F6F3EB"/>
    <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1c1916">9:42</text>
    <g transform="translate(190,18)">
      <rect width="14" height="8" rx="1" fill="#1c1916" opacity=".5"/>
      <circle cx="22" cy="4" r="3" fill="#869B7E"/>
    </g>

    <!-- 大对勾印章 -->
    <g transform="translate(120,200)">
      <circle r="48" fill="none" stroke="#7F2020" stroke-width="2"/>
      <circle r="42" fill="none" stroke="#7F2020" stroke-width=".5"/>
      <path d="M -20 0 L -5 18 L 24 -16" fill="none" stroke="#7F2020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="120" y="298" text-anchor="middle" font-family="'Songti SC', serif" font-size="20" font-weight="500" fill="#1c1916">感谢您的反馈</text>
    <text x="120" y="322" text-anchor="middle" font-family="'Songti SC', serif" font-size="13" fill="#1c1916" opacity=".7">数据已实时同步到大屏</text>

    <!-- 你的位置 -->
    <g transform="translate(22,360)">
      <rect width="196" height="48" rx="3" fill="#F6F3EB" stroke="#869B7E" stroke-width=".8" stroke-dasharray="2 2"/>
      <text x="14" y="20" font-family="'Songti SC', serif" font-size="10" fill="#1c1916" opacity=".6">您是第</text>
      <text x="48" y="22" font-family="'EB Garamond', serif" font-size="20" font-style="italic" font-weight="600" fill="#7F2020">27</text>
      <text x="72" y="20" font-family="'Songti SC', serif" font-size="10" fill="#1c1916" opacity=".6">位反馈者</text>
      <text x="14" y="38" font-family="'Songti SC', serif" font-size="10" fill="#1c1916" opacity=".6">当前平均分</text>
      <text x="74" y="40" font-family="'EB Garamond', serif" font-size="14" font-style="italic" font-weight="500" fill="#7F2020">4.6</text>
      <text x="100" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#869B7E">/ 5.0</text>
    </g>

    <text x="120" y="442" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#869B7E" letter-spacing="2">REAL-TIME · 实时入库</text>

    <text x="120" y="514" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#1c1916" opacity=".6" letter-spacing="2">iii · DONE</text>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(60,720)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1c1916" stroke-width=".5" opacity=".3"/>
    <text y="22" font-family="'Songti SC', serif" font-size="13" fill="#1c1916" opacity=".7">
      <tspan font-style="italic" fill="#7F2020" font-weight="600">三步流程 · </tspan>
      扫码即评 · 5 题 60 秒 · 提交后大屏 1 秒刷新 · 数据存自己的飞书 Base · <tspan font-style="italic" fill="#7F2020">总成本 ¥0</tspan>
    </text>
  </g>
</svg>
