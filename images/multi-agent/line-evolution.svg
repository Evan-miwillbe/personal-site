    <!-- 曲线：v1 1000(y133.33) → v4.3 1382(y31.47) → v5.0 647(y227.47) → v6.3 213(y343.2) → v9.0 453(y279.20) -->
    <path d="M 0 133.33 C 100 80, 200 50, 280 31.47 C 360 100, 430 175, 490 227.47 C 560 280, 645 330, 700 343.2 C 820 330, 940 295, 1040 279.20"
          fill="none" stroke="#7F2020" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 133.33 C 100 80, 200 50, 280 31.47 C 360 100, 430 175, 490 227.47 C 560 280, 645 330, 700 343.2 C 820 330, 940 295, 1040 279.20 L 1040 400 L 0 400 Z"
          fill="#7F2020" opacity=".06"/>

    <g>
      <!-- v1 1000 -->
