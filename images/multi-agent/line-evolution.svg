<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'EB Garamond', 'Cormorant Garamond', 'Songti SC', serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F3EB"/>
      <stop offset="100%" stop-color="#EFEBE0"/>
    </linearGradient>
    <pattern id="noise" patternUnits="userSpaceOnUse" width="120" height="120">
      <rect width="120" height="120" fill="url(#paper)"/>
      <circle cx="20" cy="30" r=".5" fill="#1c1916" opacity=".06"/>
      <circle cx="60" cy="80" r=".4" fill="#1c1916" opacity=".05"/>
      <circle cx="90" cy="20" r=".3" fill="#1c1916" opacity=".04"/>
      <circle cx="40" cy="100" r=".5" fill="#1c1916" opacity=".05"/>
      <circle cx="105" cy="60" r=".3" fill="#1c1916" opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#noise)"/>
  <rect x="40" y="40" width="1200" height="640" fill="none" stroke="#1c1916" stroke-width="1" opacity=".25"/>

  <g transform="translate(80,90)">
    <text font-family="'JetBrains Mono', monospace" font-size="11" fill="#7F2020" letter-spacing="3">FIG. 1 · LINE COUNT EVOLUTION</text>
