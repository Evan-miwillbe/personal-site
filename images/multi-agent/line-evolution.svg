      <text x="280" y="425">v4.3</text>
      <text x="490" y="425">v5.0</text>
      <text x="700" y="425">v6.3</text>
      <text x="1040" y="425">v9.0</text>
    </g>

    <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#869B7E" text-anchor="middle" letter-spacing="1">
      <text x="0" y="445">04.23</text>
      <text x="280" y="445">04.29</text>
      <text x="490" y="445">04.30</text>
      <text x="700" y="445">05.03</text>
      <text x="1040" y="445">05.05</text>
