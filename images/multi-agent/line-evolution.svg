    <text y="68" font-size="15" fill="#1c1916" opacity=".7" font-family="'Songti SC', 'EB Garamond', serif">起步 → 顶峰 → 精简 → 自包含压缩 → 收敛 · 13 天 · 77 commits</text>
  </g>

  <g transform="translate(120,200)">
