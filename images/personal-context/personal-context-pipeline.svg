  <text x="354" y="181" class="section-title">EVIDENCE &amp; CONTEXT</text>
  <text x="644" y="181" class="section-title">AI PRE-PROCESSING</text>
  <text x="934" y="181" class="section-title">HUMAN JUDGMENT</text>

  <rect x="78" y="212" width="182" height="70" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <circle cx="107" cy="242" r="15" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
