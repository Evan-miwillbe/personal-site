  <rect x="354" y="328" width="197" height="74" rx="13" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.3"/>
  <circle cx="383" cy="358" r="15" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2"/>
