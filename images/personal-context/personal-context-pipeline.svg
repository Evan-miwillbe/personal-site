  <text x="673" y="465" text-anchor="middle" class="mono">DF</text>
  <text x="700" y="458" class="node-title">Draft Artifacts</text>
  <text x="700" y="482" class="node-sub">草稿、表格、页面</text>
  <rect x="934" y="226" width="187" height="74" rx="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
  <circle cx="963" cy="256" r="15" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="963" y="261" text-anchor="middle" class="mono">ME</text>
  <text x="990" y="254" class="node-title">判断边界</text>
  <text x="990" y="278" class="node-sub">我决定取舍与方向</text>
  <rect x="934" y="328" width="187" height="74" rx="13" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
  <circle cx="963" cy="358" r="15" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
