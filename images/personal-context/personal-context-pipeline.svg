  <rect x="934" y="430" width="187" height="74" rx="13" fill="#ffffff" stroke="#d1d5db" stroke-width="1.3"/>
  <circle cx="963" cy="460" r="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="963" y="465" text-anchor="middle" class="mono">OUT</text>
  <text x="990" y="458" class="node-title">公开呈现</text>
  <text x="990" y="482" class="node-sub">网站 / 文档 / 项目页</text>

