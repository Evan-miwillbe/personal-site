  <rect x="274" y="596" width="652" height="58" rx="16" fill="#111827" opacity="0.94"/>
  <text x="600" y="621" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Human-in-the-loop</text>
  <text x="600" y="644" text-anchor="middle" fill="#d1d5db" font-size="13">AI 处理噪音、召回材料、发现遗漏；最终判断、取舍和表达由人完成。</text>

  <g transform="translate(64 660)">
