<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Personal Context System</title>
  <desc id="desc">A flow diagram showing personal inputs becoming evidence, context, AI preprocessing, human judgment, and clearer actions.</desc>
  <style>
    text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', SimHei, Arial, sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .section-title { font-size: 14px; font-weight: 700; fill: #374151; letter-spacing: .08em; }
    .node-title { font-size: 17px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 13px; fill: #6b7280; }
    .tiny { font-size: 12px; fill: #6b7280; }
    .mono { font-family: Consolas, Menlo, Monaco, monospace; font-size: 12px; fill: #374151; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
  <circle cx="1070" cy="90" r="92" fill="#eef2ff" opacity="0.75"/>
  <circle cx="102" cy="624" r="110" fill="#ecfdf5" opacity="0.65"/>
  <text x="64" y="70" class="title">Personal Context System</text>
  <text x="64" y="99" class="subtitle">把经历变成证据，把证据变成 context，把 context 变成更清晰的行动。</text>

  <rect x="54" y="145" width="230" height="420" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="330" y="145" width="245" height="420" rx="18" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="620" y="145" width="245" height="420" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="910" y="145" width="235" height="420" rx="18" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
